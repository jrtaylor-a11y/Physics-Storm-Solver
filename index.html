    F("gPerim",S("GP"),ADD(MUL(N(2),S("Gl")),MUL(N(2),S("Gw"))),{name:"perimeter of a rectangle",tags:["geometry"]}),
    F("gTriA",S("GA"),MUL(HALF,S("Gb"),S("Gh")),{name:"area of a triangle",tags:["geometry"]}),
    F("gBox",S("GV"),MUL(S("Gl"),S("Gw"),S("Gh")),{name:"volume of a rectangular prism",tags:["geometry"]}),
    F("gCirc",S("GC"),MUL(N(2),PI,S("Gr")),{name:"circumference of a circle",tags:["geometry"]}),
    F("gTrap",S("GA"),MUL(HALF,ADD(S("Gb1"),S("Gb2")),S("Gh")),{name:"area of a trapezoid",tags:["geometry"]}),
    F("gInterest",S("GI"),MUL(S("GPr"),S("Grt"),S("Gt")),{name:"simple interest",tags:["geometry"]}),
    F("gAngleSum",S("GS"),MUL(N(180),SUB(S("Gn"),N(2))),{name:"sum of a polygon's interior angles",tags:["geometry"]}),
    F("dilution",MUL(S("M1"),S("V1")),MUL(S("M2"),S("V2")),{name:"the dilution equation",tags:["solution"]}),
    F("incpar",S("Fpar"),MUL(S("Fg"),FN("sin",S("th"))),{name:"weight along a slope",tags:["incline"]}),
    F("incperp",S("FN"),MUL(S("Fg"),FN("cos",S("th"))),{name:"normal force on a slope",tags:["incline"]}),
    F("vcompx",S("vx"),MUL(S("v0"),FN("cos",S("th"))),{name:"sideways part of the launch",tags:["projectile"]}),
    F("vcompy",S("v0y"),MUL(S("v0"),FN("sin",S("th"))),{name:"upright part of the launch",tags:["projectile"]}),
    F("range",S("x"),MUL(S("vx"),S("t")),{name:"how far it travels sideways",tags:["projectile"]}),
    F("drop",S("h"),MUL(HALF,S("g"),SQ(S("t"))),{name:"how far it falls from rest",tags:["projectile"]}),
    F("vyfall",S("vy"),MUL(S("g"),S("t")),{name:"upright speed gained while falling",tags:["projectile"]}),
    F("uptime",S("t"),DIV(S("v0y"),S("g")),{name:"time to the top",tags:["projectile"]}),
    F("maxh",S("h"),DIV(SQ(S("v0y")),MUL(N(2),S("g"))),{name:"height gained above the launch",tags:["projectile"]})
  ];
  var BY_ID={};FORMULAS.forEach(function(f){BY_ID[f.id]=f;});
  function byId(id){return BY_ID[id];}
  /* every formula that could finish the job: it holds the unknown and nothing else new */
  function choices(known,unknown,tags){
    return FORMULAS.filter(function(f){
      if(tags&&!tags.some(function(t){return f.tags.indexOf(t)>=0;}))return false;
      if(f.syms.indexOf(unknown)<0)return false;
      return f.syms.every(function(s){return s===unknown||known.indexOf(s)>=0;});
    });
  }

  function fnHTML(fn){return FNAME[fn];}
  var API={SYM:SYM,sym:sym,symHTML:symHTML,symText:symText,fnHTML:fnHTML,S:S,N:N,ADD:ADD,SUB:SUB,MUL:MUL,DIV:DIV,SQ:SQ,RT:RT,FN:FN,HALF:HALF,
    has:has,count:count,numFirst:numFirst,symbols:symbols,html:html,text:text,eqHTML:eqHTML,eqText:eqText,
    isolate:isolate,ev:ev,solveFor:solveFor,evaluate:evaluate,leastSig:leastSig,dims:dims,sameDims:sameDims,relabel:relabel,toBase:toBase,F:F,FORMULAS:FORMULAS,byId:byId,choices:choices};
  root.Fx=API;
  if(typeof module!=="undefined")module.exports=API;
})(typeof window!=="undefined"?window:this);

</script>
<script>
/* ===================== MEASUREMENT KIT =====================
   Significant figures, scientific notation and dimensional analysis, shared by chemistry Unit 1
   and physics Module 1 (A Physics Toolkit). Lives in a function because the libraries load
   before Suite exists; each pack calls MeasureKit() once when it builds. */
function MeasureKit(){
  var H=Suite.H,num=H.num,MIN=H.MIN;
  function M(h){return '<span class="m">'+h+'</span>';}
  function q(v,u){return Qty.qty(v,u);}
  function ex(v,u){return Qty.qty(v,u,true);}
  function D(s){return Qty.parseDec(s);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  /* one place where a typed number is judged: value, then significant figures */
  function numCheck(input,correct,opts){
    opts=opts||{};
    var r=Qty.checkAnswer(input,correct,opts);
    if(r.ok)return {ok:true,msg:opts.why||("Correct to "+(opts.sig||(correct.d||correct).sig)+" significant figures.")};
    if(r.why==="format")return {ok:false,msg:"Type a number, like 0.250 or 2.5e3."};
    if(r.why==="sigfigs")return {ok:false,msg:"Right value, wrong number of significant figures. "+(opts.sigWhy||"Count what the measurements give you.")};
    return {ok:false,msg:opts.valueWhy||"That value isn't right yet. Check the arithmetic."};
  }
  function qHTML(d,sig){return M(Qty.html(d,sig));}

  /* ============ Unit 1, Topic 1: significant figures ============ */
  var SIG_RULES=[
    {v:"leading",label:"Zeros in front only locate the decimal point"},
    {v:"sandwich",label:"Zeros between significant digits always count"},
    {v:"trailpoint",label:"Trailing zeros count when a decimal point is there"},
    {v:"trailplain",label:"Trailing zeros don't count without a decimal point"}
  ];
  var UNITS_M=["g","mL","cm","s","kg","L","m"];
  var A_countSig={title:"Count the significant figures",
    gen:function(){
      var kind=pick(["leading","sandwich","trailpoint","trailplain"]),str;
      if(kind==="leading")str="0.00"+rnd(1,9)+rnd(0,9)+rnd(1,9);
      else if(kind==="sandwich")str=rnd(1,9)+"0"+rnd(1,9)+"."+rnd(1,9)+rnd(1,9);
      else if(kind==="trailpoint")str=rnd(1,9)+rnd(1,9)+"."+rnd(1,9)+"0";
      else str=rnd(1,9)+rnd(1,9)+"00";
      return {str:str,unit:pick(UNITS_M),kind:kind,n:Qty.parseDec(str).sig};
    },
    steps:[
      function(p,d,api){api.stageSet('<p class="prompt">How many significant figures?</p><div class="given">'+p.str+' '+p.unit+'</div>');
        return {kind:"digits",goal:"Mark the significant digits",prompt:"Click every digit that is significant.",value:p.str,unit:p.unit,
          hint:"Start at the first nonzero digit on the left. Everything from there counts, except trailing zeros with no decimal point.",
          why:p.str+" has "+p.n+" significant figure"+(p.n===1?"":"s")+".",
          solve:function(){return Qty.sigFigMap(p.str).filter(function(x){return x.sig;}).map(function(x){return x.i;});}};},
      function(p){
        var opts=shuffle(SIG_RULES.slice()).map(function(r){return {label:r.label,value:r.v};});
        return {kind:"choice",goal:"Name the rule",prompt:"Which rule decided the zeros in "+p.str+"?",options:opts,
          hint:"Look at where the zeros sit: in front, in the middle, or at the end.",solve:function(){return p.kind;},
          check:function(v){
            var why={leading:"Zeros before the first nonzero digit never count. They only say where the decimal point is.",
              sandwich:"A zero trapped between significant digits is always significant.",
              trailpoint:"The decimal point makes the trailing zero count, so it was measured.",
              trailplain:"With no decimal point, trailing zeros are placeholders and don't count."}[p.kind];
            return v===p.kind?{ok:true,msg:why}:{ok:false,msg:"Look again at where the zeros sit in "+p.str+"."};}};}
    ],
    finish:function(p){return M(p.str+" "+p.unit)+" has "+p.n+" significant figure"+(p.n===1?"":"s")+".";}};

  var A_roundSig={title:"Round to significant figures",
    gen:function(){
      var digits=""+rnd(1,9)+rnd(0,9)+rnd(0,9)+rnd(1,9)+rnd(1,9),shape=pick(["small","mid","big"]);
      var str=shape==="small"?"0.00"+digits:shape==="mid"?digits.slice(0,2)+"."+digits.slice(2):digits;
      var n=pick([2,3]);
      return {str:str,n:n,unit:pick(UNITS_M),correct:Qty.roundSig(Qty.parseDec(str),n)};},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Round to '+p.n+' significant figures</p><div class="given">'+p.str+' '+p.unit+'</div>');
      return {kind:"fill",goal:"Round it",prompt:"Write "+p.str+" with "+p.n+" significant figures.",
        fields:[{label:"",placeholder:"value"}],
        hint:"Keep the first "+p.n+" significant digits. Look at the next digit: 5 or more rounds up.",
        solve:function(){return [Qty.text(p.correct)];},
        check:function(v){return numCheck(v[0],p.correct,{sig:p.n,
          why:"Rounded to "+p.n+" significant figures.",
          sigWhy:"Keep exactly "+p.n+" significant digits, padding with zeros if you need to.",
          valueWhy:"Check the digit just past the cut: 5 or more rounds the last kept digit up."});}};}],
    finish:function(p){return qHTML(p.correct)+" "+p.unit;}};

  var A_multSig={title:"Multiply or divide with significant figures",
    gen:function(){
      var op=pick(["mul","div"]);
      var a=D(pick(["3.14","0.250","12.5","4.0","6.02","0.75","15.0","2.5"])),b=D(pick(["2.0","1.25","3.0","0.50","11.2","4.25","8.0"]));
      var ua=pick(["cm","g","mL","m"]),ub=op==="mul"?ua:pick(["s","mL","mol"]);
      var res=op==="mul"?Qty.mul(a,b):Qty.div(a,b);
      return {a:a,b:b,op:op,ua:ua,ub:ub,res:res,sig:Math.min(a.sig,b.sig),
        unit:op==="mul"?(ua===ub?ua+"^2":ua+"·"+ub):ua+"/"+ub};},
    steps:[
      function(p,d,api){api.stageSet('<p class="prompt">Work it out with the right number of significant figures</p><div class="given">'+
        Qty.html(p.a)+" "+p.ua+(p.op==="mul"?" × ":" ÷ ")+Qty.html(p.b)+" "+p.ub+'</div>');
        var opts=shuffle([1,2,3,4].map(function(n){return {label:String(n),value:n};}));
        return {kind:"choice",goal:"Decide the precision first",prompt:"How many significant figures may the answer have?",options:opts,
          hint:"Multiplying and dividing: the answer gets the fewest significant figures of the measurements you used.",
          solve:function(){return p.sig;},
          check:function(v){
            if(v===p.sig)return {ok:true,msg:Qty.text(p.a)+" has "+p.a.sig+" and "+Qty.text(p.b)+" has "+p.b.sig+", so the answer keeps "+p.sig+"."};
            return {ok:false,msg:"An answer can't be more precise than the least precise measurement in it. Compare "+Qty.text(p.a)+" and "+Qty.text(p.b)+"."};}};},
      function(p){return {kind:"fill",goal:"Now the value",prompt:"Write the answer in "+p.unit+".",fields:[{label:"",placeholder:"value"}],
        hint:"Do the arithmetic, then round to "+p.sig+" significant figures.",
        solve:function(){return [Qty.text(p.res)];},
        check:function(v){return numCheck(v[0],p.res,{sig:p.sig,why:"Rounded to "+p.sig+" significant figures.",
          sigWhy:"You decided on "+p.sig+"; write exactly that many.",valueWhy:"Check the arithmetic before rounding."});}};}
    ],
    finish:function(p){return qHTML(p.res)+" "+p.unit;}};

  var A_addSig={title:"Add or subtract with significant figures",
    gen:function(){
      var op=pick(["add","sub"]);
      var a=D(pick(["12.11","105.2","8.075","46.3","0.250"])),b=D(pick(["0.3","2.05","1.667","10.1","0.04"]));
      if(op==="sub"&&Qty.cmpDec(a,b)<0){var t=a;a=b;b=t;}
      var res=op==="add"?Qty.add(a,b):Qty.sub(a,b);
      var place=Math.max(a.lastPlace(),b.lastPlace());
      return {a:a,b:b,op:op,res:res,place:place,unit:pick(["g","mL","cm","s"])};},
    steps:[
      function(p,d,api){api.stageSet('<p class="prompt">Work it out with the right precision</p><div class="given">'+
        Qty.html(p.a)+(p.op==="add"?" + ":" "+MIN+" ")+Qty.html(p.b)+" "+p.unit+'</div>');
        var names={0:"ones",'-1':"tenths",'-2':"hundredths",'-3':"thousandths"};
        var opts=shuffle([0,-1,-2,-3].map(function(k){return {label:names[k],value:k};}));
        return {kind:"choice",goal:"Decide the precision first",prompt:"How far right can the answer go?",options:opts,
          hint:"Adding and subtracting: line up the decimal points. The answer stops where the shorter measurement stops.",
          solve:function(){return p.place;},
          check:function(v){
            if(v===p.place)return {ok:true,msg:Qty.text(p.a)+" stops at the "+names[String(p.a.lastPlace())]+" and "+Qty.text(p.b)+" at the "+names[String(p.b.lastPlace())]+", so the answer stops at the "+names[String(p.place)]+"."};
            return {ok:false,msg:"Here it's decimal places, not significant figures. The answer can only be as precise as the coarser measurement."};}};},
      function(p){return {kind:"fill",goal:"Now the value",prompt:"Write the answer in "+p.unit+".",fields:[{label:"",placeholder:"value"}],
        hint:"Add or subtract, then cut the answer off at the place you chose.",
        solve:function(){return [Qty.text(p.res)];},
        check:function(v){return numCheck(v[0],p.res,{sig:p.res.sig,why:"Cut off at the right decimal place.",
          sigWhy:"Round to the decimal place you chose, not to a number of digits.",valueWhy:"Check the arithmetic."});}};}
    ],
    finish:function(p){return qHTML(p.res)+" "+p.unit;}};

  /* ============ Unit 1, Topic 2: scientific notation ============ */
  function sciCheck(p,vals,want){
    var m=Qty.parseDec(vals[0]),e=String(vals[1]||"").trim().replace(/−/g,"-");
    if(!m||!/^[+-]?\d+$/.test(e))return {ok:false,msg:"Type a number and a whole-number exponent."};
    var mv=Math.abs(m.num());
    if(mv<1||mv>=10)return {ok:false,msg:"The first part has to be at least 1 and less than 10."};
    var built=Qty.parseDec(Qty.text(m).replace(/ x 10\^.*/,"")+"e"+e);
    var r=Qty.checkAnswer(Qty.text(built),want);
    if(r.ok&&m.sig===want.sig)return {ok:true,msg:"Same value, written with "+want.sig+" significant figures."};
    if(m.sig!==want.sig&&r.ok)return {ok:false,msg:"Right value, wrong number of significant figures. Keep "+want.sig+"."};
    if(Qty.sameValue(Qty.roundSig(built,1),Qty.roundSig(want,1)))return {ok:false,msg:"The digits are close, but check the exponent: count how far the decimal point moves."};
    return {ok:false,msg:"Count the places the decimal point has to move, and keep every significant digit."};
  }
  var A_toSci={title:"Write it in scientific notation",
    gen:function(){
      var digits=pick(["4 52","3 20","1 05","6 75","9 00","2 46"]).replace(" ",""),shape=pick(["small","big"]);
      var str=shape==="small"?"0.000"+digits:digits+"000";
      var d=Qty.parseDec(shape==="small"?str:digits+"e3");
      return {str:shape==="small"?str:digits+"000",d:d,unit:pick(UNITS_M)};},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Write in scientific notation</p><div class="given">'+p.str+' '+p.unit+'</div>');
      var s=Qty.sciParts(p.d);
      return {kind:"sci",goal:"Move the decimal point",prompt:"Keep every significant digit.",unit:p.unit,
        hint:"Put the decimal point after the first nonzero digit, then count how many places it moved. Moving right makes the exponent negative.",
        solve:function(){return [s.mantissa,String(s.exp)];},
        check:function(v){return sciCheck(p,v,p.d);}};}],
    finish:function(p){return M(Qty.sciHTML(p.d))+" "+p.unit;}};

  var A_fromSci={title:"Write it out in full",
    gen:function(){
      var digits=pick(["4.52","3.06","1.25","6.7","9.04"]),e=pick([-4,-3,-2,2,3]);
      var d=Qty.parseDec(digits+"e"+e);
      /* only generate values whose plain form keeps the same significant figures */
      if(Qty.needsSci(d))e=-Math.abs(e),d=Qty.parseDec(digits+"e"+e);
      return {d:d,digits:digits,e:e,unit:pick(UNITS_M)};},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Write this out without the exponent</p><div class="given">'+Qty.sciHTML(p.d)+' '+p.unit+'</div>');
      return {kind:"fill",goal:"Move the decimal point back",prompt:"Write the plain number.",fields:[{label:"",placeholder:"0.00452"}],
        hint:"A negative exponent moves the decimal point left, a positive one moves it right.",
        solve:function(){return [Qty.plain(p.d)];},
        check:function(v){return numCheck(v[0],p.d,{why:"Same value, no exponent.",
          sigWhy:"Keep the same significant digits you started with.",
          valueWhy:"Count the places again: 10^"+p.e+" moves the point "+Math.abs(p.e)+" place"+(Math.abs(p.e)===1?"":"s")+" to the "+(p.e<0?"left":"right")+"."});}};}],
    finish:function(p){return M(Qty.plain(p.d))+" "+p.unit;}};

  var A_sciMult={title:"Multiply or divide in scientific notation",
    gen:function(){
      var op=pick(["mul","div"]);
      var a=Qty.parseDec(pick(["3.0","2.5","6.02","1.20","4.5"])+"e"+pick([3,4,-2,-3,5])),
          b=Qty.parseDec(pick(["2.0","4.00","1.5","3.20"])+"e"+pick([2,-2,3,-4]));
      var res=op==="mul"?Qty.mul(a,b):Qty.div(a,b);
      return {a:a,b:b,op:op,res:res};},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Work it out in scientific notation</p><div class="given">('+
        Qty.sciHTML(p.a)+')'+(p.op==="mul"?" × ":" ÷ ")+'('+Qty.sciHTML(p.b)+')</div>');
      var s=Qty.sciParts(p.res);
      return {kind:"sci",goal:"Handle the digits and the exponent separately",prompt:"Give the answer with the right number of significant figures.",
        hint:p.op==="mul"?"Multiply the front numbers and add the exponents.":"Divide the front numbers and subtract the exponents.",
        solve:function(){return [s.mantissa,String(s.exp)];},
        check:function(v){return sciCheck(p,v,p.res);}};}],
    finish:function(p){return M(Qty.sciHTML(p.res));}};

  /* ============ Unit 1, Topic 3: dimensional analysis ============ */
  var METRIC=[
    {a:ex("1","L"),b:ex("1000","mL")},{a:ex("1","kg"),b:ex("1000","g")},{a:ex("1","g"),b:ex("1000","mg")},
    {a:ex("1","m"),b:ex("100","cm")},{a:ex("1","km"),b:ex("1000","m")},{a:ex("1","m"),b:ex("1000","mm")},
    {a:ex("1","h"),b:ex("60","min")},{a:ex("1","min"),b:ex("60","s")}
  ];
  function palette(needed,pool){
    var out=needed.slice();
    shuffle((pool||METRIC).slice()).forEach(function(f){
      if(out.length<needed.length+3&&!out.some(function(o){return Qty.unitLabel(o.a.u)===Qty.unitLabel(f.a.u)&&Qty.unitLabel(o.b.u)===Qty.unitLabel(f.b.u);}))out.push(f);
    });
    return shuffle(out);
  }
  function trainStep(p,goal,prompt,hint){
    return {kind:"train",goal:goal,prompt:prompt,hint:hint,start:p.start,target:p.target,factors:p.factors,alternates:p.alternates||[],
      why:"Each conversion goes in with the unit being cancelled on the bottom, so it strikes out against the one above it.",
      solve:function(){return {cards:p.cards,answer:Qty.text(p.answer.d)};}};
  }
  function buildTrain(startQ,steps,target,pool){
    /* steps: [{f:factorObject, flip:bool}]. Full precision through the chain, rounded once at
       the end, so the answer matches a calculator worked the same way. */
    var q=new Qty.Q(new Qty.Dec(startQ.d.n,startQ.d.e,Infinity,true),startQ.u);
    var least=startQ.d.exact?Infinity:startQ.d.sig;
    steps.forEach(function(s){
      var top=s.flip?s.f.b:s.f.a,bot=s.flip?s.f.a:s.f.b;
      [top,bot].forEach(function(x){if(!x.d.exact&&!x.d.isZero())least=Math.min(least,x.d.sig);});
      q=q.mul(new Qty.Q(new Qty.Dec(top.d.n,top.d.e,Infinity,true),top.u))
         .div(new Qty.Q(new Qty.Dec(bot.d.n,bot.d.e,Infinity,true),bot.u));
    });
    q=new Qty.Q(least===Infinity?q.d:Qty.roundSig(q.d,least),q.u);
    var factors=palette(steps.map(function(s){return s.f;}),pool);
    var cards=steps.map(function(s){return {i:factors.indexOf(s.f),flip:s.flip};});
    return {start:startQ,target:target,factors:factors,cards:cards,answer:q};
  }
  var A_convert={title:"Convert a measurement",
    gen:function(){
      var job=pick([
        {v:pick(["250.","125.","45.0","8.50"]),u:"mL",t:"L",steps:[{k:0,flip:false}]},
        {v:pick(["2.50","0.450","12.0"]),u:"kg",t:"g",steps:[{k:1,flip:true}]},
        {v:pick(["1.75","0.250","15.0"]),u:"g",t:"mg",steps:[{k:2,flip:true}]},
        {v:pick(["3.20","0.850","24.0"]),u:"m",t:"cm",steps:[{k:3,flip:true}]},
        {v:pick(["2.50","0.750","14.0"]),u:"km",t:"cm",steps:[{k:4,flip:true},{k:3,flip:true}]},
        {v:pick(["45.0","250.","6.50"]),u:"min",t:"s",steps:[{k:7,flip:true}]}
      ]);
      var t=buildTrain(q(job.v,job.u),job.steps.map(function(s){return {f:METRIC[s.k],flip:s.flip};}),job.t);
      t.job=job;return t;},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Convert</p><div class="given">'+p.start.html()+" &rarr; "+Qty.unitHTML(Qty.unitParse(p.target))+'</div>');
      return trainStep(p,"Build the conversion","Add conversions until every unit cancels except "+p.target+".",
        "Put the unit you want to cancel on the bottom of the next fraction. Flip a card with the arrows if it's upside down.");}],
    finish:function(p){return M(p.answer.html());}};

  var A_rateConvert={title:"Convert a rate",
    gen:function(){
      var job=pick([
        {v:pick(["95.0","72.0","28.5"]),u:"km/h",t:"m/s",steps:[{k:4,flip:true},{k:6,flip:false},{k:7,flip:false}]},
        {v:pick(["1.25","0.850","13.6"]),u:"g/mL",t:"kg/L",steps:[{k:1,flip:false},{k:0,flip:true}]},
        {v:pick(["250.","125.","48.0"]),u:"mL/min",t:"L/h",steps:[{k:0,flip:false},{k:6,flip:true}]}
      ]);
      var t=buildTrain(q(job.v,job.u),job.steps.map(function(s){return {f:METRIC[s.k],flip:s.flip};}),job.t);
      t.job=job;return t;},
    steps:[function(p,d,api){api.stageSet('<p class="prompt">Convert this rate</p><div class="given">'+p.start.html()+" &rarr; "+Qty.unitHTML(Qty.unitParse(p.target))+'</div>');
      return trainStep(p,"Build the conversion","Cancel the top unit and the bottom unit until only "+p.target+" is left.",
        "Handle one unit at a time. A unit on the bottom cancels against the same unit on top of the next fraction.");}],
    finish:function(p){return M(p.answer.html());}};

  var A_density={title:"Density from mass and volume",
    gen:function(){

      return {m:m,v:v,res:m.div(v)};},
    steps:[
      function(p,d,api){api.stageSet('<p class="prompt">A sample has a mass of '+p.m.html()+' and a volume of '+p.v.html()+'.</p><p class="prompt">Find its density.</p>');
        return {kind:"choice",goal:"Set it up",prompt:"Density is:",options:shuffle([{label:M("mass ÷ volume"),value:"mv"},{label:M("volume ÷ mass"),value:"vm"},{label:M("mass × volume"),value:"times"}]),
          hint:"Density is how much mass is packed into each unit of volume, so it's per milliliter.",solve:function(){return "mv";},
          check:function(v){return v==="mv"?{ok:true,msg:"Density is mass per unit volume, so grams divided by milliliters."}:
            {ok:false,msg:"Think about the units: g/mL means grams for every one milliliter."};}};},
      function(p){return {kind:"fill",goal:"Compute it",prompt:"Density in g/mL:",fields:[{label:"",placeholder:"value"}],
        hint:"Divide, then round to "+p.res.d.sig+" significant figures.",

          sigWhy:"Both measurements have "+p.m.d.sig+" and "+p.v.d.sig+" significant figures, so keep the smaller count.",

    ],

  return {qHTML:qHTML,SIG_RULES:SIG_RULES,UNITS_M:UNITS_M,A_countSig:A_countSig,A_roundSig:A_roundSig,A_multSig:A_multSig,A_addSig:A_addSig,sciCheck:sciCheck,A_toSci:A_toSci,A_fromSci:A_fromSci,A_sciMult:A_sciMult,METRIC:METRIC,palette:palette,trainStep:trainStep,buildTrain:buildTrain,A_convert:A_convert,A_rateConvert:A_rateConvert,A_density:A_density};
}

<script>
/* ===================== STORM SOLVER CORE UI =====================
   Packs call Suite.registerPack({id,name,units:[{id,name,topics:[{id,name,custom,activities}]}]}).
   Activity: {title, gen(), steps:[function(p,d,api){return stepDef;}], finish(p,d) -> html}.
   Step kinds: balance {eq} | choice {prompt,options,check} | fill {prompt,fields,check}
               | slots {prompt,template,chips,check,describe} | show {prompt,html,log} | grid {prompt,grid,count,validate}.
   Every non-show widget step also gets solve() -> the value a correct student would enter,
   which powers the "Show me" hint and the watch-one demo. */
var Suite=(function(){
  var $=function(id){return document.getElementById(id);};
  var MIN="−";

  /* ---------- shared rendering helpers (packs use these through Suite.H) ---------- */
  function num(n){return String(n).replace("-",MIN);}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function pn(v){v=String(v);return (v.charAt(0)==="-"||v.charAt(0)===MIN)?"("+num(v)+")":num(v);}
  function ptText(p){return "("+num(p[0])+", "+num(p[1])+")";}
  function mEq(eq){return '<span class="m">'+eqHTML(eq)+'</span>';}
  function lineHTML(m,b){
    var h=vh("y")+" = ";
    if(m.isZero())return h+b.html();
    var ma=m.abs();
    h+=(m.sign()<0?MIN:"")+(ma.isOne()?"":ma.d===1?ma.n:"")+(ma.d===1?vh("x"):fracHTML((ma.n===1?"":ma.n)+vh("x"),ma.d));
    if(!b.isZero())h+=(b.sign()<0?" "+MIN+" ":" + ")+b.abs().html();
    return h;
  }
  function lineText(m,b){var s="y = ";if(m.isZero())return s+b.plain();var ma=m.abs();s+=(m.sign()<0?"-":"")+(ma.isOne()?"":ma.n)+(ma.d===1?"x":"x/"+ma.d);if(!b.isZero())s+=(b.sign()<0?" - ":" + ")+b.abs().plain();return s;}

  /* A coordinate grid. The y axis can have its own range and label spacing (o.ymin, o.ymax,
     o.ystep), for curves that climb faster than they spread; clicks still snap to whole numbers. */
  function Grid(o){
    o=o||{};var min=o.min===undefined?-5:o.min,max=o.max===undefined?5:o.max,S=340,pad=18,padL=o.padL||pad,padB=o.padB||pad,span=max-min,u=(S-padL-pad)/span;
    var ymin=o.ymin===undefined?min:o.ymin,ymax=o.ymax===undefined?max:o.ymax,yspan=ymax-ymin,uy=(S-pad-padB)/yspan,ystep=o.ystep||1;
    /* data grids (a solubility curve runs 0 to 100 degrees and 0 to 180 grams) draw fewer lines and
       snap clicks to a coarser step; the default is every whole number, as before */
    var xstep=o.xstep||1,xsnap=o.xsnap||1,ysnap=o.ysnap||1;
    var ns="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+S+" "+S);svg.setAttribute("role","img");
    var X=function(x){return padL+(x-min)*u;},Y=function(y){return S-padB-(y-ymin)*uy;};
    function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
    for(var i=min;i<=max;i++){if((i-min)%xstep===0)el("line",{x1:X(i),y1:Y(ymin),x2:X(i),y2:Y(ymax),"class":"gl"});}
    for(var i2=ymin;i2<=ymax;i2++){if(i2%ystep===0)el("line",{x1:X(min),y1:Y(i2),x2:X(max),y2:Y(i2),"class":"gl"});}
    var ax=Math.max(min,Math.min(0,max)),ay=Math.max(ymin,Math.min(0,ymax));
    el("line",{x1:X(min),y1:Y(ay),x2:X(max),y2:Y(ay),"class":"ax"});el("line",{x1:X(ax),y1:Y(ymin),x2:X(ax),y2:Y(ymax),"class":"ax"});
    var lab=o.labelEvery||(span>12?2:1),ylab=o.ylabelEvery||(ystep>1?ystep:(yspan>12?2:1));
    for(var j=min;j<=max;j++){if(j===0||j%lab!==0)continue;el("text",{x:X(j),y:Y(ay)+12,"class":"tick","text-anchor":"middle"},num(j));}
    for(var j2=ymin;j2<=ymax;j2++){if(j2===0||j2%ylab!==0)continue;el("text",{x:X(ax)-4,y:Y(j2)+4,"class":"tick","text-anchor":"end"},num(j2));}
    var api={svg:svg,min:min,max:max,ymin:ymin,ymax:ymax,xsnap:xsnap,ysnap:ysnap};
    if(o.xtitle)el("text",{x:X(max),y:Y(ay)+27,"class":"tick","text-anchor":"end"},o.xtitle);
    if(o.ytitle)el("text",{x:X(ax)+4,y:Y(ymax)-4,"class":"tick","text-anchor":"start"},o.ytitle);
    /* a curve y = fn(x), sampled finely and cut wherever it leaves the grid */
    api.curve=function(fn,cls,x0,x1){
      x0=x0===undefined?min:x0;x1=x1===undefined?max:x1;
      var segs=[],cur=[],n=240;
      for(var k=0;k<=n;k++){var x=x0+(x1-x0)*k/n,y=fn(x);
        if(isFinite(y)&&y>=ymin-1e-9&&y<=ymax+1e-9)cur.push([x,y]);else{if(cur.length>1)segs.push(cur);cur=[];}}
      if(cur.length>1)segs.push(cur);
      return segs.map(function(sg){return el("polyline",{points:sg.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" "),"class":cls||"ln"});});
    };
    api.point=function(x,y,cls){return el("circle",{cx:X(x),cy:Y(y),r:4.5,"class":cls||"pt"});};
    api.line=function(mv,bv,cls){
      var ml=mv.val(),bl=bv.val();var p=[[min,ml*min+bl],[max,ml*max+bl]];
      if(ml!==0){p.push([(ymin-bl)/ml,ymin]);p.push([(ymax-bl)/ml,ymax]);}
      p=p.filter(function(q){return q[0]>=min-1e-9&&q[0]<=max+1e-9&&q[1]>=ymin-1e-9&&q[1]<=ymax+1e-9;}).sort(function(a,b){return a[0]-b[0];});
      if(p.length<2)return null;var a=p[0],b=p[p.length-1];
      return el("line",{x1:X(a[0]),y1:Y(a[1]),x2:X(b[0]),y2:Y(b[1]),"class":cls||"ln"});
    };
    api.triangle=function(p1,p2){
      var g=el("polyline",{points:X(p1[0])+","+Y(p1[1])+" "+X(p2[0])+","+Y(p1[1])+" "+X(p2[0])+","+Y(p2[1]),"class":"tri"});
      var run=p2[0]-p1[0],rise=p2[1]-p1[1];
      el("text",{x:(X(p1[0])+X(p2[0]))/2,y:Y(p1[1])+(rise>=0?14:-6),"class":"tlab","text-anchor":"middle"},"run "+num(run));
      el("text",{x:X(p2[0])+(run>=0?6:-6),y:(Y(p1[1])+Y(p2[1]))/2+4,"class":"tlab","text-anchor":run>=0?"start":"end"},"rise "+num(rise));
      return g;
    };
    /* pieces of graphs: a polyline through data points, a single segment, and the open or closed
       dot that says whether an endpoint belongs to the piece */
    api.path=function(pts,cls){
      if(!pts.length)return null;
      return el("polyline",{points:pts.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" "),"class":cls||"ln2"});
    };
    /* a closed polygon (a triangle to transform) and a text label beside a lattice point */
    api.poly=function(pts,cls){return el("polygon",{points:pts.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" "),"class":cls||"pre"});};
    api.label=function(x,y,t,cls,dx,dy){return el("text",{x:X(x)+(dx===undefined?7:dx),y:Y(y)+(dy===undefined?-6:dy),"class":cls||"vlab"},t);};
    api.seg=function(x1,y1,x2,y2,cls){return el("line",{x1:X(x1),y1:Y(y1),x2:X(x2),y2:Y(y2),"class":cls||"ln2"});};
    api.dot=function(x,y,open){return el("circle",{cx:X(x),cy:Y(y),r:4.5,"class":open?"ptopen":"pt"});};
    /* shade the half plane on one side of y = mx + b, clipped to the grid box */
    api.shade=function(mv,bv,above,cls){
      var ml=mv.val(),bl=bv.val();
      var corners=[[min,ymin],[max,ymin],[max,ymax],[min,ymax]],out=[];
      function gap(q){return q[1]-(ml*q[0]+bl);}
      for(var i=0;i<4;i++){
        var A=corners[i],B=corners[(i+1)%4],ga=gap(A),gb=gap(B);
        if(above?ga>=0:ga<=0)out.push(A);
        if((ga>0)!==(gb>0)&&ga!==gb){var t=ga/(ga-gb);out.push([A[0]+t*(B[0]-A[0]),A[1]+t*(B[1]-A[1])]);}
      }
      if(out.length<3)return null;
      return el("polygon",{points:out.map(function(q){return X(q[0])+","+Y(q[1]);}).join(" "),"class":cls||"shade"});
    };
    api.stairs=function(p0,m){ /* unlabeled rise/run steps along y = mx + b through lattice point p0 */
      var dx=m.d,dy=m.n,inside=function(x,y){return x>=min&&x<=max&&y>=ymin&&y<=ymax;};
      var x=p0[0],y=p0[1];while(inside(x-dx,y-dy)){x-=dx;y-=dy;}
      while(inside(x+dx,y+dy)){if(inside(x+dx,y))el("polyline",{points:X(x)+","+Y(y)+" "+X(x+dx)+","+Y(y)+" "+X(x+dx)+","+Y(y+dy),"class":"stair"});x+=dx;y+=dy;}
    };
    var hov=null,handlers=[];
    function on(t,f){svg.addEventListener(t,f);handlers.push([t,f]);}
    api.onClick=function(cb){svg.classList.add("clickable");
      on("mousemove",function(ev){var q=toLattice(ev);if(!hov)hov=el("circle",{r:7,"class":"hov"});hov.setAttribute("cx",X(q[0]));hov.setAttribute("cy",Y(q[1]));});
      on("mouseleave",function(){if(hov){hov.remove();hov=null;}});
      on("click",function(ev){cb(toLattice(ev));});
    };
    api.offClick=function(){handlers.forEach(function(h){svg.removeEventListener(h[0],h[1]);});handlers=[];svg.classList.remove("clickable");if(hov){hov.remove();hov=null;}};
    function toLattice(ev){var r=svg.getBoundingClientRect();var sx=(ev.clientX-r.left)/r.width*S,sy=(ev.clientY-r.top)/r.height*S;
      var x=min+Math.round(((sx-padL)/u)/xsnap)*xsnap,y=ymin+Math.round(((S-padB-sy)/uy)/ysnap)*ysnap;return [Math.max(min,Math.min(max,x)),Math.max(ymin,Math.min(ymax,y))];}
    return api;
  }

  /* ---------- storage: survives refresh, resets the tally each new day ---------- */
  var KEY="stormSolver.v2",S=null;
  function mmdd(){var d=new Date();return ("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);}
  function load(){
    var s=null;try{s=JSON.parse(window.localStorage.getItem(KEY)||"null");}catch(e){s=null;}
    if(!s||typeof s!=="object")s={};
    var fresh={name:typeof s.name==="string"?s.name:"",day:mmdd(),tally:{},hints:0,topics:{},demo:(s.demo&&typeof s.demo==="object")?s.demo:{}};
    if(s.day===mmdd()){fresh.tally=s.tally||{};fresh.hints=s.hints|0;fresh.topics=s.topics||{};}
    return fresh;
  }
  function save(){try{window.localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

  /* ---------- state ---------- */
  var packs=[],CFG={},V={pack:null,unit:null,topic:null},tokens=0;
  var R={act:null,token:0,solved:true};
  var B={active:false};
  function topicKey(){return V.unit.id+"/"+V.topic.id;}
  /* Support: side questions come back in a topic after a problem with two or more misses, and go
     away again after two clean problems in a row. Worked examples always show them. SUPMODE lets
     the self-test force either path. */
  var SUP={},SUPMODE=null;
  function support(){if(SUPMODE!==null)return SUPMODE;if(!R||!R.act||R.demo)return true;if((R.misses||0)>=2)return true;var s=V.unit&&V.topic?SUP[topicKey()]:null;return !!(s&&s.on);}
  function supportAfter(tk){var s=SUP[tk]||(SUP[tk]={on:false,clean:0}),was=s.on;
    if((R.misses||0)>=2){s.on=true;s.clean=0;}else if(s.on){s.clean++;if(s.clean>=2){s.on=false;s.clean=0;}}
    return was===s.on?"":s.on?" Guiding questions are back on for this topic.":" Guiding questions are off again.";}
  function later(fn,ms){var tok=R.token;setTimeout(function(){if(R.token===tok)fn();},ms);}

  /* ---------- session drawer ---------- */
  function updateSession(){
    var total=0,parts=[];
    Object.keys(S.tally).sort().forEach(function(u){if(S.tally[u]>0){total+=S.tally[u];parts.push(unitLabel(u)+": <b>"+S.tally[u]+"</b>");}});
    $("sessCount").textContent=total;
    $("tally").innerHTML="Solved today: <b>"+total+"</b>"+(parts.length?" ("+parts.join(", ")+")":"")+" &middot; Hints: <b>"+S.hints+"</b>";
    $("code").textContent=makeCode(S.name||"",S.day,S.tally,S.hints);
  }
  function unitLabel(id){var out="Unit "+id;packs.forEach(function(p){p.units.forEach(function(u){if(String(u.id)===String(id))out=u.short||out;});});return out;}
  function note(t,bad){var n=$("copyNote");n.textContent=t;n.className="note"+(bad?" bad":"");}
  function copyCode(){
    var c=$("code").textContent;
    if(!S.name.trim()){note("Type your name first. The code only checks out with the name you type.",true);$("name").focus();return;}
    function ok(){note("Copied. Paste it into Schoology.");}
    function fail(){var r=document.createRange();r.selectNodeContents($("code"));var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
      note("This page isn't allowed to copy. The code is highlighted: press Ctrl+C.",true);}
    function legacy(){try{var ta=document.createElement("textarea");ta.value=c;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();var r=document.execCommand("copy");document.body.removeChild(ta);return !!r;}catch(e){return false;}}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(ok,function(){if(legacy())ok();else fail();});}
    else if(legacy())ok();else fail();
  }
  function wireSession(){
    var drawer=$("drawer"),btn=$("sessBtn");
    function setOpen(o){drawer.classList.toggle("hidden",!o);btn.setAttribute("aria-expanded",o?"true":"false");if(o){note("Paste this code into Schoology when you finish.");}}
    btn.addEventListener("click",function(ev){ev.stopPropagation();setOpen(drawer.classList.contains("hidden"));});
    document.addEventListener("click",function(ev){if(!drawer.classList.contains("hidden")&&!drawer.contains(ev.target))setOpen(false);});
    document.addEventListener("keydown",function(ev){if(ev.key==="Escape")setOpen(false);});
    $("name").value=S.name;
    $("name").addEventListener("input",function(){S.name=this.value;save();updateSession();});
    $("copyBtn").addEventListener("click",copyCode);
    $("homeBtn").addEventListener("click",function(){showHome();});
  }


  function topicBtn(u,ui,t,ti,badge){var c=S.topics[u.id+"/"+t.id]||0;
    return '<button class="topic" data-u="'+ui+'" data-t="'+ti+'"><span class="tn">'+badge+'</span><span class="tt">'+t.name+'</span><span class="tc">'+(c?c+" today":"")+'</span></button>';}
  /* ---------- course map: a pack that carries a calendar shows where the class is ----------
     The date comes from this computer's clock (?today=YYYY-MM-DD overrides it, for testing). */
  function isoToday(){
    var m=String(location.search||"").match(/[?&]today=(\d{4}-\d{2}-\d{2})/);if(m)return m[1];
    var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtD(s){return MON[+s.slice(5,7)-1]+" "+(+s.slice(8));}
  function fmtRange(a,b){return a.slice(5,7)===b.slice(5,7)?fmtD(a)+"\u2013"+(+b.slice(8)):fmtD(a)+" \u2013 "+fmtD(b);}
  function courseState(pk){
    var today=isoToday(),c=pk.course,wk=null,next=null,i;
    for(i=0;i<c.weeks.length;i++)if(c.weeks[i].s<=today&&today<=c.weeks[i].e){wk=c.weeks[i];break;}
    if(!wk)for(i=0;i<c.weeks.length;i++)if(c.weeks[i].s>today){next=c.weeks[i];break;}
    var st={};
    pk.units.forEach(function(u){st[u.id]=u.when[1]<today?"done":(u.when[0]<=today?"now":"next");});
    var focus=wk||next;
    if(focus&&focus.u&&st[focus.u]==="next")st[focus.u]="now";
    return {today:today,wk:wk,next:next,focus:focus,st:st};
  }
  function courseHome(pk){
    var cs=courseState(pk),c=pk.course,h='<section class="course"><div class="chead"><b>'+c.title+'</b><span>Today: '+fmtD(cs.today)+'</span></div>';
    var f=cs.focus,byId={};pk.units.forEach(function(u){byId[u.id]=u;});
    if(f){
      var u=f.u&&byId[f.u],what=u?("Module "+u.num+(f.l&&u.lessons[f.l]?", Lesson "+f.l+": "+u.lessons[f.l]:": "+f.label)):f.label;
      h+='<div class="here"><span class="pin">'+(cs.wk?"You are here":"Next up")+'</span><span><b>Week of '+fmtRange(f.s,f.e)+'</b> \u00b7 '+what+'</span>'+
        (u?'<button class="btn small" data-go="'+u.id+'">Go to Module '+u.num+'</button>':'')+'</div>';
    }else h+='<div class="here"><span class="pin">Course complete</span><span>Every module is open for review.</span></div>';
    h+='<div class="qstrip">';
    c.quarters.forEach(function(q){
      h+='<div class="qcol"><div class="qn">Q'+q.n+'</div><div class="mchips">';
      pk.units.filter(function(u){return u.q===q.n;}).forEach(function(u){
        var s=cs.st[u.id];
        h+='<button class="mchip '+s+'" data-go="'+u.id+'" title="'+u.name.replace(/"/g,"&quot;")+'"><b>M'+u.num+'</b><small>'+u.short+'</small></button>';});
      h+='</div></div>';});
    h+='</div><div class="legend"><span class="k done"></span>covered <span class="k now"></span>now <span class="k next"></span>coming up</div></section>';
    var lastQ=0;
    pk.units.forEach(function(u,ui){
      if(u.q!==lastQ){var q=c.quarters[u.q-1];h+='<h3 class="qhead">'+q.name+' <span>'+fmtRange(q.s,q.e)+'</span></h3>';lastQ=u.q;}
      var s=cs.st[u.id],tag=s==="done"?"Covered":(s==="now"?"In class now":"Coming up");
      h+='<section class="unit mod '+s+'" id="u-'+u.id+'"><h2>'+u.name+'<span class="when">'+fmtRange(u.when[0],u.when[1])+'</span><span class="state">'+tag+'</span></h2>';
      if(!u.topics.length){h+='<p class="modnote">'+(u.note||"Nothing to practice here yet.")+'</p></section>';return;}
      var groups=[],seen={};
      u.topics.forEach(function(t,ti){var L=t.lesson||0;if(!(L in seen)){seen[L]=groups.length;groups.push({L:L,items:[]});}groups[seen[L]].items.push(ti);});
      groups.forEach(function(g){
        if(g.L&&u.lessons[g.L])h+='<div class="lessonh">Lesson '+g.L+' \u00b7 '+u.lessons[g.L]+'</div>';
        else if(!g.L&&groups.length>1&&u.topics[g.items[0]].id==="mix")h+='<div class="lessonh">The whole module</div>';
        h+='<div class="topics">';
        g.items.forEach(function(ti,k){var t=u.topics[ti];h+=topicBtn(u,ui,t,ti,t.id==="mix"?"\u2731":(t.badge||ti+1));});
        h+='</div>';});
      h+='</section>';
    });
    return h;
  }
  /* ---------- home ---------- */
  function showHome(){
    R.token=++tokens;R.act=null;B.active=false;V.unit=null;V.topic=null;
    var pk=V.pack||packs[0];V.pack=pk;
    $("crumbs").innerHTML=packs.length>1?"<b>"+pk.name+"</b>":"";

  /* ---------- stage, feedback, stack ---------- */
  function stageSet(html){$("stageBody").innerHTML=html;}

  /* A two-way frequency table. The table IS the problem, so it lives in the stage and stays on
     screen through every step and onto the solved screen; the steps drive this one table rather
     than drawing a second copy of it underneath. Cell keys: r0c1 for a body cell, r0T for a row
     total, Tc1 for a column total, TT for the grand total. */
  function Table(o){
    var rows=o.rows,cols=o.cols,cells=o.cells,n=rows.length,m=cols.length;
    var rowT=cells.map(function(r){return r.reduce(function(a,b){return a+b;},0);});
    var colT=cols.map(function(c,j){return cells.reduce(function(a,r){return a+r[j];},0);});
    var all=rowT.reduce(function(a,b){return a+b;},0);
    function val(k){
      if(k==="TT")return all;
      var a=/^r(\d+)T$/.exec(k);if(a)return rowT[+a[1]];
      var b=/^Tc(\d+)$/.exec(k);if(b)return colT[+b[1]];
      var c=/^r(\d+)c(\d+)$/.exec(k);if(c)return cells[+c[1]][+c[2]];
      return null;
    }
    function rowKeys(i){return cols.map(function(x,j){return "r"+i+"c"+j;});}
    function colKeys(j){return rows.map(function(x,i){return "r"+i+"c"+j;});}
    var t=document.createElement("table");t.className="twoway";
    var html='<tr><th class="corner" rowspan="2">'+esc(o.rowLab||"")+'</th>'+
      '<th class="grouphd" colspan="'+m+'">'+esc(o.colLab||"")+'</th>'+
      '<th class="tot" rowspan="2">Total</th></tr><tr>'+
      cols.map(function(c,j){return '<th class="ch" data-sel="c'+j+'">'+esc(c)+'</th>';}).join("")+'</tr>';
    rows.forEach(function(r,i){
      html+='<tr><th class="rh" data-sel="r'+i+'">'+esc(r)+'</th>'+
        cols.map(function(c,j){return '<td data-k="r'+i+'c'+j+'">'+cells[i][j]+'</td>';}).join("")+
        '<td class="tot" data-k="r'+i+'T">'+rowT[i]+'</td></tr>';
    });
    html+='<tr><th class="rh tot">Total</th>'+
      cols.map(function(c,j){return '<td class="tot" data-k="Tc'+j+'">'+colT[j]+'</td>';}).join("")+
      '<td class="tot gt" data-k="TT">'+all+'</td></tr>';
    t.innerHTML=html;
    function cell(k){return t.querySelector('[data-k="'+k+'"]');}
    var T={el:t,rows:rows,cols:cols,cells:cells,rowT:rowT,colT:colT,all:all,val:val,
      rowKeys:rowKeys,colKeys:colKeys,cell:cell};
    /* fill mode: the named cells become inputs */
    T.blank=function(keys){
      keys.forEach(function(k){var c=cell(k);if(!c)return;
        c.innerHTML='<input class="tin" data-k="'+k+'" inputmode="numeric" autocomplete="off" spellcheck="false">';
        c.classList.add("blank");});
      return T;};
    T.values=function(){var out={};t.querySelectorAll("input.tin").forEach(function(i){out[i.dataset.k]=i.value.trim();});return out;};
    T.fill=function(map){t.querySelectorAll("input.tin").forEach(function(i){if(map[i.dataset.k]!==undefined)i.value=String(map[i.dataset.k]);});};
    T.focusFirst=function(){var i=t.querySelector("input.tin");if(i)i.focus();};
    T.onEnter=function(fn){t.querySelectorAll("input.tin").forEach(function(i){i.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();fn();}});});};
    T.wrong=function(keys){t.querySelectorAll("td.off").forEach(function(c){c.classList.remove("off");});
      keys.forEach(function(k){var c=cell(k);if(c)c.classList.add("off");});};
    T.settle=function(){/* inputs become plain numbers once the table is right */
      t.querySelectorAll("input.tin").forEach(function(i){var c=i.parentNode;c.textContent=String(val(i.dataset.k));c.classList.remove("blank");c.classList.add("wasblank");});};
    /* pick mode: click cells, or a row or column header to take the whole group */
    var sel={},picking=false,onPick=null;
    function paint(){t.querySelectorAll("td[data-k]").forEach(function(c){c.classList.toggle("sel",!!sel[c.dataset.k]);});}
    function toggleGroup(keys){var on=keys.every(function(k){return sel[k];});
      keys.forEach(function(k){if(on)delete sel[k];else sel[k]=1;});}
    function hit(ev){
      if(!picking)return;
      var th=ev.target.closest("th[data-sel]");
      if(th){var s=th.dataset.sel;toggleGroup(s.charAt(0)==="r"?rowKeys(+s.slice(1)):colKeys(+s.slice(1)));paint();if(onPick)onPick(T.sel());return;}
      var td=ev.target.closest("td[data-k]");
      if(td){var k=td.dataset.k;if(sel[k])delete sel[k];else sel[k]=1;paint();if(onPick)onPick(T.sel());}
    }
    T.pick=function(fn){picking=true;onPick=fn||null;t.classList.add("hot");t.addEventListener("click",hit);return T;};
    T.sel=function(){return Object.keys(sel).sort();};
    T.setSel=function(keys){sel={};keys.forEach(function(k){sel[k]=1;});paint();};
    T.freeze=function(){picking=false;t.classList.remove("hot");t.removeEventListener("click",hit);
      t.querySelectorAll("input.tin").forEach(function(i){i.disabled=true;});return T;};
    /* a shaded group stays shaded for the rest of the problem, so the denominator a student
       chose two steps ago is still visible under the answer */
    T.shade=function(keys,cls){sel={};paint();
      keys.forEach(function(k){var c=cell(k);if(c)c.classList.add(cls||"sh");});return T;};
    T.unshade=function(){t.querySelectorAll("td.sh,td.sh2").forEach(function(c){c.classList.remove("sh","sh2");});return T;};
    return T;
  }
  /* An energy bar chart: a start state and an end state, one column per form of energy, built a
     block at a time with - and + (no dragging). Like the table, the chart is the problem, so it
     sits in the stage and the steps drive it; the finished chart stays on the solved screen. */
  function Bars(o){
    var forms=o.forms,max=o.max||10,vals={start:{},end:{}},onChange=null,editing=null;
    forms.forEach(function(f){vals.start[f.key]=0;vals.end[f.key]=0;});
    var el=document.createElement("div");el.className="bars";
    function setHTML(side,title){
      return '<div class="barset" data-side="'+side+'"><div class="bshead">'+title+'</div><div class="bcols">'+
        forms.map(function(f){
          var cells="";for(var i=0;i<max;i++)cells+='<span class="bcell"></span>';
          return '<div class="bcol" data-key="'+f.key+'"><div class="bstack">'+cells+'</div>'+
            '<div class="bbtn"><button type="button" data-d="-1" aria-label="less">−</button>'+
            '<button type="button" data-d="1" aria-label="more">+</button></div>'+
            '<div class="blab">'+f.label+'</div></div>';}).join("")+
        '</div><div class="btot"></div></div>';
    }
    el.innerHTML=setHTML("start",o.startTitle||"Start")+'<div class="barsep">→</div>'+setHTML("end",o.endTitle||"End");
    function paint(side){
      var box=el.querySelector('.barset[data-side="'+side+'"]'),tot=0;
      forms.forEach(function(f){
        var n=vals[side][f.key];tot+=n;
        box.querySelectorAll('.bcol[data-key="'+f.key+'"] .bcell').forEach(function(c,i){c.classList.toggle("on",i<n);});
      });
      box.querySelector(".btot").textContent="Total: "+tot+" block"+(tot===1?"":"s");
    }
    el.addEventListener("click",function(ev){
      var b=ev.target.closest(".bbtn button");if(!b)return;
      var set=b.closest(".barset"),side=set.dataset.side;
      if(side!==editing)return;
      var key=b.closest(".bcol").dataset.key,n=vals[side][key]+(+b.dataset.d);
      if(n<0||n>max)return;
      vals[side][key]=n;
      set.querySelectorAll(".bcol.off").forEach(function(c){c.classList.remove("off");});
      paint(side);if(onChange)onChange();
    });
    var B={el:el,forms:forms,
      set:function(side,v){forms.forEach(function(f){vals[side][f.key]=v[f.key]||0;});paint(side);},
      get:function(side){var out={};forms.forEach(function(f){out[f.key]=vals[side][f.key];});return out;},
      total:function(side){return forms.reduce(function(s,f){return s+vals[side][f.key];},0);},
      edit:function(side,fn){editing=side;onChange=fn||null;
        el.querySelectorAll(".barset").forEach(function(s){s.classList.toggle("edit",s.dataset.side===side);});},
      freeze:function(){editing=null;el.querySelectorAll(".barset").forEach(function(s){s.classList.remove("edit");});},
      mark:function(side,keys){var set=el.querySelector('.barset[data-side="'+side+'"]');
        set.querySelectorAll(".bcol").forEach(function(c){c.classList.toggle("off",keys.indexOf(c.dataset.key)>=0);});}};
    paint("start");paint("end");
    return B;
  }

  /* ---------- activity runner ---------- */
  var api={stageSet:function(h){stageSet(h);},stageGrid:function(g,s){stageGrid(g,s);},Grid:Grid,support:function(){return support();},
    Table:Table,stageTable:function(T,s){stageTable(T,s);},

  function startActivity(act,opts){
    opts=opts||{};
    R={act:act,p:opts.p||act.gen(),data:{},i:0,moves:0,misses:0,solved:false,hintsThis:0,current:null,ctl:null,demo:!!opts.demo,custom:!!opts.custom,hintLevel:0,shown:false,token:++tokens};

    $("pview").classList.toggle("demo-lock",R.demo);

    setAsk(act.ask||"");stackClear();fb("");demoFn=null;
    runStep();

  function runStep(){
    if(R.solved)return;
    if(R.i>=R.act.steps.length){finishActivity();return;}
    var def=R.act.steps[R.i](R.p,R.data,api);
    /* a step can bow out for a problem it does not apply to (a fourth resistor that is not there) */

  /* ---------- balance: goal, then move ---------- */
  var GOAL_ORDER=["paren","fractions","combine","gatherx","constants","isolate"];
  var GOAL_CHIP={paren:"Remove parentheses",fractions:"Clear fractions",combine:"Combine like terms",gatherx:"Variable on one side",constants:"Move other terms away",isolate:"Isolate the variable"};
  var GOAL_DONE={paren:"Parentheses gone.",fractions:"Fractions cleared.",combine:"Like terms combined.",gatherx:"The variable is on one side.",constants:"Only the variable term is left on its side.",isolate:"Variable isolated."};
  var MOVES=[{op:"add",sym:"+",label:"Add"},{op:"sub",sym:MIN,label:"Subtract"},{op:"mul",sym:"×",label:"Multiply"},{op:"div",sym:"÷",label:"Divide"},{op:"dist",sym:"a( )",label:"Distribute"},{op:"comb",sym:"Σ",label:"Combine"}];
  function buildMoves(){
    $("moves").addEventListener("click",function(ev){var b=ev.target.closest(".move");if(!b||!B.active||R.demo)return;chipClicked(+b.dataset.k);});
    $("goals").addEventListener("click",function(ev){var b=ev.target.closest(".goal");if(!b||!B.active||R.demo)return;
      B.goal=(B.goal===b.dataset.goal?null:b.dataset.goal);closeMoveBar();renderControls();
      if(B.goal)fb("");});
  }
  /* One tap per move (Josh, Oct 3). The moves on offer are built from the equation: the move that
     makes progress, the same number with the opposite operation, subtracting a coefficient that
     should be divided, moving the wrong number, and combining or distributing when that is possible.
     A move counts as progress when it shortens the solver's shortest path. A move that does not is
     turned away with the reason and counts as a miss; after two misses the goal picker appears for
     the rest of the problem, and a move then waits for a goal. */
  function runChip(eq,ch){try{
      if(ch.op==="add"||ch.op==="sub"){var t=parseTileTerm(ch.val);if(t.v&&eq.vars.indexOf(t.v)<0)return null;return opAddTerm(eq,ch.op==="sub"?term(t.c.neg(),t.v):t);}
      if(ch.op==="mul"||ch.op==="div"){var k=parseTileNumber(ch.val);return opScale(eq,ch.op==="div"?new F(1).div(k):k);}
      if(ch.op==="dist"){var pr=ch.gref.split(":");return opDistribute(eq,pr[0],+pr[1]);}
      if(ch.op==="comb")return needsCombine(eq)?opCombine(eq):null;
    }catch(e){return null;}return null;}
  function stepsLeft(eq){if(isSolved(eq).solved||noVarLeft(eq))return 0;return botSolve(eq).steps;}
  function addSub(t){return t.c.sign()<0?{op:"sub",val:itemText(term(t.c.neg(),t.v),true)}:{op:"add",val:itemText(t,true)};}
  function chipLabel(eq,ch){
    var m=function(t){return '<span class="m">'+t+'</span>';};
    if(ch.op==="comb")return "Combine like terms";
    if(ch.op==="dist"){var pr=ch.gref.split(":");return "Distribute "+m(pretty(itemText(eq[pr[0]][+pr[1]],true)));}
    if(ch.op==="add"||ch.op==="sub"){var t=m(pretty(itemText(parseTileTerm(ch.val),true)));return ch.op==="add"?"Add "+t+" to both sides":"Subtract "+t+" from both sides";}
    return (ch.op==="mul"?"Multiply":"Divide")+" both sides by "+m(pretty(parseTileNumber(ch.val).toString()));
  }
  function rightChip(st){if(st.op==="add"||st.op==="sub"){var t=parseTileTerm(st.val);return addSub(st.op==="sub"?term(t.c.neg(),t.v):t);}return {op:st.op,val:st.val,gref:st.gref};}
  function chipsFor(eq){
    var st=botStep(eq);if(!st)return [];
    var right=rightChip(st),c=[right];
    if(right.op==="add"||right.op==="sub")c.push({op:right.op==="add"?"sub":"add",val:right.val});
    if(right.op==="mul"||right.op==="div"){c.push({op:right.op==="mul"?"div":"mul",val:right.val});var kk=parseTileNumber(right.val);if(right.op==="div"&&kk.isInt())c.push(addSub(term(kk.neg(),"")));}
    var xs=xSides(eq);SIDES(eq).forEach(function(sd){if(xs.indexOf(sd)<0){var o=sideOthers(eq[sd],eq.v)[0];if(o)c.push(addSub(term(o.c.neg(),o.v)));}});
    if(right.op!=="comb"&&needsCombine(eq))c.push({op:"comb"});
    var gs=groupsOf(eq);if(right.op!=="dist"&&gs.length)c.push({op:"dist",gref:gs[0].side+":"+gs[0].idx});
    var before=stepsLeft(eq),seen={},out=[];
    c.forEach(function(ch,i){var r=runChip(eq,ch);if(!r)return;var key=eqText(r.eq);if(seen[key])return;seen[key]=1;
      ch.progress=stepsLeft(r.eq)<before;ch.right=i===0;ch.label=chipLabel(eq,ch);out.push(ch);});
    out=out.slice(0,4);
    for(var i=out.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=out[i];out[i]=out[j];out[j]=t;}
    return out;
  }
  function rightIndex(){var k=-1;(B.chips||[]).forEach(function(ch,i){if(ch.right)k=i;});return k;}
  function balanceMount(eq,onSolved){
    B={eq:cloneEq(eq),orig:cloneEq(eq),history:[],goal:null,active:true,onSolved:onSolved,startMoves:R.moves,hintGoal:null,misses:0,goalOn:false,chips:[],hintChip:-1};
    hideWork();$("controls").classList.remove("hidden");
    stackPush({html:eqHTML(B.eq),cls:"start",tag:"start"});
    renderBalance();
  }
  function renderBalance(){
    if(!B.active)return;
    stageSet('<div class="eq" id="eq">'+eqHTML(B.eq)+'</div>');
    var sol=isSolved(B.eq);
    if(sol.solved){balanceSolved(sol);return;}
    if(noVarLeft(B.eq)){$("classify").classList.remove("hidden");$("controls").classList.add("hidden");
      if(!R.demo)fb("The variable canceled out. What does that tell you?","info");tools();return;}
    $("classify").classList.add("hidden");$("controls").classList.remove("hidden");
    B.chips=chipsFor(B.eq);B.hintChip=-1;
    renderControls();
    $("eq").querySelectorAll(".grp").forEach(function(el){el.addEventListener("click",function(){if(!B.active||R.demo)return;
      var k=-1;B.chips.forEach(function(ch,i){if(ch.op==="dist"&&ch.gref===el.dataset.g)k=i;});
      if(k>=0){chipClicked(k);return;}
      var ch={op:"dist",gref:el.dataset.g},r=runChip(B.eq,ch);if(!r)return;ch.progress=stepsLeft(r.eq)<stepsLeft(B.eq);ch.label=chipLabel(B.eq,ch);B.chips.push(ch);chipClicked(B.chips.length-1);});});
    tools();
  }
  function renderControls(){
    $("goalRow").classList.toggle("hidden",!B.goalOn);
    if(B.goalOn)$("goals").innerHTML=GOAL_ORDER.map(function(g){return '<button class="goal'+(B.goal===g?" on":"")+(B.hintGoal===g&&!B.goal?" hint":"")+'" data-goal="'+g+'" type="button">'+GOAL_CHIP[g]+'</button>';}).join("");
    $("moves").innerHTML=(B.chips||[]).map(function(ch,i){return '<button class="move chip'+(B.hintChip===i?" hint":"")+'" data-k="'+i+'" type="button">'+ch.label+'</button>';}).join("");
    var locked=B.goalOn&&!B.goal;
    $("moves").classList.toggle("locked",locked);
    $("goalRow").classList.toggle("now",locked);$("moveRow").classList.toggle("now",!locked);
    $("moveRow").querySelector(".rowlab").innerHTML=B.goalOn?"<i>2</i>Move":"Move";
  }
  function nudge(){var g=$("goals");g.classList.remove("nudge");void g.offsetWidth;g.classList.add("nudge");fb("Pick a goal first: what should this move accomplish?","warn");}
  function chipClicked(k){
    var ch=B.chips[k];if(!ch)return;
    if(B.goalOn&&!B.goal){nudge();return;}
    if(!ch.progress){missMove();return;}
    applyOp(ch.op,ch.val,ch.gref);
  }
  function missMove(){
    B.misses++;var g=nextGoal(B.eq),msg="That's a legal move, but it doesn't get "+B.eq.v+" any closer to being alone. "+goalQuestion(g);
    if(B.misses>=2&&!B.goalOn){B.goalOn=true;B.goal=null;renderControls();fb(msg+" Pick a goal first this time, then the move.","bad");return;}
    B.goal=null;renderControls();fb(msg,"bad");
  }
  var MOVE_PRE={add:"Add",sub:"Subtract",mul:"Multiply both sides by",div:"Divide both sides by"},MOVE_POST={add:"to both sides",sub:"from both sides",mul:"",div:""};
  function openMoveBar(html){var mb=$("moveBar");mb.innerHTML=html;mb.classList.remove("hidden");var c=$("mbCancel");if(c)c.addEventListener("click",cancelMove);}
  function closeMoveBar(){var mb=$("moveBar");if(mb){mb.classList.add("hidden");mb.innerHTML="";}B.pending=null;var e=$("eq");if(e)e.classList.remove("can-dist");}
  function cancelMove(){closeMoveBar();renderControls();}
  document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&B.active&&B.pending)cancelMove();});

  function shortGap(goal,eq){
    var xs=xSides(eq),v=eq.v;
    switch(goal){
      case "paren":{var n=groupsOf(eq).length;return n+" set"+(n>1?"s":"")+" of parentheses left.";}
      case "fractions":return "denominators "+denominators(eq).join(" and ")+" are still there.";
      case "combine":return "some like terms still need combining.";
      case "gatherx":return v+" is still on both sides.";
      case "constants":return xs.length===2?v+" is still on both sides.":"another term is still on "+v+"'s side.";
      case "isolate":{if(xs.length===2)return v+" is still on both sides.";if(sideOthers(eq[xs[0]],v).length)return "another term is still on "+v+"'s side.";var xt=sideVarTerms(eq[xs[0]],v)[0];if(xt&&!xt.c.isOne())return v+" still has a coefficient of "+xt.c.toString()+".";return "tidy up the other side.";}
    }
    return "";
  }
  function applyOp(op,val,gref,shown){
    if(!B.active)return;
    var before=cloneEq(B.eq),res,tag,extra=[],flip="";
    try{
      if(op==="add"||op==="sub"){
        var t=parseTileTerm(val||"");if(t.v&&B.eq.vars.indexOf(t.v)<0)throw new Error("There's no "+t.v+" in this problem.");
        res=opAddTerm(B.eq,op==="sub"?term(t.c.neg(),t.v):t);
        tag=(op==="add"?"add ":"subtract ")+pretty(itemText(t,true));
      }else if(op==="mul"||op==="div"){
        var k=parseTileNumber(val||"");res=opScale(B.eq,op==="div"?new F(1).div(k):k);
        tag=(op==="mul"?"× ":"÷ ")+k.toString();
        var n=termCount(before);
        if(n>2)flip+=" All "+n+" terms were "+(op==="mul"?"multiplied":"divided")+" by "+k.toString()+".";
        if(res.inlined)extra.push("The parentheses came off because the number in front became 1.");
        if(res.flipped)flip+=" The inequality sign flipped because you "+(op==="mul"?"multiplied":"divided")+" by a negative.";
      }else if(op==="dist"){
        var gs=groupsOf(B.eq);if(!gs.length)throw new Error("There are no parentheses to distribute.");
        var target=gs[0];if(gref){var pr=gref.split(":");target={side:pr[0],idx:parseInt(pr[1],10)};}
        res=opDistribute(B.eq,target.side,target.idx);tag="distribute";
        extra.push(pretty(itemText(res.from,true))+" = "+pretty(sideText(res.to))+".");
      }else if(op==="comb"){
        if(!needsCombine(B.eq))throw new Error("There are no like terms to combine right now.");
        res=opCombine(B.eq);tag="combine";
      }
    }catch(err){fb(err.message,"bad");if($("mbIn"))$("mbIn").select();return;}
    closeMoveBar();
    B.history.push({eq:cloneEq(B.eq),moves:R.moves});R.moves++;B.eq=res.eq;
    var chosen=!!B.goal,goal=B.goal||nextGoal(before),met=goalMet(goal,B.eq),metBefore=goalMet(goal,before),ok=met&&!metBefore,msg;
    if(ok)msg="✓ "+GOAL_DONE[goal];
    else if(!chosen)msg="✓ Good move.";
    else if(met)msg="Legal move, but “"+GOAL_CHIP[goal]+"” was already done.";
    else msg="Not yet: "+shortGap(goal,B.eq);
    var why=(ok||met||!chosen?"":goalGap(goal,B.eq)+" ")+extra.join(" ");
    B.lastNote=flip.trim();
    fb(msg+flip,ok||!chosen?"ok":"warn",why.trim());
    stackPush({html:eqHTML(B.eq),tag:tag,cls:shown?"hinted":(ok||!chosen?"":"off"),det:(chosen?"Goal: ":"")+GOAL_CHIP[goal]+(ok?" (reached)":!chosen?"":met?" (already done)":" (not reached)")+(shown?". Shown by a hint.":".")});
    B.goal=null;B.hintGoal=null;R.hintLevel=0;
    renderBalance();
  }
  function balanceAnswer(sol){
    var v=B.eq.v;
    if(sol==="none")return {text:"no solution",html:"no solution"};
    if(sol==="all")return {text:"all real numbers",html:"all real numbers"};
    if(sol.compound)return {text:sol.lo.plain()+" "+sol.rel+" "+v+" "+sol.rel2+" "+sol.hi.plain(),html:sol.lo.html()+" "+sol.rel+" "+vh(v)+" "+sol.rel2+" "+sol.hi.html()};
    if(sol.value)return {text:v+" "+sol.rel+" "+sol.value.plain(),html:vh(v)+" "+sol.rel+" "+sol.value.html()};
    return {text:v+" = "+sideText(sol.expr),html:vh(v)+" = "+sideHTML(sol.expr),expr:sol.expr};
  }
  function balanceSolved(sol){
    var ref=botSolve(B.orig).steps,used=R.moves-B.startMoves,ans=balanceAnswer(sol);
    B.active=false;$("controls").classList.add("hidden");$("classify").classList.add("hidden");closeMoveBar();
    if(typeof sol==="string")stackPush({html:ans.html,cls:"fin"});else stackMarkLast("fin");
    if(!R.demo)fb("✓ Solved in "+used+" move"+(used===1?"":"s")+". "+(used<=ref?"That's the shortest path.":"The shortest path takes "+ref+".")+(typeof sol!=="string"&&B.lastNote?" "+B.lastNote:""),"ok");

  }
  function classify(choice,shown){
    var truth=constantOutcome(B.eq);

    if(choice===truth){stackPush({html:truth==="all"?"all real numbers":"no solution",cls:"fin"+(shown?" hinted":""),det:why});fb("✓ "+why,"ok");B.active=false;$("classify").classList.add("hidden");B.onSolved(balanceAnswer(truth));}

  }

  }

  /* ---------- hints: goal, then move, then show me ---------- */
  function botMoveText(st){
    if(st.op==="dist"){var pr=st.gref.split(":");return "Distribute "+pretty(itemText(B.eq[pr[0]][+pr[1]],true))+".";}
    if(st.op==="comb")return "Combine like terms on each side.";
    if(st.op==="mul")return "Multiply both sides by "+num(st.val)+".";
    if(st.op==="div")return "Divide both sides by "+num(st.val)+".";
    if(st.val.charAt(0)==="-")return "Add "+st.val.slice(1)+" to both sides.";
    return "Subtract "+st.val+" from both sides.";
  }
  function applyBot(st,shown){
    if(st.op==="sub"&&st.val.charAt(0)==="-")applyOp("add",st.val.slice(1),null,shown);
    else applyOp(st.op,st.val,st.gref,shown);
  }
  function goalQuestion(g){
    var v=B.eq.v;
    if(g==="fractions")return "The denominators are "+denominators(B.eq).join(" and ")+". What's the smallest number they all divide into?";
    if(g==="constants"){var o=sideOthers(B.eq[xSides(B.eq)[0]],v)[0];return "The term riding along with "+v+" is "+pretty(itemText(o,true))+". What undoes it?";}
    if(g==="gatherx")return "Subtract the smaller "+v+" term from both sides.";
    if(g==="isolate"){var xt=sideVarTerms(B.eq[xSides(B.eq)[0]],v)[0];return v+" is being multiplied by "+xt.c.toString()+". What undoes that?";}
    if(g==="paren")return "Multiply the number in front by every term inside.";
    return "Put like terms together.";
  }
  function hint(){
    if(!R.act||R.solved||R.demo)return;
    if(B.active){
      var g=nextGoal(B.eq);countHint();
      if(g==="classify"){
        if(R.hintLevel===0){fb("Both sides are plain numbers now. Can they ever be equal?","info");R.hintLevel=1;}
        else{classify(constantOutcome(B.eq),true);R.hintLevel=0;}
        tools();return;
      }
      var st=botStep(B.eq);
      if(R.hintLevel===0){B.hintGoal=g;renderControls();fb("Goal: "+GOAL_CHIP[g]+". "+goalQuestion(g),"info");R.hintLevel=1;}
      else if(R.hintLevel===1){B.hintGoal=g;B.hintChip=rightIndex();renderControls();fb("Goal: "+GOAL_CHIP[g]+". Move: "+botMoveText(st),"info");R.hintLevel=2;}
      else{B.goal=B.goalOn?g:null;applyBot(st,true);}
      tools();return;
    }

    if(def.kind==="isolate"&&R.ctl&&R.ctl.one){countHint();R.shown=true;R.ctl.one();R.shown=false;tools();return;}
    if(def.solve&&R.ctl&&R.ctl.auto){countHint();R.shown=true;R.ctl.auto(def.solve());R.shown=false;R.hintLevel=0;tools();}
  }

  /* ---------- worked example: the student clicks through it one move at a time ---------- */
  var demoFn=null;
  function demoNext(label,fn){demoFn=fn;$("demoNext").textContent=label;}
  function demoGo(){if(!R.demo||R.solved||!demoFn)return;var f=demoFn;demoFn=null;f();}
  function stopDemo(){

    closeMoveBar();$("classify").classList.add("hidden");$("controls").classList.add("hidden");hideWork();
    $("stage").classList.remove("demo");$("stage").classList.remove("solved");$("pview").classList.remove("demo-lock");

  function demoIsolate(def){
    var st=R.ctl.plan();
    if(!st){demoNext("Next",function(){});return;}
    R.ctl.show();
    fb("<b>"+st.html+".</b> "+st.why,"info");
    demoNext("Do it",function(){
      var i=R.i;R.shown=true;R.ctl.submit();R.shown=false;
      if(R.demo&&!R.solved&&R.i===i)demoNext("Next move",function(){demoIsolate(def);});
    });

  function demoStep(def){
    if(def.kind==="balance"){demoPlan();return;}
    if(def.kind==="isolate"){demoIsolate(def);return;}
    var val=def.kind==="show"?null:def.solve(),note="";
    R.ctl.show(val);
    if(def.kind==="grid")note=def.hint||"";
    else if(def.kind==="show")note=def.log&&def.log.check?"Result: "+def.log.check:"";
    else if(typeof def.check==="function")note=def.check(val).msg||"";

    demoNext("Next",function(){R.shown=true;R.ctl.submit();R.shown=false;});
  }
  function demoWhy(g,st){
    var v=B.eq.v,act=botMoveText(st).replace(/\.$/,"");
    if(g==="paren"){var pr=st.gref.split(":"),it=B.eq[pr[0]][+pr[1]],ex=opDistribute(B.eq,pr[0],+pr[1]);
      return "Multiply every term inside the parentheses by "+it.k.toString()+": "+pretty(itemText(it,true))+" becomes "+pretty(sideText(ex.to))+".";}
    if(g==="fractions"){var ds=denominators(B.eq),l=ds.reduce(lcm,1);
      return (ds.length>1?"The denominators are "+ds.join(" and ")+", and "+l+" is the smallest number they all divide into.":"The denominator is "+ds[0]+".")+" "+act+" so every fraction clears.";}
    if(g==="combine")return "Like terms are sharing a side. Combine them so there's less to move.";

    digits:function(def,done){

      var sel={},busy=false;

      function set(i,on){sel[i]=1;if(!on)delete sel[i];

      work.querySelector(".digits").addEventListener("click",function(ev){

      function go(){
        if(busy)return;
        var extra=[],missing=[];
        map.forEach(function(d){if(d.sig&&!sel[d.i])missing.push(d);if(!d.sig&&sel[d.i])extra.push(d);});
        if(!extra.length&&!missing.length){busy=true;

            {msg:def.why||("That's "+map.filter(function(d){return d.sig;}).length+" significant figures.")},Object.keys(sel).map(Number),done);
          return;
        }
        var firstNonZero=map.filter(function(x){return x.ch!=="0";})[0];
        var lead=extra.filter(function(d){return d.ch==="0"&&firstNonZero&&d.i<firstNonZero.i;}).length;
        var lastNonZero=map.filter(function(x){return x.ch!=="0";}).pop();
        var hasPoint=str.indexOf(".")>=0;
        var msg;
        if(lead)msg="Zeros in front of the first nonzero digit only place the decimal point. They never count.";
        else if(extra.length)msg="Trailing zeros count only when there is a decimal point in the number.";
        else if(missing.some(function(d){return d.ch!=="0";}))msg="Every nonzero digit is significant. Mark them all.";
        else if(hasPoint&&missing.some(function(d){return lastNonZero&&d.i>lastNonZero.i;}))msg="The decimal point makes a trailing zero count: it says the measurement really was made to that place.";
        else msg="A zero between two significant digits always counts.";
        fb(msg,"bad");
      }
      work.querySelector(".go").addEventListener("click",go);
      function put(list){Object.keys(sel).forEach(function(i){set(+i,false);});(list||[]).forEach(function(i){set(i,true);});}

    train:function(def,done){
      var placed=[],busy=false,target=Qty.unitParse(def.target);
      showWork('<p class="q">'+def.prompt+'</p><div class="train" id="trainRow"></div><p class="trainnote" id="trainNote"></p>'+
        '<div class="chiprow" id="trainPal"><span class="lab">Click a conversion to add it:</span></div>');
      /* a conversion train is one calculation: multiply everything through at full precision,
         then round once, to the fewest significant figures the measurements carry */
      function chain(){
        var q=new Qty.Q(new Qty.Dec(def.start.d.n,def.start.d.e,Infinity,true),def.start.u);
        var least=def.start.d.exact?Infinity:def.start.d.sig;
        placed.forEach(function(c){
          var f=def.factors[c.i],top=c.flip?f.b:f.a,bot=c.flip?f.a:f.b;
          [top,bot].forEach(function(x){if(!x.d.exact&&!x.d.isZero())least=Math.min(least,x.d.sig);});
          q=q.mul(new Qty.Q(new Qty.Dec(top.d.n,top.d.e,Infinity,true),top.u))
             .div(new Qty.Q(new Qty.Dec(bot.d.n,bot.d.e,Infinity,true),bot.u));
        });
        return new Qty.Q(least===Infinity?q.d:Qty.roundSig(q.d,least),q.u);
      }
      function unitCell(q,net){
        var u=q.u,top=[],bot=[];
        Object.keys(u).sort().forEach(function(k){
          var n=Math.abs(u[k]),tag='<span class="'+((net[k]||0)===0?"cancel":"")+'">'+Qty.unitKeyHTML(k)+(n>1?"<sup>"+n+"</sup>":"")+'</span>';
          (u[k]>0?top:bot).push(tag);
        });
        return Qty.html(q.d)+" "+(top.join("\u00b7")||"1")+(bot.length?"/"+bot.join("\u00b7"):"");
      }
      function render(){
        var net=chain().u,h='<div class="tcard start"><div class="tval">'+unitCell(def.start,net)+'</div></div>';
        placed.forEach(function(c,j){
          var f=def.factors[c.i],top=c.flip?f.b:f.a,bot=c.flip?f.a:f.b;
          h+='<span class="tx">\u00d7</span><div class="tcard"><div class="tval">'+unitCell(top,net)+'</div><div class="tbar"></div><div class="tval">'+unitCell(bot,net)+'</div>'+
             '<div class="tbtns"><button type="button" class="tflip" data-j="'+j+'" title="Flip">\u21c5</button><button type="button" class="tdel" data-j="'+j+'" title="Remove">\u00d7</button></div></div>';
        });
        var ok=Qty.unitSame(net,target);
        h+='<span class="tx">=</span><div class="tans"><input id="trainAns" '+(ok?"":"disabled")+' placeholder="?" autocomplete="off" spellcheck="false" aria-label="answer">'+
           '<span class="unit">'+Qty.unitHTML(target)+'</span></div>'+(ok?'<button class="btn primary go" type="button">Check</button>':'');
        $("trainRow").innerHTML=h;
        /* Say up front how many significant figures the answer needs, and when the plain form
           would read back with a different count, say how to write it unambiguously. */
        var wanted=chain(),sig=wanted.d.sig,howMany=" Give it to "+sig+" significant figure"+(sig===1?"":"s")+".";
        var ambiguous=ok&&isFinite(sig)&&Qty.needsSci(wanted.d,sig);
        $("trainNote").innerHTML=ok?("Only "+Qty.unitHTML(target)+" is left. Work out the number and type it in."+howMany+
            (ambiguous?' Written plainly it would read as fewer, so use scientific notation (like 4.50e2) or a trailing decimal point.':"")):
          "Units left over: <b>"+(Qty.unitHTML(net)||"none")+"</b>. Keep going until only "+Qty.unitHTML(target)+" is left.";
        $("trainRow").querySelectorAll(".tflip").forEach(function(b){b.addEventListener("click",function(){if(R.demo)return;placed[+b.dataset.j].flip=!placed[+b.dataset.j].flip;render();});});
        $("trainRow").querySelectorAll(".tdel").forEach(function(b){b.addEventListener("click",function(){if(R.demo)return;placed.splice(+b.dataset.j,1);render();});});
        var go=$("trainRow").querySelector(".go");if(go)go.addEventListener("click",submit);
        var inp=$("trainAns");
        if(inp)inp.addEventListener("keydown",function(ev){if(ev.key==="Enter"){ev.preventDefault();submit();}});
      }
      $("trainPal").innerHTML+=def.factors.map(function(f,i){
        return '<button type="button" class="chip pal" data-i="'+i+'">'+f.a.html()+" = "+f.b.html()+'</button>';
      }).join("");
      $("trainPal").addEventListener("click",function(ev){
        var b=ev.target.closest(".pal");if(!b||R.demo)return;
        placed.push({i:+b.dataset.i,flip:false});render();fb("");
      });
      function submit(){
        if(busy)return;
        var q=chain(),inp=$("trainAns");
        if(!Qty.unitSame(q.u,target)){fb("The units don't come out to "+Qty.unitHTML(target)+" yet.","warn");return;}
        var res=Qty.checkAnswer(inp?inp.value:"",q,{alternates:def.alternates||[]});
        if(res.ok){busy=true;
          keep(q);
          succeed(def,'<span class="m">'+q.html()+'</span>',{msg:def.why||("Units cancel down to "+Qty.unitHTML(target)+", and the value carries "+q.d.sig+" significant figures.")},q.text(),done);
          return;
        }
        fb(res.why==="format"?"Type a number, like 0.250 or 2.5e3.":
           res.why==="sigfigs"?("Right value, wrong number of significant figures. "+sigReason(q.d.sig)+(Qty.needsSci(q.d,q.d.sig)?" Plain digits would read as fewer here, so write it in scientific notation or put a decimal point on the end.":"")):
           "Check the arithmetic along the chain.","bad");
      }
      /* the completed chain is the thing worth looking at, so it moves up to the stage and the
         answer lands beside it, the same way a finished graph does */
      function keep(q){
        var net=chain().u;
        var h='<div class="tcard start"><div class="tval">'+unitCell(def.start,net)+'</div></div>';
        placed.forEach(function(c){
          var f=def.factors[c.i],top=c.flip?f.b:f.a,bot=c.flip?f.a:f.b;
          h+='<span class="tx">\u00d7</span><div class="tcard"><div class="tval">'+unitCell(top,net)+
             '</div><div class="tbar"></div><div class="tval">'+unitCell(bot,net)+'</div></div>';
        });
        h+='<span class="tx">=</span><div class="tcard start"><div class="tval">'+q.html()+'</div></div>';
        /* a problem with more than one train (a limiting reactant) keeps them all, one under the
           other; the problem statement stays above them, since the equation is part of the work */
        var body=$("stageBody"),kept=body.querySelector(".trainkeep");
        if(kept){kept.insertAdjacentHTML("beforeend",'<div class="train frozen">'+h+'</div>');return;}
        var head=[].slice.call(body.querySelectorAll(".prompt,.given")).map(function(n){return n.outerHTML;}).join("");
        var wrap=document.createElement("div");wrap.className="gridwrap";
        var card=document.createElement("div");card.className="gridcard trainkeep";
        card.innerHTML='<div class="train frozen">'+h+'</div>';
        wrap.appendChild(card);
        body.innerHTML=head?'<div class="trainhead">'+head+'</div>':"";body.appendChild(wrap);
      }
      /* which measurement set the limit: the one they started with, or a card in the chain
         (Avogadro's number, a molar volume). Exact numbers such as a mole ratio never do. */
      function sigReason(sig){
        if(!def.start.d.exact&&def.start.d.sig===sig)return "The measurement you started with has "+sig+", so the answer keeps "+sig+".";
        return "The least precise number in the chain has "+sig+", so the answer keeps "+sig+".";
      }
      function put(v){placed=(v.cards||[]).map(function(c){return {i:c.i,flip:!!c.flip};});render();var inp=$("trainAns");if(inp)inp.value=v.answer;}
      render();
      return {auto:function(v){put(v);submit();},show:put,submit:submit};
    },
    grid:function(def,done){

    config:function(def,done){

        work.querySelectorAll(".cfgsub").forEach(function(b){

    /* The circuit reducer. The schematic the pack drew is on the stage; each resistor in it carries

       parallel, and types the equivalent resistance; the group is replaced by one resistor and the
       drawing redrawn, until one is left. def.fresh() makes a new circuit model; def.check(moves)

    reduce:function(def,done){
      var model=def.fresh(),sel={},pending=null,moves=[],busy=false;
      showWork('<p class="q">'+def.prompt+'</p><div class="redbtns"><button class="btn" type="button" data-k="S">Combine in series</button>'+
        '<button class="btn" type="button" data-k="P">Combine in parallel</button><button class="btn quiet small" type="button" data-k="clear">Clear selection</button></div>'+
        '<div class="cfgask hidden" id="redAsk"><span id="redAskQ"></span> <input id="redN" autocomplete="off" spellcheck="false" aria-label="equivalent resistance"> Ω '+
        '<button class="btn primary" type="button" id="redAdd">Add</button></div><p class="trainnote" id="redNote"></p>');
      /* the click handler is set on the freshly drawn picture each time (a property, not an added
         listener), so a finished problem's circuit can never answer clicks meant for the next one */
      function draw(){if(busy&&!$("redNote"))return;def.draw(model);
        var host=$("stageBody").querySelector(".circhost");

        $("redNote").innerHTML=model.done()?"":"Click two or more resistors, then say how they are connected. Resistors left: <b>"+model.count()+"</b>.";}
      function ids(){return Object.keys(sel).sort();}

        var b=ev.target.closest("button");if(!b||R.demo||busy)return;

        fb(r.msg,"ok");return true;

        if(!res.ok){fb(res.why==="sigfigs"?"Right value, wrong number of significant figures.":

        moves.push({ids:pending.ids,kind:pending.kind,value:Qty.text(want.d)});

        if(model.done()){finish();return true;}

    /* Balancing an equation: coefficients go up and down, subscripts never move, and the atom

    chemeq:function(def,done){

        return out;
      }
      function elementList(){
        var seen=[];

        return seen;

          '<div class="sf">'+Ions.html(f)+"</div></div>";
      }
      function render(){
        var h=L.map(function(f,i){return species(f,cl[i],"l",i);}).join('<span class="plus">+</span>');
        h+='<span class="arrow">\u2192</span>';
        h+=R.map(function(f,i){return species(f,cr[i],"r",i);}).join('<span class="plus">+</span>');
        $("ceq").innerHTML=h;
        var a=countsOf(L,cl),b=countsOf(R,cr);
        $("ctally").innerHTML='<table class="tallytab"><tr><th></th>'+elementList().map(function(s){return "<th>"+s+"</th>";}).join("")+"</tr>"+
          '<tr><td class="side">left</td>'+elementList().map(function(s){return '<td class="'+((a[s]||0)===(b[s]||0)?"match":"off")+'">'+(a[s]||0)+"</td>";}).join("")+"</tr>"+
          '<tr><td class="side">right</td>'+elementList().map(function(s){return '<td class="'+((a[s]||0)===(b[s]||0)?"match":"off")+'">'+(b[s]||0)+"</td>";}).join("")+"</tr></table>";
        $("ceq").querySelectorAll(".cstep").forEach(function(btn){

            var side=btn.dataset.side,i=+btn.dataset.i,d=+btn.dataset.d,arr=side==="l"?cl:cr;
