<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Solver · Physics</title>
<style>
:root{
  --navy:#12294B; --navy-deep:#0B1B33; --navy-2:#1C3A66; --slate:#5C6B7A; --line:#DDE2E8; --mist:#E9ECF1; --cloud:#F5F6F8;
  --ink:#1B2432; --red:#C8102E; --ok:#2F7D4F; --ok-bg:#E7F3EC; --warn:#A8620F; --warn-bg:#FBF1E3; --bad-bg:#FBEAEC;
  --ui:"Segoe UI",Roboto,"Helvetica Neue",Arimo,Arial,sans-serif;
  --math:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,Tinos,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.hidden{display:none !important}
.m{font-family:var(--math)}
.v{font-style:italic}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .1em}
.frac>.num{border-bottom:2px solid currentColor;padding:0 .18em .04em}
.frac>.den{padding:.04em .18em 0}
.app{max-width:1180px;margin:0 auto;padding:10px 16px 20px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;text-align:left;border-radius:6px}
.brand svg{width:30px;height:40px;flex:none}
.brand b{display:block;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--slate);font-size:12px}
.crumbs{flex:1;min-width:0;color:var(--slate);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}
.sess{position:relative}
.drawer{position:absolute;right:0;top:calc(100% + 6px);width:330px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(11,27,51,.18);padding:14px;z-index:20}
.drawer label{display:block;font-size:12px;color:var(--slate);margin:0 0 4px}
.drawer .textin{width:100%}
.drawer .tally{font-size:13px;color:var(--slate);margin:10px 0}
.drawer .tally b{color:var(--ink)}
.coderow{display:flex;gap:8px;align-items:center}
.code{flex:1;font-family:ui-monospace,Menlo,Consolas,"Cousine",monospace;font-size:13px;letter-spacing:.02em;background:var(--mist);padding:8px 9px;border-radius:4px;word-break:break-all;user-select:all}
.drawer .note{font-size:12px;color:var(--slate);margin:8px 0 0}
.drawer .note.bad{color:var(--red)}

/* buttons and inputs */
.btn{background:#fff;border:1px solid #C9D0D9;border-radius:6px;padding:7px 13px;font-weight:600;line-height:1.2}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-deep)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--slate);font-weight:500;padding:6px 9px}
.btn.quiet:hover{color:var(--ink);background:var(--mist)}
.btn.small{padding:5px 10px;font-size:13px}
.btn[aria-disabled="true"],.btn:disabled{opacity:.4;cursor:default}
.textin{background:#fff;border:1px solid #C9D0D9;border-radius:6px;padding:7px 9px}
.badge{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--navy);color:#fff;font-size:12px;text-align:center;margin-left:4px}

/* home */
.subjects{display:flex;gap:6px;margin:0 0 14px}
.subjects button{border:1px solid #C9D0D9;background:#fff;border-radius:999px;padding:6px 16px;font-weight:600}
.subjects button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.unit{margin:0 0 18px}
.unit h2{font-size:15px;margin:0 0 8px;color:var(--navy)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.topic{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:600;min-height:58px}
.topic:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(18,41,75,.08)}
.topic .tn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mist);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:13px}
.topic .tt{flex:1}
.topic .tc{flex:none;font-size:12px;font-weight:600;color:var(--ok)}

/* problem view */
.bar{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.bar h2{margin:0 6px 0 2px;font-size:17px}
.bar .spacer{flex:1}
.custom{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.custom .textin{flex:1;min-width:240px;font-family:var(--math);font-size:18px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.stage{background:var(--navy);color:#fff;border-radius:8px;padding:14px 20px 16px;min-height:180px;position:relative;display:flex;flex-direction:column;justify-content:center}
.stage.solved{background:#173D2C}
.stage.demo::before{content:"Worked example";position:absolute;top:10px;left:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#B9C4D3}
.stagebody{min-height:80px}
.ask{text-align:center;font-size:14px;color:#C9D3E0;min-height:0}
.ask:empty{display:none}
.pview.demo-lock .controls,.pview.demo-lock .work,.pview.demo-lock .classify,.pview.demo-lock .tools,.pview.demo-lock .eq{pointer-events:none}
.stage .prompt{font-size:18px;text-align:center;margin:6px 0 4px;line-height:1.4}
.stage .given{font-family:var(--math);font-size:30px;text-align:center;margin:6px 0}
.stage .given .frac{font-size:.86em}
.stage .ready{text-align:center;color:#C9D3E0;font-size:17px}
.stage .ready .btns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stage .ready .btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.stage .ready .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.stage .answer{font-family:var(--math);font-size:34px;text-align:center}
.stage .answer .frac{font-size:.86em}
.stage .answer small{display:block;font-family:var(--ui);font-size:14px;color:#BFD8C8;margin-top:6px}
.eq{font-family:var(--math);font-size:40px;line-height:1.25;text-align:center;padding:12px 4px;min-height:80px}
.eq .eqside{white-space:nowrap}
.eq .rel{margin:0 .35em}
.eq .frac{font-size:.86em}
.eq .grp{display:inline-block;border-radius:6px;padding:0 .12em}
.eq.can-dist .grp{cursor:pointer;outline:2px dashed rgba(255,255,255,.5);background:rgba(200,16,46,.22)}
.eq.can-dist .grp:hover{background:rgba(200,16,46,.5)}
.movebar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px auto 0;background:rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;font-size:16px}
.movebar input{width:92px;border:0;border-radius:5px;padding:6px 8px;font-family:var(--math);font-size:20px;text-align:center;color:var(--ink)}
.movebar .btn{padding:6px 12px}
.movebar .btn.primary{background:#fff;color:var(--navy);border-color:#fff}
.movebar .btn.quiet{color:#C9D3E0}
.movebar .btn.quiet:hover{background:rgba(255,255,255,.12);color:#fff}
.classify{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.classify button{background:#fff;color:var(--ink);border:1px solid #fff;border-radius:6px;padding:8px 14px;font-weight:600}

/* grid inside stage */
.gridwrap{display:flex;justify-content:center;gap:18px;align-items:center;flex-wrap:wrap}
.gridcard{background:#fff;border-radius:6px;padding:6px}
.gridcard svg{display:block;width:300px;height:300px;max-width:100%}
.gridcard svg.wide{width:330px;height:190px}
.gridcard svg .gl{stroke:#E1E5EA;stroke-width:1}
.gridcard svg .ax{stroke:#1B2432;stroke-width:1.6}
.gridcard svg .tick{font-family:var(--ui);font-size:11px;fill:#5C6B7A}
.gridcard svg .ln{stroke:#12294B;stroke-width:2.4;fill:none}
.gridcard svg .fit{stroke:#C8102E;stroke-width:2.4;fill:none}
.gridcard svg .pt{fill:#C8102E;stroke:#fff;stroke-width:1.5}
.gridcard svg .sc{fill:#12294B;opacity:.85}
.gridcard svg .tri{stroke:#C8102E;stroke-width:2;fill:none;stroke-dasharray:4 3}
.gridcard svg .tlab{font-family:var(--ui);font-size:12px;fill:#C8102E;font-weight:700}
.gridcard svg .hov{fill:rgba(200,16,46,.35)}
.gridcard svg.clickable{cursor:crosshair}
.gridside{color:#fff;font-size:16px;max-width:240px}
.gridside .m{font-size:22px}
.gridside.done{max-width:280px;text-align:center}
.gridside.done .answer{font-size:28px}
.gridside.done .answer small.sub{color:#fff;opacity:.85;font-size:14px;margin-top:6px}
.gridside.done .ready .btns{margin-top:10px}
.gridcard svg .stair{stroke:#C8102E;stroke-width:1.4;fill:none;stroke-dasharray:3 3;opacity:.45}

/* feedback line */
.fb{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin:10px 0 0;min-height:30px}
.fbmsg{flex:1;min-width:200px;font-size:15px;padding:5px 10px;border-radius:6px}
.fbmsg:empty{padding:0}
.fbmsg.ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.fbmsg.warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.fbmsg.bad{background:var(--bad-bg);color:var(--red);font-weight:600}
.fbmsg.info{background:var(--mist);color:var(--ink)}
.fbmsg .why{background:none;border:0;padding:0 0 0 8px;color:inherit;text-decoration:underline;font-weight:500;opacity:.8}
.fbwhy{flex-basis:100%;font-size:14px;color:var(--slate);padding:0 10px}
.tools{display:flex;gap:2px;flex:none}
.demobar{display:flex;gap:6px;flex:none;align-items:center}
.demobar .btn.primary{min-width:112px}
.classify button.pick{background:#FFE9EC;border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.45)}
.eq .grp.demo-target{outline:2px dashed rgba(255,255,255,.7);background:rgba(200,16,46,.4)}
.movebar input[readonly]{background:#fff;cursor:default}
.pview.demo-lock .work .go{display:none}

/* goal and move controls */
.controls{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.crow{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.crow+.crow{border-top:1px solid var(--mist);margin-top:4px;padding-top:8px}
.rowlab{flex:none;width:62px;font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;padding-top:7px}
.rowlab i{font-style:normal;display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--mist);color:var(--navy);text-align:center;line-height:18px;margin-right:4px}
.crow.now .rowlab{color:var(--red)}
.crow.now .rowlab i{background:var(--red);color:#fff}
.goals,.moves{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.goal{border:1px solid #C9D0D9;background:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.goal:hover{border-color:var(--navy)}
.goal.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.goal.hint{box-shadow:0 0 0 3px rgba(200,16,46,.35);border-color:var(--red)}
.goals.nudge{animation:nudge .45s}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.move{display:flex;align-items:center;gap:6px;border:1px solid #C9D0D9;background:var(--cloud);border-radius:6px;padding:6px 12px;font-weight:600;font-size:14px}
.move .sym{font-family:var(--math);font-size:19px;line-height:1;min-width:14px;text-align:center}
.move:hover{border-color:var(--navy);background:#fff}
.move.on{border-color:var(--red);background:#fff;box-shadow:0 0 0 2px rgba(200,16,46,.2)}
.moves.locked .move{opacity:.4}

/* step widgets */
.work{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:10px}
.work .q{font-size:16px;margin:0 0 10px}
.work .q .m{font-size:19px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{background:#fff;border:1px solid #C9D0D9;border-radius:6px;padding:8px 14px;font-weight:600}
.choice button:hover{border-color:var(--navy);background:var(--mist)}
.choice button.pick{border-color:var(--navy);background:var(--navy);color:#fff}
.choice button .m{font-size:18px}
.fills{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.fills label{display:flex;align-items:center;gap:8px;font-family:var(--math);font-size:20px}
.fills input{width:96px;border:1px solid #C9D0D9;border-radius:6px;padding:6px 8px;font-family:var(--math);font-size:18px;text-align:center}
.slots{font-family:var(--math);font-size:26px;display:flex;align-items:center;gap:.15em;flex-wrap:wrap;margin:2px 0 10px}
.slots .frac{font-size:.9em}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:2.3em;height:1.55em;border:2px dashed #AEB7C2;border-radius:6px;padding:0 .3em;color:#98A3B0;font-size:.8em;vertical-align:middle;cursor:pointer;background:#fff}
.slot small{font-family:var(--ui);font-size:12px}
.slot.sel{border-color:var(--red);background:#FFF5F6}
.slot.filled{border-style:solid;border-color:var(--navy);color:var(--ink);font-size:.9em}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chiprow .lab{font-size:13px;color:var(--slate);margin-right:4px}
.chip{font-family:var(--math);font-size:20px;border:1px solid #C9D0D9;background:var(--cloud);border-radius:6px;padding:3px 13px;user-select:none}
.chip:hover{border-color:var(--navy)}
.chip.armed{border-color:var(--red);box-shadow:0 0 0 2px rgba(200,16,46,.25);background:#fff}
.shown{font-family:var(--math);font-size:22px;margin:0 0 10px}
.shown .frac{font-size:.9em}
.shown .note{font-family:var(--ui);font-size:14px;color:var(--slate);display:block;margin-top:4px}
.work .go{margin-top:2px}

/* work stack */
.stack{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:520px;overflow:auto}
.stack h3{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.05em}
.stack ol{list-style:none;margin:0;padding:0}
.stack li{border-top:1px solid var(--mist);padding:7px 2px 6px}
.stack li:first-child{border-top:0}
.stack .ln{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:0;text-align:left}
.stack .ln .m{flex:1;font-size:18px;line-height:1.35}
.stack .ln .m .frac{font-size:.85em}
.stack .ln .m .rel{margin:0 .25em}
.stack .ln .m .eqside{white-space:nowrap}
.stack .tag{flex:none;font-size:12px;color:var(--slate)}
.stack .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:6px;align-self:flex-start}
.stack li.off .dot{background:#E0A84A}
.stack li.start .dot{background:#AEB7C2}
.stack li.hinted .dot{background:#7E97BD}
.stack li.fin .ln .m{color:var(--ok);font-weight:600}
.stack .det{font-size:13px;color:var(--slate);margin:4px 0 0 16px}
.stack .empty{color:#98A3B0;font-size:14px;margin:4px 0}

footer{margin-top:18px;font-size:12px;color:var(--slate);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer i{opacity:.8}
@media (max-width:620px){.eq{font-size:30px}.stage .given{font-size:24px}.rowlab{width:auto}.crow{flex-direction:column;gap:4px}}
@media (prefers-reduced-motion:reduce){.goals.nudge{animation:none}}

/* chemistry widgets */
.digits{font-family:var(--math);font-size:34px;display:flex;align-items:center;gap:1px;margin:2px 0 8px;flex-wrap:wrap}
.digits .dg{font:inherit;background:#fff;border:1px solid #C9D0D9;border-radius:5px;padding:0 6px;line-height:1.3}
.digits .dg:hover{border-color:var(--navy)}
.digits .dg.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.digits .dgx{padding:0 1px;color:var(--slate)}
.digits .dgu{font-family:var(--ui);font-size:18px;color:var(--slate);margin-left:8px}
.dgnote{font-size:13px;color:var(--slate);margin:0 0 10px}
.scirow{display:flex;align-items:center;gap:8px;margin:2px 0 10px;font-family:var(--math);font-size:22px}
.scirow input{width:110px;border:1px solid #C9D0D9;border-radius:6px;padding:6px 8px;font-family:var(--math);font-size:20px;text-align:center}
.scirow input.exp{width:64px;align-self:flex-start;font-size:16px;padding:3px 6px}
.scirow .times{color:var(--ink)}
.scirow .unit{font-family:var(--ui);font-size:16px;color:var(--slate)}
.train{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.tcard{position:relative;border:1px solid #C9D0D9;border-radius:6px;background:#fff;padding:6px 10px;min-width:96px;text-align:center;font-family:var(--math);font-size:18px}
.tcard.start{background:var(--mist);font-weight:600}
.tcard .tbar{border-top:2px solid var(--ink);margin:3px -4px}
.tcard .tval .cancel{text-decoration:line-through;color:#9AA4B0}
.tcard .tbtns{position:absolute;top:-10px;right:-8px;display:flex;gap:2px}
.tcard .tbtns button{width:20px;height:20px;line-height:1;border-radius:50%;border:1px solid #C9D0D9;background:#fff;font-size:12px;padding:0;color:var(--slate)}
.tcard .tbtns button:hover{border-color:var(--navy);color:var(--ink)}
.tx{font-family:var(--math);font-size:20px;color:var(--slate)}
.tans{display:flex;align-items:center;gap:6px}
.tans input{width:120px;border:1px solid #C9D0D9;border-radius:6px;padding:7px 8px;font-family:var(--math);font-size:18px;text-align:center}
.tans input:disabled{background:var(--mist);color:#9AA4B0}
.tans .unit{font-size:15px;color:var(--slate)}
.trainnote{font-size:13px;color:var(--slate);margin:0 0 10px}
.chip.pal{font-family:var(--math);font-size:16px;padding:4px 10px}
.un{font-family:var(--ui);font-size:.8em;color:inherit}
/* periodic table */
.modal{position:fixed;inset:0;background:rgba(11,27,51,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .sheet{background:#fff;border-radius:10px;padding:12px 14px 14px;max-width:960px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(11,27,51,.35)}
.sheethead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sheethead b{font-size:15px}
.sheethead span{flex:1;min-width:200px;font-size:13px;color:var(--slate)}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:2px;min-width:760px}
.ptable .el{border:1px solid var(--line);border-radius:3px;background:#fff;padding:3px 2px 2px;text-align:center;line-height:1.1;cursor:pointer}
.ptable .el .z{display:block;font-size:9px;color:var(--slate)}
.ptable .el .sym{display:block;font-size:13px;font-weight:700}
.ptable .el .ms{display:block;font-size:8.5px;color:var(--slate)}
.ptable .el:hover{border-color:var(--navy)}
.ptable .el.on{background:var(--navy);border-color:var(--navy)}
.ptable .el.on .sym,.ptable .el.on .z,.ptable .el.on .ms{color:#fff}
.ptable .el.alkali{background:#FBF1E3}.ptable .el.alkaline{background:#F7F0DE}
.ptable .el.transition{background:#EEF2F7}.ptable .el.metal{background:#F1F4F8}
.ptable .el.metalloid{background:#E9F1EC}.ptable .el.nonmetal{background:#E7F3EC}
.ptable .el.halogen{background:#FBEAEC}.ptable .el.noble{background:#EDE9F6}
.ptable .el.lan{background:#F4EEF7}.ptable .el.act{background:#F7EEF3}
.ptable .el.un .ms{font-style:italic}
@media (max-width:820px){.modal .sheet{overflow-x:auto}}

/* ionic formula builder */
.ionbuild{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.ioncard{border:1px solid #C9D0D9;border-radius:8px;background:#fff;padding:8px 12px;text-align:center;min-width:104px}
.ionsym{font-family:var(--math);font-size:24px;line-height:1.2}
.ionstep{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.ionstep .istep{width:24px;height:24px;border-radius:50%;border:1px solid #C9D0D9;background:var(--cloud);line-height:1;font-size:14px;padding:0}
.ionstep .istep:hover{border-color:var(--navy);background:#fff}
.ionstep .icount{font-family:var(--math);font-size:18px;min-width:18px}
.iform{font-family:var(--math);font-size:28px}
.iontally{font-size:14px;color:var(--slate);margin:0 0 10px}
.iontally b.zero{color:var(--ok)}
.iontally b.off{color:var(--red)}
/* ion reference sheet */
.ionsheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.ioncol h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate)}
.ionline{display:flex;gap:8px;align-items:baseline;padding:2px 0;border-top:1px solid var(--mist)}
.ionline:first-of-type{border-top:0}
.ionline .if{font-family:var(--math);font-size:16px;min-width:74px}
.ionline .inm{font-size:13px;color:var(--ink)}

/* formula rearranging */
.rad{display:inline-flex;align-items:stretch}
.rad>.sign{font-size:1.05em}
.rad>.under{border-top:2px solid currentColor;padding:.1em .15em 0;margin-top:.12em}
.sym{font-style:italic;font-family:var(--math)}
.fxeq{font-family:var(--math);font-size:27px;text-align:center;background:var(--mist);border-radius:8px;padding:12px 8px;margin:2px 0 12px}
.fxeq .frac{font-size:.82em}
.fxeq .rel{margin:0 .3em}
.fxmoves{display:flex;gap:8px;flex-wrap:wrap}
.fxmove{background:#fff;border:1px solid #C9D0D9;border-radius:6px;padding:8px 14px;font-weight:600;text-align:left}
.fxmove:hover{border-color:var(--navy);background:var(--mist)}
.fxmove.pick{border-color:var(--navy);background:var(--navy);color:#fff}
.fxmove .m{font-size:1.05em}
@media (max-width:620px){.fxeq{font-size:22px}.fxmoves{flex-direction:column}}

/* motion graphs */
.mline{fill:none;stroke:var(--red);stroke-width:2.5}
.area{fill:rgba(16,42,80,.12);stroke:none}
.axlab{font-size:11px;fill:#5A6472;font-family:var(--ui)}
.gridside .prompt{font-size:17px;margin:0 0 6px}

.fxsheet{padding:12px 16px 18px;display:grid;gap:10px}
.fxrow{border:1px solid #E4E8EE;border-radius:8px;padding:10px 12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fxbig{font-size:24px;min-width:190px}
.fxlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#5A6472}
.fxlegend .leg .m{font-size:15px;color:var(--ink)}

/* free-body diagrams */
.fbd{display:grid;grid-template-columns:repeat(3,minmax(96px,1fr));grid-template-rows:repeat(3,56px);gap:8px;
  justify-items:center;align-items:center;max-width:400px;margin:4px auto 14px}
.fbd .obj{background:var(--navy);color:#fff;border-radius:8px;padding:12px 16px;font-size:13px;font-weight:600;text-align:center;min-width:86px}
.fbd .fslot{border:2px dashed #C9D0D9;border-radius:8px;min-width:86px;height:46px;display:flex;align-items:center;justify-content:center;gap:6px;color:#8A93A0;background:#fff}
.fbd .fslot .arr{font-size:20px;line-height:1}
.fbd .fslot.filled{border-style:solid;border-color:var(--navy);color:var(--ink)}
.fbd .fslot .m{font-size:18px}
.fbd .fslot:hover{border-color:var(--navy)}

.blk{fill:var(--navy)}
.blab{font-size:12px;fill:#fff;font-family:var(--ui);font-weight:600}
.farrow{stroke:var(--red);stroke-width:2.5}
.fhead{fill:var(--red)}
.flab{font-size:12px;fill:var(--ink);font-family:var(--ui);font-weight:600}

.fn{font-family:var(--math);font-style:normal;margin-right:.05em}
.gridcard svg .comp{stroke:#12294B;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
.gridcard svg .arc{stroke:#5A6472;stroke-width:1.2;fill:none}

/* value tables */
.ftable{border-collapse:collapse;margin:0 auto;font-family:var(--math);font-size:22px}
.ftable th{background:var(--mist);font-family:var(--ui);font-size:13px;font-weight:700;color:#5A6472;padding:6px 12px;border:1px solid #D7DCE3}
.ftable td{padding:6px 16px;border:1px solid #D7DCE3;text-align:center;min-width:46px}
.stage .given .ftable th{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.stage .given .ftable td{border-color:rgba(255,255,255,.35)}

/* half planes */
.gridcard svg .shade{fill:rgba(200,16,46,.16)}
.gridcard svg .shade2{fill:rgba(18,41,75,.16)}
.gridcard svg .dash{stroke-dasharray:6 4}
.sys{display:flex;align-items:center;justify-content:center;gap:8px}
.sys .brace{font-size:2.6em;font-weight:200;line-height:.9}
.sys .eqs{display:flex;flex-direction:column;gap:4px;text-align:left}
.stage .given .sys{font-size:.95em}

/* inclines and force diagrams */
.gridcard svg .ramp{fill:#E8ECF2;stroke:#9AA5B4;stroke-width:1.5}
.gridcard svg .comp{stroke-dasharray:5 4;stroke-width:2}
.gridcard svg .fric{stroke:#0F7A4A}
.gridcard svg .two{stroke:#12294B}
.gridcard svg .two+.fhead,.gridcard svg .fhead{fill:#C8102E}

/* molecular shapes */
.gridcard svg.shapepic{width:300px;height:210px}
.gridcard svg .atomo{fill:#E8ECF2;stroke:#9AA5B4;stroke-width:1.5}
.gridcard svg .atomc{fill:#12294B;stroke:#12294B}
.gridcard svg .atomlab{font-family:var(--math);font-size:15px;fill:#1B2432}
.gridcard svg .atomc+.atomlab{fill:#fff}
.gridcard svg .bondline{stroke:#5A6472;stroke-width:2.5}
.gridcard svg .dashb{stroke-dasharray:5 4}
.gridcard svg .wedge{fill:#5A6472}
.gridcard svg .lpdot{fill:#C8102E}

/* graph pieces */
.gridcard svg .ln2{stroke:#12294B;stroke-width:2.4;fill:none;stroke-linejoin:round}
.gridcard svg .ln2.red{stroke:#C8102E}
.gridcard svg .ptopen{fill:#fff;stroke:#12294B;stroke-width:2}

.sys .cond{font-family:var(--ui);font-size:12px;color:#5A6472;margin-left:10px}
.stage .given .sys .cond{color:rgba(255,255,255,.75)}

/* trajectories */
.gridcard svg .ground{stroke:#9AA5B4;stroke-width:2}
.gridcard svg .traj{fill:none;stroke:#C8102E;stroke-width:2.5}
.gridcard svg .tick2{stroke:#9AA5B4;stroke-width:1.2;stroke-dasharray:4 3}

/* equation balancer */
.chemeq{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 14px}
.chemeq .spec{display:flex;flex-direction:column;align-items:center;gap:3px}
.chemeq .coef{display:flex;align-items:center;gap:2px}
.chemeq .coef .cn{font-family:var(--math);font-size:20px;min-width:22px;text-align:center;font-weight:700;color:var(--red)}
.chemeq .cstep{width:22px;height:22px;border:1px solid #C9D0D9;background:#fff;border-radius:5px;font-size:14px;line-height:1;padding:0}
.chemeq .cstep:hover{border-color:var(--navy);background:var(--mist)}
.chemeq .sf{font-family:var(--math);font-size:24px}
.chemeq .plus,.chemeq .arrow{font-family:var(--math);font-size:22px;color:#5A6472;padding:0 2px;align-self:flex-end;margin-bottom:2px}
.tallytab{border-collapse:collapse;margin:0 auto 12px;font-family:var(--math);font-size:16px}
.tallytab th{font-family:var(--ui);font-size:12px;font-weight:700;color:#5A6472;padding:3px 10px}
.tallytab td{padding:3px 10px;text-align:center;border:1px solid #E4E8EE}
.tallytab td.side{font-family:var(--ui);font-size:11px;color:#5A6472;border:none;text-align:right;padding-right:8px}
.tallytab td.match{background:rgba(15,122,74,.12);color:var(--ok);font-weight:700}
.tallytab td.off{background:rgba(200,16,46,.10);color:var(--red);font-weight:700}

/* two-way frequency table */
.tabcard{padding:14px 16px}
table.twoway{border-collapse:collapse;font-size:15px;color:var(--ink)}
table.twoway th,table.twoway td{border:1px solid var(--line);padding:7px 12px;text-align:center;min-width:62px}
table.twoway th{background:var(--cloud);font-weight:600;font-size:14px}
table.twoway th.corner{background:transparent;border:0}
table.twoway th.grouphd{font-weight:600;letter-spacing:.02em}
table.twoway th.rh{text-align:left;white-space:nowrap}
table.twoway td.tot,table.twoway th.tot{background:var(--cloud);font-weight:600}
table.twoway td.gt{font-weight:700}
table.twoway td.blank{background:#fff;padding:3px 5px}
table.twoway td.wasblank{background:var(--ok-bg)}
table.twoway input.tin{width:56px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;font:inherit;text-align:center;background:#fff;color:var(--ink)}
table.twoway input.tin:focus{outline:2px solid var(--navy);outline-offset:1px}
table.twoway td.off{background:var(--bad-bg);color:var(--red)}
table.twoway.hot td[data-k]{cursor:pointer}
table.twoway.hot th[data-sel]{cursor:pointer}
table.twoway.hot td[data-k]:hover,table.twoway.hot th[data-sel]:hover{background:var(--mist)}
table.twoway td.sh{background:var(--ok-bg);box-shadow:inset 0 0 0 2px var(--ok)}
table.twoway td.sh2{background:#fdf1d6;box-shadow:inset 0 0 0 2px #c8901f}
table.twoway td.sel{background:var(--navy);color:#fff;font-weight:600}
.tnote{color:var(--slate);font-size:13px;margin:-2px 0 10px}

.fills input.wide{min-width:178px}
.answer .note{font-family:var(--ui);font-size:14px;line-height:1.5;color:rgba(255,255,255,.8);margin:12px 0 0}

/* circular motion and gravitation */
.gridcard svg .orbitpath{stroke:#5C6B7A;stroke-width:1.6;fill:none;stroke-dasharray:6 5}
.gridcard svg .objdot{fill:#12294B;stroke:#fff;stroke-width:2}
.gridcard svg .body{fill:#12294B;opacity:.82}
.farrow2{stroke:#12294B;stroke-width:2.5}
.fhead2{fill:#12294B}
.flab2{font-size:12px;fill:#12294B;font-family:var(--ui);font-weight:600}

/* a finished conversion train, kept on the solved screen */
/* the stage is dark, so a white card living on it has to say what colour its text is */
.gridcard.trainkeep{padding:14px 16px;max-width:800px;color:var(--ink);background:#fff}
.train.frozen{flex-wrap:wrap;gap:6px}
.train.frozen .tcard{cursor:default}
.train.frozen+.train.frozen{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line,#d5dbe3)}
.trainhead{text-align:center;margin-bottom:10px}
.stage .given.eq9{font-size:25px}
.stage .prompt .un{font-size:1em}
.trainhead .prompt{margin:0 0 4px}

/* pick out members of a set: which species break apart, which ions are spectators */
.pickset{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.pickset .pk{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 12px;
  font-family:var(--math);font-size:18px;color:var(--ink);cursor:pointer}
.pickset .pk:hover{border-color:var(--navy)}
.pickset .pk.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pickset.strike .pk.on{background:#fff;color:#9AA4B0;border-color:var(--line);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--red)}
.pickset .pk .st{font-family:var(--ui);font-size:12px;color:var(--slate);margin-left:2px}
.pickset .pk.on .st{color:inherit}

/* energy bar charts */
.gridcard.barcard{padding:14px 16px;color:var(--ink);background:#fff}
.bars{display:flex;align-items:flex-end;gap:14px}
.barsep{font-size:26px;color:var(--slate);align-self:center;padding-bottom:40px}
.barset{display:flex;flex-direction:column;align-items:center}
.bshead{font-family:var(--ui);font-size:13px;font-weight:700;color:var(--slate);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.bcols{display:flex;gap:8px;border-bottom:2px solid var(--ink);padding:0 4px}
.bcol{display:flex;flex-direction:column;align-items:center;width:44px}
.bstack{display:flex;flex-direction:column-reverse;gap:2px;margin-bottom:4px}
.bcell{display:block;width:30px;height:13px;border:1px dashed #D5DAE1;border-radius:2px;background:transparent}
.bcell.on{background:var(--navy);border:1px solid var(--navy)}
.bcol.off .bcell.on{background:var(--red);border-color:var(--red)}
.bcol.off .blab{color:var(--red)}
/* the buttons keep their space when hidden, so the start and end bars line up block for block */
.bbtn{display:flex;visibility:hidden;gap:2px;margin:2px 0}
.barset.edit .bbtn{visibility:visible}
.bbtn button{width:20px;height:20px;padding:0;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:13px;line-height:1;cursor:pointer}
.bbtn button:hover{border-color:var(--navy)}
.blab{font-family:var(--math);font-size:15px;margin-top:4px;text-align:center;line-height:1.1}
.btot{font-family:var(--ui);font-size:13px;color:var(--slate);margin-top:8px}
.barset.edit .bshead{color:var(--navy)}

/* electron configuration builder */
.cfgnow{font-family:var(--math);font-size:24px;min-height:34px;margin:2px 0 4px}
.cfgnow sup{font-size:.62em}
.cfgnow .muted{font-family:var(--ui);font-size:14px;color:var(--slate)}
.cfgrows{display:flex;flex-direction:column;gap:6px;margin:6px 0 10px}
.cfgrow{display:flex;gap:6px;flex-wrap:wrap}
.cfgsub{min-width:52px;padding:7px 10px;border:1px solid #C9D0D9;border-radius:6px;background:#fff;font-family:var(--math);font-size:18px}
.cfgsub:hover{border-color:var(--navy)}
.cfgsub.used{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cfgsub.pend{background:var(--navy);border-color:var(--navy);color:#fff}
.cfgsub.core{background:var(--mist);color:#9AA5B1;border-color:var(--line);cursor:default}
.cfgask{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.cfgask input{width:70px;border:1px solid #C9D0D9;border-radius:6px;padding:6px 8px;font-size:18px;text-align:center}
.cfgtools{margin-top:2px}
/* orbital diagrams */
.orbs{display:flex;flex-direction:column;gap:6px;margin:6px 0 8px}
.orbrow{display:flex;align-items:center;gap:0}
.orblab{width:40px;font-family:var(--math);font-size:18px}
.orb{width:38px;height:40px;border:1.5px solid var(--ink);margin-right:-1.5px;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:1px;font-size:22px;line-height:1;padding:0}
button.orb:hover{background:var(--mist)}
.orb .up{color:var(--navy)}
.orb .dn{color:var(--red)}
.gridcard.orbkeep{padding:12px 16px;color:var(--ink)}
.orbs.frozen{margin:0}
/* the small periodic table */
.gridcard.minicard{padding:10px}
.mini{display:grid;grid-template-columns:repeat(18,29px);grid-auto-rows:31px;gap:2px}
.mc{position:relative;border:1px solid #D5DBE3;border-radius:3px;background:#fff;color:var(--ink);padding:0;font-family:var(--ui);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.mc .mz{font-size:8px;color:#7B8794;font-style:normal}
.mc .ms2{font-size:12px;font-weight:600;font-style:normal;font-family:var(--ui)}
.mc.ml{border:1.5px dashed #8A6D3B}
.mini:not(.pickable) .mc{cursor:default}
.mini.pickable .mc:hover{border-color:var(--navy);background:var(--mist)}
.mc.hl{background:#FDE7C8;border-color:var(--warn)}
.mc.pick{outline:2px solid var(--navy)}
.mc.miss{background:var(--bad-bg);border-color:var(--red)}
.mc.hit{background:var(--ok);border-color:var(--ok);color:#fff}
.mc.hit .mz{color:#E7F3EC}
.minicap{font-size:12px;color:var(--slate);text-align:center;margin-top:6px}
@media (max-width:700px){.mini{grid-template-columns:repeat(18,18px);grid-auto-rows:22px}.mc .mz{display:none}.mc .ms2{font-size:9px}}

/* matter and particles */
.pbox{display:block;width:220px;height:220px}
.pcap{text-align:center;font-size:12px;color:var(--slate);margin-top:4px}
.parrow{font-size:34px;color:#fff;align-self:center}
.stage .given.given-text{font-family:var(--ui);font-size:26px}
.hcurve .hclab{font-family:var(--ui);font-size:13px;font-weight:700;fill:var(--ink);text-anchor:middle}
.hcurve .hctick{font-family:var(--ui);font-size:11px;fill:#5C6B7A;text-anchor:end}
.hcurve .hcax{font-family:var(--ui);font-size:11px;fill:#5C6B7A;text-anchor:middle}
.gridcard svg.hcurve{width:360px;height:242px}
.sortdone{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-family:var(--ui);font-size:17px;text-align:left}
.sortdone>div{background:rgba(255,255,255,.08);border-radius:6px;padding:8px 12px;max-width:360px}
.sortdone b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#BFD8C8;margin-bottom:2px}
/* charges */
.gridcard svg .qpos{fill:#C8102E}
.gridcard svg .qneg{fill:#12294B}
.gridcard svg .qsign{font:700 22px var(--ui);fill:#fff}
.gridcard svg .qname{font:700 13px var(--ui);fill:var(--slate)}
/* circuits */
.circhost svg.circ{display:block;height:auto;max-width:100%}
.circ .cw{stroke:#1B2432;stroke-width:2;fill:none}
.circ .cw.thick{stroke-width:4}
.circ .zz{fill:none;stroke:#1B2432;stroke-width:2.2;stroke-linejoin:round}
.circ .rlab{font:700 13px var(--ui);fill:var(--ink)}
.circ .rval{font:600 11px var(--ui);fill:var(--slate)}
.circ .res.pickable{cursor:pointer}
.circ .res.pickable:hover .zz{stroke:var(--navy-2);stroke-width:3}
.circ .res.rsel .zz{stroke:#C8102E;stroke-width:3.2}
.circ .res.rsel .rlab,.circ .res.rsel .rval{fill:#C8102E}
.redbtns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
table.vir{margin:0 auto;border-collapse:collapse;font-family:var(--ui);font-size:16px}
table.vir td,table.vir th{padding:4px 12px;border-bottom:1px solid rgba(255,255,255,.2);text-align:right}
table.vir th{font-size:12px;letter-spacing:.06em;color:#BFD8C8}
/* area model for multiplying binomials */
table.boxmodel{border-collapse:collapse;font-family:var(--math);font-size:22px;color:var(--ink);margin:4px}
table.boxmodel th{padding:8px 16px;font-weight:600;color:var(--navy)}
table.boxmodel th.bm0{color:var(--slate);font-size:16px}
table.boxmodel td{width:92px;height:62px;border:2px solid #1B2432;text-align:center;background:#fff}
table.boxmodel td.mid{background:#FDF0D8}
.gridcard svg .parent{stroke:#8A96A3;stroke-width:1.8;stroke-dasharray:5 4;fill:none}
.gridcard svg .sym{stroke:#C8102E;stroke-width:1.4;stroke-dasharray:4 4}
/* physics Unit 11: waves */
.gridcard svg.wv{width:420px;height:220px}
.gridcard svg .pulseA{stroke:#2563EB;stroke-width:2.4;fill:none;stroke-linejoin:round}
.gridcard svg .pulseB{stroke:#C8102E;stroke-width:2.4;fill:none;stroke-linejoin:round}
.gridcard svg .sumln{stroke:#1E7B4A;stroke-width:3.2;fill:none;stroke-linejoin:round}
.gridcard svg .lndash{stroke:#12294B;stroke-width:1.8;stroke-dasharray:6 4;fill:none}
.gridcard svg .dim{stroke:#5C6B7A;stroke-width:1.2}
.gridcard svg .post{fill:#5C6B7A}
.gridcard svg .pipe{stroke:#1B2432;stroke-width:3}
.gridcard svg .pipecap{stroke:#1B2432;stroke-width:7}
.gridcard svg .wfront{stroke:#2563EB;stroke-width:1.6;fill:none}
.gridcard svg .src{fill:#C8102E}
.gridcard svg .lis{fill:#FDF0D8;stroke:#1B2432;stroke-width:1.5}
.gridcard svg .qsign2{font-family:var(--ui);font-size:12px;font-weight:700;fill:#1B2432}
.gridcard svg .spk{fill:#5C6B7A}
.kA{color:#7FB0FF;font-weight:700}.kB{color:#FF8A8A;font-weight:700}
/* physics Unit 12: fluids */
.gridcard svg .water{fill:#CFE3F7}
.gridcard svg .tankw{stroke:#1B2432;stroke-width:3;fill:none}
.gridcard svg .blk{fill:#8A6D4B;stroke:#1B2432;stroke-width:1.5}
/* the proton tracker */
.ptrk{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;margin:10px 0 6px}
.ptc{border:2px solid #D7DCE3;border-radius:8px;padding:8px 12px;min-width:92px;text-align:center;background:#fff;cursor:pointer}
.ptc .ptf{font-family:var(--math);font-size:24px;color:var(--ink)}
.ptc .pth{display:flex;gap:4px;justify-content:center;margin-top:6px;min-height:6px;flex-wrap:wrap}
.ptc .ph{font-family:var(--ui);font-size:12px;font-weight:700;border:1.5px solid #C8102E;color:#C8102E;background:#fff;border-radius:12px;padding:2px 8px;cursor:pointer}
.ptc .ph.on{background:#C8102E;color:#fff}

<script>
/* ===================== ENGINE (pure, DOM-free) =====================
   Linear expressions in any number of variables. term.v is "" for a constant or a letter. */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1;}
function F(n,d){ if(d===undefined)d=1; if(d===0)throw new Error("Division by zero"); if(d<0){n=-n;d=-d;} var g=gcd(n,d); this.n=n/g; this.d=d/g; }
F.prototype.add=function(o){return new F(this.n*o.d+o.n*this.d,this.d*o.d);};
F.prototype.sub=function(o){return new F(this.n*o.d-o.n*this.d,this.d*o.d);};
F.prototype.mul=function(o){return new F(this.n*o.n,this.d*o.d);};
F.prototype.div=function(o){if(o.n===0)throw new Error("Division by zero");return new F(this.n*o.d,this.d*o.n);};
F.prototype.neg=function(){return new F(-this.n,this.d);};
F.prototype.abs=function(){return new F(Math.abs(this.n),this.d);};
F.prototype.isZero=function(){return this.n===0;};
F.prototype.isOne=function(){return this.n===1&&this.d===1;};
F.prototype.isInt=function(){return this.d===1;};
F.prototype.sign=function(){return this.n<0?-1:(this.n>0?1:0);};
F.prototype.eq=function(o){return this.n===o.n&&this.d===o.d;};
F.prototype.cmp=function(o){var a=this.n*o.d,b=o.n*this.d;return a<b?-1:(a>b?1:0);};
F.prototype.val=function(){return this.n/this.d;};
F.prototype.toString=function(){var t=this.d===1?String(this.n):(this.n+"/"+this.d);return t.replace("-","\u2212");};
F.prototype.plain=function(){return this.d===1?String(this.n):(this.n+"/"+this.d);};
F.prototype.html=function(){var a=this.abs();var s=this.sign()<0?"\u2212":"";return a.d===1?s+a.n:s+fracHTML(a.n,a.d);};
function lcm(a,b){return Math.abs(a*b)/gcd(a,b);}
function term(c,v){return {kind:"term",c:c,v:v||""};}
function group(k,terms){return {kind:"group",k:k,terms:terms};}
function cloneItem(it){ if(it.kind==="term")return term(new F(it.c.n,it.c.d),it.v); return group(new F(it.k.n,it.k.d),it.terms.map(cloneItem)); }
function SIDES(eq){return eq.M?["L","M","R"]:["L","R"];}
function cloneEq(eq){var e={L:eq.L.map(cloneItem),R:eq.R.map(cloneItem),rel:eq.rel,v:eq.v,vars:eq.vars.slice()};if(eq.M){e.M=eq.M.map(cloneItem);e.rel2=eq.rel2;}return e;}

/* ---------- parsing ---------- */
function normalizeInput(s){
  return s.replace(/\u2212/g,"-").replace(/[\u00d7\u22c5\u00b7]/g,"*").replace(/\u00f7/g,"/")
          .replace(/\u2264/g,"<=").replace(/\u2265/g,">=").replace(/\s+/g,"");
}
function collectVars(s){return (s.match(/[a-zA-Z]/g)||[]).filter(function(ch,i,a){return a.indexOf(ch)===i;}).sort();}
function pickTarget(vars,want){
  if(want&&vars.indexOf(want)>=0)return want;
  if(vars.length===1)return vars[0];
  if(vars.indexOf("y")>=0)return "y";
  return vars[vars.length-1];
}
function parseEquation(src,want){
  var s=normalizeInput(src);
  var m2=s.match(/^(.*?)(<=|>=|<|>)(.*?)(<=|>=|<|>)(.*)$/);
  var m=s.match(/^(.*?)(<=|>=|=|<|>)(.*)$/);
  if(!m)throw new Error("I need an equals sign or an inequality symbol.");
  var vars=collectVars(s);
  if(!vars.length)throw new Error("There's no variable to solve for.");
  if(vars.length>2)throw new Error("Use at most two variables. I found: "+vars.join(", "));
  var v=pickTarget(vars,want);
  var cv=function(r){return r==="<="?"\u2264":(r===">="?"\u2265":r);};
  if(m2){
    if(!m2[1]||!m2[3]||!m2[5])throw new Error("A compound inequality needs three parts.");
    if((m2[2][0]==="<")!==(m2[4][0]==="<"))throw new Error("Both symbols in a compound inequality should point the same way.");
    if(vars.length>1)throw new Error("Compound inequalities here use one variable.");
    var ce={L:parseSide(m2[1]),M:parseSide(m2[3]),R:parseSide(m2[5]),rel:cv(m2[2]),rel2:cv(m2[4]),v:v,vars:vars};
    ["L","M","R"].forEach(function(k){if(!ce[k].length)ce[k]=[term(new F(0))];});
    if(!hasVar(ce))throw new Error("There's no variable to solve for.");
    if(sideHasAnyVar(ce.L)||sideHasAnyVar(ce.R))throw new Error("For a compound inequality, keep the variable in the middle part with numbers on the outside, like -2 <= x - 3 < 3. Anything else has to be split into two separate inequalities.");
    return ce;
  }
  if(!m[1]||!m[3])throw new Error("Both sides need something on them.");
  if(vars.length>1&&m[2]!=="=")throw new Error("With two variables, use an equation (=).");
  var L=parseSide(m[1]),R=parseSide(m[3]);
  if(!L.length)L=[term(new F(0))]; if(!R.length)R=[term(new F(0))];
  var eq={L:L,R:R,rel:cv(m[2]),v:v,vars:vars};
  if(!hasVar(eq))throw new Error("There's no variable to solve for.");
  return eq;
}
function tokenize(s){
  var toks=[],i=0;
  while(i<s.length){
    var ch=s[i];
    if(/[0-9.]/.test(ch)){var j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;toks.push({t:"num",v:s.slice(i,j)});i=j;}
    else if(/[a-zA-Z]/.test(ch)){toks.push({t:"var",name:ch});i++;}
    else if("+-*/()".indexOf(ch)>=0){toks.push({t:ch});i++;}
    else throw new Error("I don't understand \""+ch+"\".");
  }
  return toks;
}
function numToF(str){
  if(str.indexOf(".")>=0){var parts=str.split(".");if(parts.length>2||str===".")throw new Error("Bad number "+str);var dec=parts[1].length;return new F(parseInt(parts[0]+parts[1]||"0",10),Math.pow(10,dec));}
  return new F(parseInt(str,10));
}
function parseSide(s){
  var toks=tokenize(s),p=0;
  function peek(){return toks[p];}
  function parseSum(inner){
    var out=[],sign=1,first=true;
    while(p<toks.length&&(!inner||peek().t!==")")){
      var tk=peek();
      if(tk.t==="+"||tk.t==="-"){sign=1;while(p<toks.length&&(peek().t==="+"||peek().t==="-")){if(peek().t==="-")sign=-sign;p++;}}
      else if(!first) throw new Error("Missing + or - between terms.");
      out.push(parseProduct(sign,inner));sign=1;first=false;
    }
    return out;
  }
  function parseProduct(sign,inner){
    var coef=new F(sign),vname="",grp=null,any=false;
    while(p<toks.length){
      var tk=peek();
      if(tk.t==="num"){coef=coef.mul(numToF(tk.v));p++;any=true;}
      else if(tk.t==="var"){if(vname)throw new Error("That's not linear (two variables multiplied).");vname=tk.name;p++;any=true;}
      else if(tk.t==="*"){p++;}
      else if(tk.t==="/"){p++;var d=peek();if(!d)throw new Error("Nothing after the fraction bar.");
        if(d.t==="num"){var den=numToF(d.v);if(den.isZero())throw new Error("Can't divide by zero.");coef=coef.div(den);p++;}
        else if(d.t==="("){p++;var dn=parseSum(true);if(!peek()||peek().t!==")")throw new Error("Missing a closing parenthesis.");p++;
          if(dn.some(function(x){return x.kind!=="term"||x.v;}))throw new Error("Only numbers can go in a denominator.");
          var dv=dn.reduce(function(a,x){return a.add(x.c);},new F(0));if(dv.isZero())throw new Error("Can't divide by zero.");coef=coef.div(dv);}
        else throw new Error("A fraction bar needs a number after it.");}
      else if(tk.t==="("){
        if(inner)throw new Error("Parentheses inside parentheses aren't supported here.");
        if(grp)throw new Error("Two sets of parentheses multiplied together isn't linear.");
        p++;var g=parseSum(true);if(!peek()||peek().t!==")")throw new Error("Missing a closing parenthesis.");p++;any=true;grp=g;
      }
      else break;
    }
    if(!any)throw new Error("Something is missing near a sign.");
    if(grp){
      if(vname)throw new Error("That's not linear (a variable times parentheses).");
      grp.forEach(function(g){if(g.kind!=="term")throw new Error("Nested parentheses aren't supported.");});
      if(grp.every(function(t){return !t.v;})){var sum=grp.reduce(function(a,t){return a.add(t.c);},new F(0));return term(coef.mul(sum));}
      return group(coef,grp);
    }
    return term(coef,vname);
  }
  var items=parseSum(false);
  if(p<toks.length)throw new Error("Unexpected \")\".");
  return items;
}

/* ---------- inspection ---------- */
function sideHasAnyVar(side){return side.some(function(it){return it.kind==="term"?!!it.v:it.terms.some(function(t){return !!t.v;});});}
function sideHasVar(side,v){return side.some(function(it){return it.kind==="term"?it.v===v:it.terms.some(function(t){return t.v===v;});});}
function hasVar(eq){return SIDES(eq).some(function(s){return sideHasAnyVar(eq[s]);});}
function groupsOf(eq){var out=[];SIDES(eq).forEach(function(s){eq[s].forEach(function(it,i){if(it.kind==="group")out.push({side:s,idx:i});});});return out;}
function denominators(eq){
  var ds={};
  SIDES(eq).forEach(function(s){eq[s].forEach(function(it){
    if(it.kind==="term"){if(it.c.d!==1)ds[it.c.d]=1;}
    else{if(it.k.d!==1)ds[it.k.d]=1;it.terms.forEach(function(t){if(t.c.d!==1)ds[t.c.d]=1;});}
  });});
  return Object.keys(ds).map(Number).sort(function(a,b){return a-b;});
}
function sideVarTerms(side,v){return side.filter(function(it){return it.kind==="term"&&it.v===v;});}
function sideConsts(side){return side.filter(function(it){return it.kind==="term"&&!it.v;});}
function sideOthers(side,v){return side.filter(function(it){return it.kind==="term"&&it.v!==v;});}
function needsCombine(eq){
  return SIDES(eq).some(function(s){var seen={};return eq[s].some(function(it){if(it.kind!=="term")return false;if(seen[it.v])return true;seen[it.v]=1;return false;});});
}
function xSides(eq){var v=eq.v;return SIDES(eq).filter(function(s){return sideHasVar(eq[s],v);});}
function sideCombined(side){var seen={};return side.every(function(it){if(it.kind!=="term")return false;if(seen[it.v])return false;seen[it.v]=1;return true;});}
function isSolved(eq){
  var v=eq.v;
  function chk(A,B,rel){
    if(A.length===1&&A[0].kind==="term"&&A[0].v===v&&A[0].c.isOne()&&!sideHasVar(B,v)&&sideCombined(B)){
      var single=B.length===1&&!B[0].v;
      return {solved:true,value:single?B[0].c:null,expr:B,rel:rel};
    }
    return null;
  }
  if(eq.M){
    var isC=function(S){return S.length===1&&S[0].kind==="term"&&!S[0].v;};
    var mid=eq.M.length===1&&eq.M[0].kind==="term"&&eq.M[0].v===v&&eq.M[0].c.isOne();
    if(mid&&isC(eq.L)&&isC(eq.R)){
      var lo=eq.L[0].c,hi=eq.R[0].c,r1=eq.rel,r2=eq.rel2,mir=false;
      if(r1===">"||r1==="\u2265"){var tmp=lo;lo=hi;hi=tmp;var t1=flipRel(r2);r2=flipRel(r1);r1=t1;mir=true;}
      return {solved:true,compound:true,lo:lo,hi:hi,rel:r1,rel2:r2,mirrored:mir};
    }
    return {solved:false};
  }
  var r=chk(eq.L,eq.R,eq.rel);if(r)return r;
  r=chk(eq.R,eq.L,flipRel(eq.rel));if(r){r.mirrored=true;return r;}
  return {solved:false};
}
function flipRel(rel){return rel==="<"?">":rel===">"?"<":rel==="\u2264"?"\u2265":rel==="\u2265"?"\u2264":rel;}
function noVarLeft(eq){return !hasVar(eq)&&groupsOf(eq).length===0;}
function relHolds(rel,c){return rel==="="?c===0:rel==="<"?c<0:rel===">"?c>0:rel==="\u2264"?c<=0:c>=0;}
function sumSide(S){return S.reduce(function(a,t){return a.add(t.c);},new F(0));}
function constantOutcome(eq){
  var l=sumSide(eq.L),r=sumSide(eq.R);
  if(eq.M){var mv=sumSide(eq.M);return (relHolds(eq.rel,l.cmp(mv))&&relHolds(eq.rel2,mv.cmp(r)))?"all":"none";}
  return relHolds(eq.rel,l.cmp(r))?"all":"none";

function nextGoal(eq){

  var PI=N("3.14159265358979",1,"\u03c0");

  function has(n,k){
    switch(n.t){
      case "s":return n.k===k;
      case "n":return false;
      case "+":case "*":return n.a.some(function(x){return has(x,k);});
      case "-":case "/":return has(n.a,k)||has(n.b,k);
      default:return has(n.a,k);
    }
  }
  function count(n,k){
    switch(n.t){
      case "s":return n.k===k?1:0;
      case "n":return 0;
      case "+":case "*":return n.a.reduce(function(s,x){return s+count(x,k);},0);
      case "-":case "/":return count(n.a,k)+count(n.b,k);
      default:return count(n.a,k);
    }
  }
  function symbols(n,out){
    out=out||[];

    else if(n.t==="+"||n.t==="*")n.a.forEach(function(x){symbols(x,out);});
    else if(n.t==="-"||n.t==="/"){symbols(n.a,out);symbols(n.b,out);}
    else if(n.a)symbols(n.a,out);
    return out;
  }

  /* ---------- rendering ---------- */
  var PREC={"+":1,"-":1,"*":2,"/":3,"^":4,"r":4,"f":4,"s":5,"n":5};
  function numHTML(n){
    if(n.h)return n.h;
    if(n.d===1)return String(n.n);
    return '<span class="frac"><span class="num">'+n.n+'</span><span class="den">'+n.d+"</span></span>";
  }
  function numText(n){return n.h?n.h:(n.d===1?String(n.n):n.n+"/"+n.d);}
  function wrap(s,need,got){return got<need?"("+s+")":s;}
  function html(n,parent){
    var p=PREC[n.t]||5,s;
    switch(n.t){
      case "s":s=symHTML(n.k);break;
      case "n":s=numHTML(n);break;
      case "+":s=n.a.map(function(x){return html(x,1);}).join(" + ");break;
      case "-":s=html(n.a,1)+" − "+html(n.b,2);break;
      case "*":s=numFirst(n.a).map(function(x){return html(x,2);}).join("");break;
      case "/":return '<span class="frac"><span class="num">'+html(n.a,0)+'</span><span class="den">'+html(n.b,0)+"</span></span>";
      case "^":s=html(n.a,4)+"<sup>2</sup>";break;
      case "r":return '<span class="rad"><span class="sign">√</span><span class="under">'+html(n.a,0)+"</span></span>";
      case "f":s='<span class="fn">'+FNAME[n.fn]+"</span>"+(n.a.t==="s"?"\u2009"+html(n.a,5):"("+html(n.a,0)+")");break;
    }
    return wrap(s,parent||0,p);
  }
  function text(n,parent){
    var p=PREC[n.t]||5,s;
    switch(n.t){
      case "s":s=symText(n.k);break;
      case "n":s=numText(n);break;
      case "+":s=n.a.map(function(x){return text(x,1);}).join(" + ");break;
      case "-":s=text(n.a,1)+" - "+text(n.b,2);break;
      case "*":s=numFirst(n.a).map(function(x){return text(x,2);}).join("");break;
      case "/":s=text(n.a,3)+"/"+text(n.b,4);break;
      case "^":s=text(n.a,4)+"^2";break;
      case "r":s="sqrt("+text(n.a,0)+")";break;
      case "f":s=FTEXT[n.fn]+"("+text(n.a,0)+")";break;
    }
    return wrap(s,parent||0,p);
  }
  function eqHTML(eq){return html(eq.l,0)+' <span class="rel">=</span> '+html(eq.r,0);}
  function eqText(eq){return text(eq.l,0)+" = "+text(eq.r,0);}

  /* ---------- isolating a symbol ---------- */
  /* Each step undoes one operation on the side holding the target. The move carries the
     wording a student would say out loud, so the same list drives the buttons, the hint,
     and the worked example. */
  function mkStep(op,arg,eq){
    var label;
    switch(op){
      case "sub":label="Subtract "+text(arg)+" from both sides";break;
      case "add":label="Add "+text(arg)+" to both sides";break;
      case "div":label="Divide both sides by "+text(arg);break;
      case "mul":label="Multiply both sides by "+text(arg);break;
      case "root":label="Take the square root of both sides";break;
      case "square":label="Square both sides";break;
      case "swap":label="Write the equation the other way round";break;
      case "fn":label="Undo the trig function on both sides";break;
      case "flipsub":label="Move the subtracted term across and swap sides";break;
      case "flipdiv":label="Swap the bottom of the fraction with the other side";break;
    }
    return {op:op,arg:arg||null,label:label,eq:eq,
      html:arg?label.replace(text(arg),html(arg)):label};
  }
  function isolate(formula,target){
    var eq={l:formula.l,r:formula.r},steps=[];
    if(count(eq.l,target)+count(eq.r,target)!==1)return null;
    if(has(eq.r,target)){eq={l:eq.r,r:eq.l};var sw=mkStep("swap",null,eq);sw.auto=true;steps.push(sw);}
    var guard=0;
    while(eq.l.t!=="s"){
      if(++guard>12)return null;
      var n=eq.l,l,r;
      if(n.t==="+"){
        var keep=n.a.filter(function(x){return has(x,target);}),drop=n.a.filter(function(x){return !has(x,target);});
        if(keep.length!==1)return null;
        var other=drop.length===1?drop[0]:ADD.apply(null,drop);
        l=keep[0];r=SUB(eq.r,other);
        eq={l:l,r:r};steps.push(mkStep("sub",other,eq));
      }else if(n.t==="-"){
        if(has(n.a,target)){eq={l:n.a,r:ADD(eq.r,n.b)};steps.push(mkStep("add",n.b,eq));}
        else{eq={l:n.b,r:SUB(n.a,eq.r)};steps.push(mkStep("flipsub",null,eq));}
      }else if(n.t==="*"){
        var kf=n.a.filter(function(x){return has(x,target);}),df=n.a.filter(function(x){return !has(x,target);});
        if(kf.length!==1)return null;
        var f=df[0];
        if(f.t==="n"&&f.n===1&&f.d!==1){ /* a half in front reads better as "multiply by 2" */
          var rest=df.slice(1),inner=rest.length?MUL.apply(null,[kf[0]].concat(rest)):kf[0];
          eq={l:inner,r:MUL(N(f.d),eq.r)};steps.push(mkStep("mul",N(f.d),eq));
        }else{ /* everything else that is multiplying the target goes in one division */
          var by=df.length===1?df[0]:MUL.apply(null,df);
          eq={l:kf[0],r:DIV(eq.r,by)};steps.push(mkStep("div",by,eq));
        }
      }else if(n.t==="/"){
        if(has(n.a,target)){eq={l:n.a,r:MUL(eq.r,n.b)};steps.push(mkStep("mul",n.b,eq));}
        else{eq={l:n.b,r:DIV(n.a,eq.r)};steps.push(mkStep("flipdiv",null,eq));}
      }else if(n.t==="^"){
        eq={l:n.a,r:RT(eq.r)};steps.push(mkStep("root",null,eq));
      }else if(n.t==="r"){
        eq={l:n.a,r:SQ(eq.r)};steps.push(mkStep("square",null,eq));
      }else if(n.t==="f"){
        var inv=INV[n.fn];
        eq={l:n.a,r:FN(inv,eq.r)};
        var st=mkStep("fn",null,eq);
        st.label="Take the "+(n.fn.charAt(0)==="a"?FTEXT[inv]:"inverse "+FTEXT[inv].replace("a",""))+" of both sides";
        st.label="Take the "+(n.fn.charAt(0)==="a"?{sin:"sine",cos:"cosine",tan:"tangent"}[inv]:"inverse "+{sin:"sine",cos:"cosine",tan:"tangent"}[n.fn])+" of both sides";
        st.html=st.label;
        steps.push(st);
      }else return null;
    }
    return {steps:steps,eq:eq,solved:eq.r};
  }

  /* ---------- evaluation ---------- */
  function align(a,b){
    if(Qty.unitSame(a.u,b.u))return [a,b];
    if(!sameDims(a.u,b.u))return [a,b];      /* let the quantity engine raise the real complaint */
    return [toBase(a),toBase(b)];
  }
  function addQ(a,b){var z=align(a,b);return z[0].add(z[1]);}
  function subQ(a,b){var z=align(a,b);return z[0].sub(z[1]);}
  function ev(n,vals){
    switch(n.t){
      case "s":
        var q=vals[n.k];
        if(!q)throw new Error("No value for "+n.k);
        return q instanceof Qty.Q?q:Qty.qty(q,sym(n.k).u);
      case "n":
        var top=Qty.qty(String(n.n),null,true);
        return n.d===1?top:top.div(Qty.qty(String(n.d),null,true));
      /* adding energy in joules to energy in kg m^2/s^2 is adding like to like, so when two
         terms carry the same dimensions under different names they drop to base units first
         and the answer is relabelled at the end */
      case "+":return n.a.map(function(x){return ev(x,vals);}).reduce(function(s,x){return addQ(s,x);});
      case "-":return subQ(ev(n.a,vals),ev(n.b,vals));
      case "*":return n.a.map(function(x){return ev(x,vals);}).reduce(function(s,x){return s.mul(x);});
      case "/":return ev(n.a,vals).div(ev(n.b,vals));
      case "^":return ev(n.a,vals).sq();
      case "r":return toBase(ev(n.a,vals)).sqrt();   /* J has no square root until it is kg, m and s */
      case "f":return trig(n.fn,ev(n.a,vals));
    }
    throw new Error("Bad node");
  }
  /* a sine or cosine takes an angle and gives a plain ratio; the inverses go the other way */
  function trig(fn,q){
    var deg=Qty.unitParse("\u00b0");
    if(fn.charAt(0)==="a"){
      if(Object.keys(q.u).length)throw new Error("An inverse trig function needs a plain ratio, not "+Qty.unitLabel(q.u));
      return new Qty.Q(Qty[fn+"Deg"](q.d),deg);
    }
    if(!Qty.unitSame(q.u,deg))throw new Error("A "+fn+" needs an angle in degrees");
    return new Qty.Q(Qty[fn+"Deg"](q.d),{});
  }
  /* ---------- units: derived names reduce to kg, m, s ---------- */
  /* charge is its own base unit, the coulomb; current and voltage follow from it */
  var BASE={kg:{kg:1},m:{m:1},s:{s:1},N:{kg:1,m:1,s:-2},J:{kg:1,m:2,s:-2},W:{kg:1,m:2,s:-3},Hz:{s:-1},"\u00b0":{deg:1},rad:{},
    C:{C:1},A:{C:1,s:-1},V:{kg:1,m:2,s:-2,C:-1},"\u03a9":{kg:1,m:2,s:-1,C:-2},Pa:{kg:1,m:-1,s:-2},
    /* chemistry's units: a liter is a volume, atmospheres, kilopascals and mmHg are pressures, and
       temperature and amount are their own dimensions. Only the dimension is checked here; the
       numbers are never converted by this table */
    L:{m:3},mL:{m:3},atm:{kg:1,m:-1,s:-2},kPa:{kg:1,m:-1,s:-2},mmHg:{kg:1,m:-1,s:-2},torr:{kg:1,m:-1,s:-2},K:{K:1},mol:{mol:1},
    /* heat: grams are a mass and a Celsius degree is a temperature step, the same size as a kelvin */
    g:{kg:1},"\u00b0C":{K:1}};
  function dims(u){
    var out={};
    Object.keys(u).forEach(function(k){
      var b=BASE[k];
      if(!b)throw new Error("Unknown unit "+k);
      Object.keys(b).forEach(function(d){out[d]=(out[d]||0)+b[d]*u[k];});
    });
    Object.keys(out).forEach(function(d){if(!out[d])delete out[d];});
    return out;
  }
  function toBase(q){return new Qty.Q(q.d,dims(q.u));}
  function sameDims(a,b){var x=dims(a),y=dims(b),kx=Object.keys(x),ky=Object.keys(y);
    return kx.length===ky.length&&kx.every(function(k){return x[k]===y[k];});}
  /* rename a computed unit to the one the symbol is normally written in (N/kg -> m/s^2) */
  function relabel(q,unit){
    var want=Qty.unitParse(unit||"");
    if(Qty.unitSame(q.u,want))return q;
    if(!sameDims(q.u,want))throw new Error("Units came out as "+Qty.unitLabel(q.u)+", not "+(unit||"a plain number"));
    return new Qty.Q(q.d,want);
  }
  /* ---------- working a formula out ----------
     A formula is one calculation, not a chain of separate ones, so it is worked at full
     precision and rounded once at the end, to the fewest significant figures the measurements
     carry. Rounding after every step is what turns 2 x 9.8 into 20 and 22.1 - 14.82 into 7.
     The operation-by-operation rules still apply where they are the lesson: chemistry Unit 1.
     A measured zero (dropped from rest) limits nothing, and exact numbers never do. */
  function fullPrecision(q){return new Qty.Q(new Qty.Dec(q.d.n,q.d.e,Infinity,true),q.u);}
  function leastSig(node,vals){
    var least=Infinity;
    symbols(node).forEach(function(k){
      var q=vals[k];
      if(!q)return;
      var d=q instanceof Qty.Q?q.d:q;
      if(d.exact||d.isZero())return;
      least=Math.min(least,d.sig);
    });

  }
  function evaluate(node,vals,unit){

      pure[k]=fullPrecision(q);

    return evaluate(iso.solved,vals,sym(target).u);
  }
