        var go=$("work").querySelector(".go");if(go)go.addEventListener("click",submit);
      }
      function gcdAll(list){var g=list[0];list.forEach(function(n){var a=g,b=n;while(b){var t=b;b=a%b;a=t;}g=a;});return g;}
      function submit(){
        if(busy)return;
        var a=countsOf(L,cl),b=countsOf(R,cr),els=elementList();
        var off=els.filter(function(s){return (a[s]||0)!==(b[s]||0);});
        if(off.length){
          var s=off[0];
          fb("Not balanced yet. "+Chem.bySymbol[s].n+": "+(a[s]||0)+" on the left, "+(b[s]||0)+" on the right.","bad");
          return;
        }
        var g=gcdAll(cl.concat(cr));
        if(g>1){fb("Balanced, but every coefficient divides by "+g+". An equation is written with the smallest whole numbers.","warn");return;}
        busy=true;
        var txt=L.map(function(f,i){return (cl[i]===1?"":cl[i])+Ions.html(f);}).join(" + ")+" \u2192 "+
          R.map(function(f,i){return (cr[i]===1?"":cr[i])+Ions.html(f);}).join(" + ");
        succeed(def,'<span class="m">'+txt+"</span>",{msg:def.why||"Every element has the same count on both sides.",
          result:'<span class="m">'+txt+"</span>"},cl.concat(cr),done);
      }
      render();
      function put(vals){vals.forEach(function(v,i){if(i<cl.length)cl[i]=v;else cr[i-cl.length]=v;});render();}
      return {auto:function(vals){put(vals);submit();},show:put,submit:submit};
    },
    /* Free-body diagram: put each force on the side it pushes or pulls. An empty side is an
       answer too, which is the point of the exercise. */
    fbd:function(def,done){
      var SPOT=[["up","\u2191","1 / 2"],["left","\u2190","2 / 1"],["right","\u2192","2 / 3"],["down","\u2193","3 / 2"]];
      showWork('<p class="q">'+def.prompt+'</p><div class="fbd">'+
        SPOT.map(function(s){return '<div class="fslot" data-dir="'+s[0]+'" role="button" tabindex="0" style="grid-area:'+s[2]+'"><span class="arr">'+s[1]+"</span></div>";}).join("")+
        '<div class="obj" style="grid-area:2 / 2">'+def.object+"</div></div>"+
        '<div class="chiprow"><span class="lab">Click a force, then a side:</span>'+
        def.forces.map(function(f){return '<button type="button" class="chip" data-val="'+f.k+'">'+Fx.symHTML(f.k)+" "+f.name+"</button>";}).join("")+"</div>"+
        '<button class="btn primary go" type="button">Check</button>');
      var armed=null,busy=false,slots=work.querySelectorAll(".fslot"),chips=work.querySelectorAll(".chip");
      function disarm(){armed=null;chips.forEach(function(c){c.classList.remove("armed");});}
      function fill(sl,k){sl.dataset.val=k;sl.innerHTML='<span class="arr">'+sl.dataset.arr+'</span><span class="m">'+Fx.symHTML(k)+"</span>";sl.classList.add("filled");}
      function clear(sl){delete sl.dataset.val;sl.innerHTML='<span class="arr">'+sl.dataset.arr+"</span>";sl.classList.remove("filled");}
      slots.forEach(function(sl){sl.dataset.arr=sl.querySelector(".arr").textContent;
        function act(){if(R.demo||busy)return;
          if(armed){fill(sl,armed);disarm();return;}
          if(sl.dataset.val!==undefined)clear(sl);}
        sl.addEventListener("click",act);
        sl.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();act();}});});
      chips.forEach(function(ch){ch.addEventListener("click",function(){if(R.demo||busy)return;
        var on=ch.classList.contains("armed");disarm();if(!on){armed=ch.dataset.val;ch.classList.add("armed");}});});
      function read(){var m={};slots.forEach(function(sl){if(sl.dataset.val!==undefined)m[sl.dataset.dir]=sl.dataset.val;});return m;}
      function go(){if(busy)return;var v=read(),res=def.check(v);
        if(res.ok){busy=true;succeed(def,def.describe(v),res,v,done);}else fb(res.msg,"bad");}
      work.querySelector(".go").addEventListener("click",go);
      function put(map){slots.forEach(function(sl){clear(sl);if(map[sl.dataset.dir])fill(sl,map[sl.dataset.dir]);});}
      return {auto:function(map){put(map);go();},show:put,submit:go};
    },
    /* Rearranging a formula: one legal move at a time, the same way the balance works.
       The engine supplies the correct move; the wrong buttons are moves that undo nothing. */
    isolate:function(def,done){
      var iso=Fx.isolate(def.formula,def.target);
      var steps=iso.steps.slice(),eq={l:def.formula.l,r:def.formula.r},busy=false,flip=false;
      /* the engine works with the target on the left; the screen keeps the formula the way
         the student picked it, which is the same equation read the other way */
      while(steps.length&&steps[0].auto){eq=steps[0].eq;steps.shift();flip=!flip;}
      function view(e){return flip?{l:e.r,r:e.l}:e;}
      showWork('<p class="q">'+def.prompt+'</p><div class="fxeq"></div><div class="fxmoves"></div>');
      var eqBox=work.querySelector(".fxeq"),moveBox=work.querySelector(".fxmoves"),opts=[];
      function findFn(n){
        if(!n||typeof n!=="object")return null;
        if(n.t==="f")return n.fn;
        var kids=n.t==="+"||n.t==="*"?n.a:(n.t==="-"||n.t==="/"?[n.a,n.b]:(n.a?[n.a]:[]));
        for(var i=0;i<kids.length;i++){var hit=findFn(kids[i]);if(hit)return hit;}
        return null;
      }
      function distractors(correct){
        var pool=[],syms=Fx.symbols(eq.l).concat(Fx.symbols(eq.r));
        syms.forEach(function(k){
          if(k===def.target)return;
          pool.push({op:"div",arg:Fx.S(k)});pool.push({op:"sub",arg:Fx.S(k)});
        });
        pool.push({op:"square"});pool.push({op:"root"});
        var fn=findFn(eq.l)||findFn(eq.r);
        if(fn)pool.push({op:"fn",fn:fn});
        var seen={},out=[];
        pool.forEach(function(m){
          var lab=moveLabel(m);
          if(lab===correct.label||seen[lab])return;
          seen[lab]=1;out.push({label:lab,html:moveHTML(m),move:m});
        });
        for(var i=out.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=out[i];out[i]=out[j];out[j]=t;}
        return out.slice(0,3);
      }
      var TRIGWORD={sin:"sine",cos:"cosine",tan:"tangent",asin:"sine",acos:"cosine",atan:"tangent"};
      function moveLabel(m){
        if(m.op==="fn")return "Take the "+(m.fn.charAt(0)==="a"?"":"inverse ")+TRIGWORD[m.fn]+" of both sides";
        if(m.op==="square")return "Square both sides";
        if(m.op==="root")return "Take the square root of both sides";
        if(m.op==="div")return "Divide both sides by "+Fx.text(m.arg);
        if(m.op==="mul")return "Multiply both sides by "+Fx.text(m.arg);
        if(m.op==="add")return "Add "+Fx.text(m.arg)+" to both sides";
        return "Subtract "+Fx.text(m.arg)+" from both sides";
      }
      function moveHTML(m){
        var lab=moveLabel(m);
        return m.arg?lab.replace(Fx.text(m.arg),'<span class="m">'+Fx.html(m.arg)+"</span>"):lab;
      }
      function why(m){
        var t='<span class="m">'+Fx.symHTML(def.target)+"</span>";
        if(m.op==="fn")return "The "+TRIGWORD[m.fn]+" is still multiplied by something. Clear that first, then undo the trig.";
        if(m.op==="square"||m.op==="root")return "There's no square to undo on "+t+"'s side yet.";
        if(m.op==="div")return "Nothing on that side is multiplied by <span class=\"m\">"+Fx.html(m.arg)+"</span>, so dividing undoes nothing.";
        return "<span class=\"m\">"+Fx.html(m.arg)+"</span> isn't added on "+t+"'s side, so subtracting it undoes nothing.";
      }
      function render(){
        eqBox.innerHTML='<span class="m">'+Fx.eqHTML(view(eq))+"</span>";
        var correct=steps[0];
        opts=distractors(correct).concat([{label:correct.label,html:correct.html,move:null}]);
        for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=opts[i];opts[i]=opts[j];opts[j]=t;}
        moveBox.innerHTML=opts.map(function(o,i){return '<button type="button" class="fxmove" data-i="'+i+'">'+o.html+"</button>";}).join("");
      }
      function apply(){
        var st=steps.shift();eq=st.eq;
        stackPush({html:Fx.eqHTML(view(eq)),cls:R.shown?"hinted":"",det:st.label});
        if(!steps.length){
          busy=true;
          fb("\u2713 "+Fx.symText(def.target)+" is by itself now.","ok");
          done(null,{result:Fx.eqHTML(view(eq))});
          return;
        }
        fb("\u2713 "+st.label+".","ok");render();
      }
      function choose(i){
        if(busy)return;
        var o=opts[i];
        if(o.move){fb(why(o.move),"bad");return;}
        apply();
      }
      moveBox.addEventListener("click",function(ev){var b=ev.target.closest("button");if(b&&!R.demo)choose(+b.dataset.i);});
      render();
      function markCorrect(){
        var idx=-1;opts.forEach(function(o,i){if(!o.move)idx=i;});
        moveBox.querySelectorAll("button").forEach(function(b,i){b.classList.toggle("pick",i===idx);});
        return idx;
      }
      return {
        auto:function(){var guard=0;while(!busy&&guard++<12){markCorrect();apply();}},
        one:function(){if(!busy){markCorrect();apply();}},
        plan:function(){return busy?null:{label:steps[0].label,html:steps[0].html,why:def.why||("Undo what is attached to "+Fx.symText(def.target)+", one step at a time.")};},
        show:function(){markCorrect();},
        /* used by the self-test: every wrong move must leave the equation where it was */
        wrongMoves:function(){var n=0,left=steps.length;opts.forEach(function(o,i){if(o.move){choose(i);if(steps.length!==left)n++;}});return n;},
        submit:function(){if(!busy){var i=markCorrect();if(i>=0)choose(i);}}
      };
    }
  };

  /* ---------- boot ---------- */
  function registerPack(p){packs.push(p);}
  function boot(cfg){
    CFG=cfg||{};S=load();save();
    if(CFG.subtitle)$("subtitle").textContent=CFG.subtitle;
    wireSession();updateSession();showHome();
  }
  function selfTest(opts){ /* used by the build's browser test: solve every activity through its own solve() path */
    opts=opts||{};
    var report={runs:0,fails:[]},TIMES=opts.runs||25;
    if(opts.collect)report.work=[];
    packs.forEach(function(pk){pk.units.forEach(function(u){u.topics.forEach(function(t){t.activities.forEach(function(act){
      for(var n=0;n<TIMES;n++){
        SUPMODE=n%2===0;
        openTopic(u,t);startActivity(act,{});report.runs++;
        var guard=0,pr0="";
        while(!R.solved&&guard++<60){
          if(opts.collect&&!pr0){var pe=$("stageBody").querySelector(".prompt");if(pe)pr0=pe.textContent;}
          if(B.active){var g=nextGoal(B.eq);if(g==="classify"){classify(constantOutcome(B.eq),true);continue;}
            if(!B.chips.some(function(ch){return ch.right&&ch.progress;}))report.fails.push(u.id+"/"+t.id+"/"+act.title+": no move on offer makes progress on "+eqText(B.eq));
            B.chips.forEach(function(ch){var r=runChip(B.eq,ch);if(!r||(stepsLeft(r.eq)<stepsLeft(B.eq))!==ch.progress)report.fails.push(u.id+"/"+t.id+"/"+act.title+": move “"+ch.label+"” misjudged on "+eqText(B.eq));});
            var st=botStep(B.eq);if(!st){report.fails.push(u.id+"/"+t.id+"/"+act.title+": solver stuck on "+eqText(B.eq));break;}
            B.goal=g;applyBot(st,true);continue;}
          var def=R.current,before=R.i;
          if(def.kind==="show"){R.ctl.auto();continue;}
          if(!def.solve){report.fails.push(u.id+"/"+t.id+"/"+act.title+": step "+R.i+" has no solve()");break;}
          /* negative check: a wrong answer must be rejected by the step's own checker */
          if(def.kind==="fill"){var bad=def.solve().map(function(){return "12345";});if(def.check(bad).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": fill accepted a wrong answer");}
          if(def.kind==="choice"){var okc=def.options.filter(function(o){return def.check(o.value).ok;}).length;report.choice=report.choice||{};var ck=act.title+" / "+def.goal;report.choice[ck]=Math.max(report.choice[ck]||0,okc);}
          if(def.kind==="slots"){var sv=def.solve(),keys=Object.keys(sv),rev={};keys.forEach(function(k,i){rev[k]=sv[keys[keys.length-1-i]];});
            if(keys.some(function(k){return String(rev[k])!==String(sv[k]);})&&def.check(rev).ok){report.slotRev=(report.slotRev||0)+1;report.slotRevWhere=report.slotRevWhere||{};report.slotRevWhere[act.title+" / "+def.goal]=true;}}
          if(def.kind==="grid"&&def.validate){
            /* a grid step that accepts wherever you click is teaching nothing. Nine points spread
               over the grid: at least one of them has to be turned away. */
            var probe=[[-4,-4],[-4,4],[4,-4],[4,4],[0,3],[3,0],[-3,0],[0,-3],[2,2]],okAll=true;
            for(var pi=0;pi<probe.length&&okAll;pi++){
              try{if(!def.validate(probe[pi],[]).ok)okAll=false;}catch(e){okAll=false;}
            }
            if(okAll)report.fails.push(u.id+"/"+t.id+"/"+act.title+": the grid accepted every point tried");
          }
          if(def.kind==="bars"){
            var bv=def.solve(),k0=def.chart.forms[0].key,off={};
            Object.keys(bv).forEach(function(k){off[k]=bv[k];});off[k0]=(off[k0]||0)+1;
            if(def.check(off).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": a bar chart one block off was accepted");
          }
          if(def.kind==="config"){
            /* a configuration in the wrong order, or with one electron too many, has to be refused */
            var cv=def.solve().map(function(x){return x.slice();}),bad=cv.map(function(x){return x.slice();});
            if(bad.length>1){var tmp=bad[bad.length-1];bad[bad.length-1]=bad[bad.length-2];bad[bad.length-2]=tmp;}
            else bad[0][1]+=1;
            if(def.check(bad).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": a configuration out of order was accepted");
            var over=cv.map(function(x){return x.slice();});over[over.length-1][1]+=1;
            if(def.check(over).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": a configuration with an extra electron was accepted");
          }
          if(def.kind==="orbitals"){
            /* the same electrons paired up before every box has one (Hund's rule broken), or one
               electron missing, has to be refused */
            var ov=def.solve(),bk=null;
            Object.keys(ov).forEach(function(k){
              var n=ov[k].reduce(function(a,b){return a+b;},0),box=ov[k].length;
              if(bk||n<2||n>=2*box-0||box<2)return;
              var pairs=ov[k].map(function(){return 0;}),left=n;
              for(var bi=0;bi<box&&left>0;bi++){pairs[bi]=Math.min(2,left);left-=pairs[bi];}
              if(pairs.join()!==ov[k].join()){bk={};Object.keys(ov).forEach(function(k2){bk[k2]=ov[k2].slice();});bk[k]=pairs;}
            });
            if(bk&&def.check(bk).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": an orbital diagram that breaks Hund's rule was accepted");
            var short={},ks=Object.keys(ov);ks.forEach(function(k2){short[k2]=ov[k2].slice();});
            var lk=ks[ks.length-1],li=short[lk].lastIndexOf(short[lk].filter(function(x){return x>0;}).pop());
            if(li>=0){short[lk][li]-=1;if(def.check(short).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": an orbital diagram one electron short was accepted");}
          }
          if(def.kind==="reduce"){
            /* a reduction with a wrong equivalent value, or one group called the wrong kind, has to be refused */
            var mv=def.solve();
            var badv=mv.map(function(m){return {ids:m.ids.slice(),kind:m.kind,value:m.value};});badv[badv.length-1].value="999";
            if(def.check(badv).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": a wrong equivalent resistance was accepted");
            var badk=mv.map(function(m){return {ids:m.ids.slice(),kind:m.kind,value:m.value};});badk[0].kind=badk[0].kind==="S"?"P":"S";
            if(def.check(badk).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": series and parallel were confused and accepted");
          }
          if(def.kind==="ptpick"){
            var zv=def.solve();
            if(def.check(zv===1?2:zv-1).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": the wrong element was accepted");
          }
          if(def.kind==="pickset"){
            /* a set that is not the right set has to be turned away, including the near miss of
               leaving one member out */
            var pv=def.solve();
            var miss=pv.length?pv.slice(0,pv.length-1):[0];
            if(def.check(miss).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": an incomplete set was accepted");
            var extra=pv.concat([def.items.length-1]).filter(function(x,i,a){return a.indexOf(x)===i;});
            if(extra.length!==pv.length&&def.check(extra).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": an oversized set was accepted");
          }
          if(def.kind==="twoway"){
            /* the same negative check the other kinds get: a selection that is not the group,
               or counts that are not the counts, has to be turned away */
            var tv=def.solve();
            if(def.mode==="pick"){
              var wrong=tv.length>1?tv.slice(0,tv.length-1):["TT"];
              if(def.check(wrong).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": a wrong group was accepted");
            }else{
              var junk={};Object.keys(tv).forEach(function(k){junk[k]="999";});
              if(def.check(junk).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": wrong counts were accepted");
            }
          }
          if(def.kind==="proton"){
            /* the H has to leave the right species and land on the right one */
            var pr=def.solve(),others=def.species.map(function(x,i){return i;}).filter(function(i){return def.species[i].side==="L";});
            var wrongTo=others.filter(function(i){return i!==pr.to&&i!==pr.from;})[0];
            if(def.check({from:pr.to,h:0,to:pr.from}).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": the proton was accepted going the wrong way");
            if(wrongTo!==undefined&&def.check({from:pr.from,h:pr.h,to:wrongTo}).ok)report.fails.push(u.id+"/"+t.id+"/"+act.title+": the proton was accepted landing on the wrong species");
          }
          if(def.kind==="isolate"&&R.ctl.wrongMoves&&R.ctl.wrongMoves())report.fails.push(u.id+"/"+t.id+"/"+act.title+": a wrong rearranging move was accepted");
          if(def.kind==="grid"){
            /* every point a student is asked to plot has to be a grid corner inside the grid */
            var gg=def.grid,xs=gg.xsnap||1,ys=gg.ysnap||1;def.solve().forEach(function(pt){var cx=(pt[0]-gg.min)/xs,cy=(pt[1]-gg.ymin)/ys;
              if(!(cx===Math.round(cx)&&cy===Math.round(cy)&&pt[0]>=gg.min&&pt[0]<=gg.max&&pt[1]>=gg.ymin&&pt[1]<=gg.ymax))
              report.fails.push(u.id+"/"+t.id+"/"+act.title+": point ("+pt+") cannot be clicked on the grid");});
            def.solve().forEach(function(pt){if(R.i===before)R.ctl.auto([pt]);});}
          else R.ctl.auto(def.solve());
          if(R.i===before&&!R.solved){report.fails.push(u.id+"/"+t.id+"/"+act.title+": step "+R.i+" ("+def.kind+") solve() was rejected: "+$("fbMsg").textContent);break;}
        }
        if(!R.solved&&report.fails.length===0)report.fails.push(u.id+"/"+t.id+"/"+act.title+": did not finish");
        if(opts.collect){
          var lines=[];
          $("stackList").querySelectorAll("li .ln").forEach(function(ln){
            var m=ln.querySelector(".m"),tag=ln.querySelector(".tag");
            if(m)lines.push({h:m.innerHTML,t:tag?tag.textContent:""});
          });
          var ans=$("stageBody").querySelector(".answer");
          report.work.push({where:u.id+"/"+t.id+"/"+act.title,lines:lines,answer:ans?ans.innerHTML:"",prompt:pr0});
        }
      }
    });});});});
    SUPMODE=null;
    return report;
  }
  function demoTest(){
    var report={runs:0,fails:[]};
    packs.forEach(function(pk){pk.units.forEach(function(u){u.topics.forEach(function(t){t.activities.forEach(function(act){
      for(var n=0;n<8;n++){
        openTopic(u,t);startActivity(act,{demo:true});report.runs++;
        var clicks=0;while(!R.solved&&clicks<120){if(!demoFn){report.fails.push(u.id+"/"+t.id+"/"+act.title+": no Next action at step "+R.i);break;}demoGo();clicks++;}
        if(!R.solved)report.fails.push(u.id+"/"+t.id+"/"+act.title+": worked example did not finish");
        else if(!$("stage").querySelector(".answer"))report.fails.push(u.id+"/"+t.id+"/"+act.title+": no answer shown");
      }
    });});});});
    return report;
  }
  return {registerPack:registerPack,boot:boot,selfTest:selfTest,demoTest:demoTest,_supportMode:function(v){SUPMODE=v===undefined?null:v;},_chips:function(){return (B.chips||[]).map(function(c){return {label:c.label,right:!!c.right,progress:!!c.progress};});},_miss:function(){fb("(test miss)","bad");},
    H:{num:num,esc:esc,pn:pn,ptText:ptText,lineHTML:lineHTML,lineText:lineText,mEq:mEq,Grid:Grid,MIN:MIN},
    _state:function(){return {R:R,B:B,S:S,V:V};},_packs:function(){return packs;}};
})();

</script>
<script>
/* ===================== PHYSICS PACK =====================
   Unit 1: motion (2023 COS standard 1). Every numbered problem runs the same four moves a
   physics student has to make: name the unknown, choose an equation that fits the givens,
   rearrange it, then substitute and compute with units and significant figures. */
(function(){
  var H=Suite.H,num=H.num,MIN=H.MIN;
  function M(h){return '<span class="m">'+h+'</span>';}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(0,i),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function dec(n,places){return n.toFixed(places);}
  function q(v,u,exact){return Qty.qty(v,u,!!exact);}
  function numCheck(input,correct,opts){
    opts=opts||{};
    var r=Qty.checkAnswer(input,correct,opts);
    if(r.ok)return {ok:true,msg:opts.why||"Correct."};
    if(r.why==="format")return {ok:false,msg:"Type a number, like 9.80 or 2.5e3."};
    if(r.why==="sigfigs")return {ok:false,msg:"Right value, wrong number of significant figures. "+(opts.sigWhy||"The measurement with the fewest significant figures sets the limit.")};
    return {ok:false,msg:opts.valueWhy||"That value isn't right yet. Check the arithmetic."};
  }

  /* ---------- writing a formula with boxes to fill, and with the numbers in place ---------- */
  var PREC={"+":1,"-":1,"*":2,"/":3,"^":4,"r":4,"f":4,"s":5,"n":5};
  function flat(list){return [].concat.apply([],list);}
  function tmpl(n,parent){
    var p=PREC[n.t]||5,out;
    switch(n.t){
      case "s":out=[{slot:n.k,label:Fx.sym(n.k).h}];break;
      case "n":out=[Fx.html(n)];break;
      case "+":out=flat(n.a.map(function(x,i){return (i?[" + "]:[]).concat(tmpl(x,1));}));break;
      case "-":out=tmpl(n.a,1).concat([" − "],tmpl(n.b,2));break;
      case "*":out=flat(Fx.numFirst(n.a).map(function(x,i){return n.a.length>1&&!(x.t==="n"&&(x.d!==1||i===0))?["("].concat(tmpl(x,0),[")"]):tmpl(x,2);}));break;
      case "/":return [{frac:[tmpl(n.a,0),tmpl(n.b,0)]}];
      case "^":out=tmpl(n.a,4).concat(["<sup>2</sup>"]);break;
      case "r":return ['<span class="rad"><span class="sign">√</span><span class="under">'].concat(tmpl(n.a,0),["</span></span>"]);
      case "f":out=['<span class="fn">'+Fx.fnHTML(n.fn)+"</span>"].concat(n.a.t==="s"?[" "].concat(tmpl(n.a,5)):["("].concat(tmpl(n.a,0),[")"]));break;
    }
    if((parent||0)>p)out=["("].concat(out,[")"]);
    return out;
  }
  function withValues(n,vals,parent){
    var p=PREC[n.t]||5,out;
    switch(n.t){
      case "s":out=num(vals[n.k]);break;
      case "n":out=Fx.html(n);break;
      case "+":out=n.a.map(function(x){return withValues(x,vals,1);}).join(" + ");break;
      case "-":out=withValues(n.a,vals,1)+" − "+withValues(n.b,vals,2);break;
      case "*":out=Fx.numFirst(n.a).map(function(x,i){
        var part=withValues(x,vals,0);
        return n.a.length>1&&!(x.t==="n"&&(x.d!==1||i===0))?"("+part+")":part;}).join("");break;
      case "/":return '<span class="frac"><span class="num">'+withValues(n.a,vals,0)+'</span><span class="den">'+withValues(n.b,vals,0)+"</span></span>";
      case "^":out=withValues(n.a,vals,4)+"<sup>2</sup>";break;
      case "r":return '<span class="rad"><span class="sign">√</span><span class="under">'+withValues(n.a,vals,0)+"</span></span>";
      case "f":out='<span class="fn">'+Fx.fnHTML(n.fn)+"</span>"+(n.a.t==="s"?" "+withValues(n.a,vals,5):"("+withValues(n.a,vals,0)+")");break;
    }
    return (parent||0)>p?"("+out+")":out;
  }
  /* a number standing where a symbol was needs parentheses around it when it multiplies */
  function withParens(n,vals){
    return withValues(n,vals,0).replace(/−/g,"−");
  }

  function uPhrase(k){
    var lab=Qty.unitLabel(Qty.unitParse(Fx.sym(k).u));
    if(lab==="°")return "degrees";
    return lab?lab:"no units (it is a ratio)";
  }

  /* ---------- the four moves, built once and reused by every numbered problem ---------- */
  function symOpt(k){return {label:M(Fx.symHTML(k))+" "+Fx.sym(k).name,value:k};}
  function stepUnknown(p,d,api){
    if(p.scene)p.scene(p,api);
    else api.stageSet('<p class="prompt">'+p.story+"</p>");
    var others=p.f.syms.filter(function(k){return k!==p.unknown&&k!=="g";});
    var opts=shuffle(others.slice(0,2).concat([p.unknown])).map(symOpt);
    return {kind:"choice",goal:"Name the unknown",prompt:"What is the problem asking for?",options:opts,
      hint:"Read the last sentence. The quantity it asks for is the one you don't have a number for.",
      solve:function(){return p.unknown;},
      check:function(v){
        if(v===p.unknown)return {ok:true,msg:"You're after "+Fx.sym(p.unknown).name+", in "+uPhrase(p.unknown)+".",result:M(Fx.symHTML(p.unknown))+" = ?"};
        return {ok:false,msg:"The problem gives you that one. Look for the quantity with no number."};}};
  }
  function stepPick(p){
    /* a distractor has to hold the unknown, so it looks usable, and has to need a measurement the
       problem never gave, so it genuinely is not. Same-family formulas come first. */
    var pool=Fx.FORMULAS.filter(function(f){
      if(f.id===p.f.id)return false;
      if(f.syms.indexOf(p.unknown)<0)return false;
      return f.syms.some(function(k){return k!==p.unknown&&p.vals[k]===undefined&&k!=="g";});
    });
    var fam=pool.filter(function(f){return f.tags.indexOf(p.f.tags[0])>=0;});
    var rest=pool.filter(function(f){return fam.indexOf(f)<0&&
      (f.tags.indexOf("kinematics")>=0||f.tags.indexOf("motion")>=0||f.tags.indexOf("forces")>=0);});
    var wrong=shuffle(fam).concat(shuffle(rest));
    var opts=shuffle(wrong.slice(0,2).concat([p.f])).map(function(f){return {label:M(f.html),value:f.id};});
    return {kind:"choice",goal:"Choose an equation",prompt:"Which equation uses what you have?",options:opts,
      hint:"List what the problem gives you. The equation you want holds those and the unknown, and nothing else.",
      solve:function(){return p.f.id;},
      check:function(v){
        if(v===p.f.id)return {ok:true,msg:"Everything in it is either given or the unknown.",result:M(p.f.html)};
        var f=Fx.byId(v),missing=f.syms.filter(function(k){return k!==p.unknown&&p.vals[k]===undefined;});
        return {ok:false,msg:missing.length?"That one also needs "+missing.map(function(k){return Fx.sym(k).name;}).join(" and ")+", and the problem doesn't give "+(missing.length>1?"those":"that")+".":"That equation doesn't hold the quantity you're after."};}};
  }
  function stepIsolate(p){
    return {kind:"isolate",goal:"Get the unknown alone",prompt:"Rearrange it so "+M(Fx.symHTML(p.unknown))+" is by itself.",
      formula:p.f,target:p.unknown,
      hint:"Work outwards: undo what is added or subtracted first, then what multiplies or divides.",
      why:"Undo the operations attached to "+Fx.symText(p.unknown)+", one at a time, on both sides.",
      solve:function(){return "all";}};
  }
  function stepSub(p){
    var node=p.solved,keys=Fx.symbols(node);
    return {kind:"slots",goal:"Put the numbers in",prompt:"Put each measurement where it belongs.",
      template:[Fx.symHTML(p.unknown)+" = "].concat(tmpl(node,0)),
      chips:shuffle(keys.map(function(k){return p.vals[k];})),
      hint:"Match each number to its symbol. "+keys.map(function(k){return Fx.symText(k)+" is "+p.vals[k]+" "+uPhrase(k);}).join(", ")+".",
      describe:function(v){return M(withParens(node,v));},
      solve:function(){var o={};keys.forEach(function(k){o[k]=p.vals[k];});return o;},
      check:function(v){
        var wrongKey=keys.filter(function(k){return String(v[k])!==String(p.vals[k]);})[0];
        if(wrongKey)return {ok:false,msg:"Check the box for "+Fx.symText(wrongKey)+": the problem gives "+Fx.sym(wrongKey).name+" as "+p.vals[wrongKey]+" "+uPhrase(wrongKey)+"."};
        return {ok:true,msg:"Every measurement is in its place.",result:M(Fx.symHTML(p.unknown)+" = "+withParens(node,v))};}};
  }
  function stepCompute(p){
    var unit=Qty.unitHTML(p.ans.u),sig=p.ans.d.sig;
    return {kind:"fill",goal:"Work it out",prompt:"Work out "+M(Fx.symHTML(p.unknown))+", to the right number of significant figures.",
      fields:[{label:M(Fx.symHTML(p.unknown))+" =",placeholder:"number"}],
      hint:"The answer carries "+sig+" significant figure"+(sig===1?"":"s")+", because that is the fewest any measurement in it has."+(Qty.unitLabel(p.ans.u)?" Units: "+Qty.unitLabel(p.ans.u)+".":""),
      solve:function(){return [Qty.text(p.ans.d,sig)];},
      check:function(v){
        var r=numCheck(v[0],p.ans,{sig:sig,why:"That's "+p.ans.text()+"."});
        if(r.ok)r.result=M(Fx.symHTML(p.unknown)+" = "+p.ans.html());
        return r;},
      after:function(){}};
  }
  /* one numbered problem: name the unknown, pick an equation, rearrange, substitute, compute */
  function job(o){
    var steps=[stepUnknown];
    if(o.pick)steps.push(function(p){return stepPick(p);});
    if(o.rearrange)steps.push(function(p){return stepIsolate(p);});
    steps.push(function(p){return stepSub(p);});
    steps.push(function(p){return stepCompute(p);});
    /* a question that only makes sense once the number is in hand, like whether the mass mattered */
    if(o.post)steps=steps.concat(o.post);
    return {title:o.title,ask:o.ask||"",
      gen:function(){
        for(var tries=0;tries<40;tries++){
          var p=o.gen();
          p.f=Fx.byId(p.fid);
          if(o.scene)p.scene=o.scene;
          var iso=Fx.isolate(p.f,p.unknown);
          if(!iso)continue;
          if(o.rearrange&&!iso.steps.filter(function(s){return !s.auto;}).length)continue;
          if(!o.rearrange&&iso.steps.filter(function(s){return !s.auto;}).length)continue;
          p.solved=iso.solved;
          var qs={};Object.keys(p.vals).forEach(function(k){qs[k]=q(p.vals[k],Fx.sym(k).u);});
          try{p.ans=Fx.solveFor(p.f,p.unknown,qs);}catch(e){continue;}
          /* a negative answer is a wrong problem in most of the pack, but in a collision it is
             the answer: it says the thing ends up moving the other way */
          if(p.ans.d.isZero())continue;
          if(p.ans.d.sign()<0&&!o.allowNeg)continue;
          return p;
        }
        throw new Error("physics: could not build a problem for "+o.title);
      },
      steps:steps,
      finish:function(p){return M(Fx.symHTML(p.unknown)+" = "+p.ans.html())+'<small class="sub">'+p.f.text+", rearranged and worked out.</small>";}};
  }

  /* ---------- stories ---------- */
  var MOVERS=["A cart","A runner","A skateboarder","A truck","A cyclist","A train car","A go-kart"];
  var FALLERS=["A ball","A rock","A wrench","A set of keys","A marble"];

  var A_vavg=job({title:"Average velocity",pick:false,rearrange:false,
    gen:function(){
      var x=dec(rnd(120,900)/10,1),t=dec(rnd(15,90)/10,1);
      return {fid:"vavg",unknown:"vav",vals:{x:x,t:t},
        story:pick(MOVERS)+" travels "+x+" m in "+t+" s. What is its average velocity?"};}});

  var A_vavgRe=job({title:"Distance and time",pick:false,rearrange:true,
    gen:function(){
      var v=dec(rnd(15,240)/10,1),other=pick(["x","t"]);
      if(other==="x"){var t=dec(rnd(20,120)/10,1);return {fid:"vavg",unknown:"x",vals:{vav:v,t:t},
        story:pick(MOVERS)+" holds an average velocity of "+v+" m/s for "+t+" s. How far does it travel?"};}
      var x=dec(rnd(200,1500)/10,1);
      return {fid:"vavg",unknown:"t",vals:{vav:v,x:x},
        story:pick(MOVERS)+" covers "+x+" m at an average velocity of "+v+" m/s. How long does that take?"};}});

  var A_accel=job({title:"Acceleration from a change in velocity",pick:false,rearrange:false,
    gen:function(){
      var dv=dec(rnd(30,180)/10,1),t=dec(rnd(15,80)/10,1);
      return {fid:"aavg",unknown:"a",vals:{dv:dv,t:t},
        story:pick(MOVERS)+" speeds up by "+dv+" m/s over "+t+" s. What is its acceleration?"};}});

  var A_vat=job({title:"Velocity after a time",pick:false,rearrange:true,
    gen:function(){
      var v0=dec(rnd(10,120)/10,1),a=dec(rnd(10,45)/10,1),t=dec(rnd(20,90)/10,1);
      var v=dec(Number(v0)+Number(a)*Number(t),1),which=pick(["a","t"]);
      if(which==="a")return {fid:"vat",unknown:"a",vals:{v:v,v0:v0,t:t},
        story:pick(MOVERS)+" speeds up from "+v0+" m/s to "+v+" m/s in "+t+" s. What is its acceleration?"};
      return {fid:"vat",unknown:"t",vals:{v:v,v0:v0,a:a},
        story:pick(MOVERS)+" speeds up from "+v0+" m/s to "+v+" m/s at "+a+" m/s². How long does that take?"};}});

  var A_kin=job({title:"Choose and use a kinematics equation",pick:true,rearrange:true,
    gen:function(){
      var kind=pick(["a_from_v2","x_from_v2","v0_from_vat","a_from_vat","t_from_vat"]);
      var v0=dec(rnd(15,90)/10,1),a=dec(rnd(10,40)/10,1),t=dec(rnd(20,80)/10,1);
      var v=dec(Number(v0)+Number(a)*Number(t),1);
      var x=dec((Number(v)*Number(v)-Number(v0)*Number(v0))/(2*Number(a)),1);
      var who=pick(MOVERS);
      if(kind==="a_from_v2")return {fid:"v2ax",unknown:"a",vals:{v:v,v0:v0,x:x},
        story:who+" goes from "+v0+" m/s to "+v+" m/s over "+x+" m. What is its acceleration?"};
      if(kind==="x_from_v2")return {fid:"v2ax",unknown:"x",vals:{v:v,v0:v0,a:a},
        story:who+" goes from "+v0+" m/s to "+v+" m/s at "+a+" m/s². How far does it travel while doing it?"};
      if(kind==="v0_from_vat")return {fid:"vat",unknown:"v0",vals:{v:v,a:a,t:t},
        story:who+" reaches "+v+" m/s after "+t+" s at "+a+" m/s². How fast was it going to start with?"};
      if(kind==="a_from_vat")return {fid:"vat",unknown:"a",vals:{v:v,v0:v0,t:t},
        story:who+" goes from "+v0+" m/s to "+v+" m/s in "+t+" s. What is its acceleration?"};
      return {fid:"vat",unknown:"t",vals:{v:v,v0:v0,a:a},
        story:who+" goes from "+v0+" m/s to "+v+" m/s at "+a+" m/s². How long does that take?"};}});

  var A_fall=job({title:"Free fall",pick:false,rearrange:true,
    gen:function(){
      var t=dec(rnd(10,45)/10,1);
      var which=pick(["v","x"]);
      if(which==="v")return {fid:"vat",unknown:"t",vals:{v:dec(9.80*Number(t),1),v0:"0.0",a:"9.80"},
        story:pick(FALLERS)+" is dropped from rest and reaches "+dec(9.80*Number(t),1)+" m/s. Air resistance is small enough to ignore, and g = 9.80 m/s². How long does it fall?"};
      var v=dec(9.80*Number(t),1);
      return {fid:"v2ax",unknown:"x",vals:{v:v,v0:"0.0",a:"9.80"},
        story:pick(FALLERS)+" is dropped from rest and is falling at "+v+" m/s when it lands. With g = 9.80 m/s², how far did it fall?"};}});

  /* ---------- motion graphs ---------- */
  /* A labelled axes-and-line picture. It lives in the same wrapper the algebra grids use, so
     the graph stays on screen when the problem is solved and the answer appears beside it. */
  function MGraph(o){
    var ns="http://www.w3.org/2000/svg",S=340,pad=44,W=S-pad-12,Hh=S-pad-16;
    var svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+S+" "+S);svg.setAttribute("role","img");
    var X=function(x){return pad+x/o.xmax*W;},Y=function(y){return S-pad-(y-(o.ymin||0))/(o.ymax-(o.ymin||0))*Hh;};
    function el(t,a,txt){var e=document.createElementNS(ns,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;svg.appendChild(e);return e;}
    var i;
    for(i=0;i<=o.xmax;i+=o.xstep){el("line",{x1:X(i),y1:Y(o.ymin||0),x2:X(i),y2:Y(o.ymax),"class":"gl"});
      el("text",{x:X(i),y:S-pad+14,"class":"tick","text-anchor":"middle"},String(i));}
    for(i=(o.ymin||0);i<=o.ymax;i+=o.ystep){el("line",{x1:X(0),y1:Y(i),x2:X(o.xmax),y2:Y(i),"class":"gl"});
      el("text",{x:pad-5,y:Y(i)+4,"class":"tick","text-anchor":"end"},String(i));}
    el("line",{x1:X(0),y1:Y(o.ymin||0),x2:X(o.xmax),y2:Y(o.ymin||0),"class":"ax"});
    el("line",{x1:X(0),y1:Y(o.ymin||0),x2:X(0),y2:Y(o.ymax),"class":"ax"});
    el("text",{x:X(o.xmax/2),y:S-8,"class":"axlab","text-anchor":"middle"},o.xlabel);
    el("text",{x:12,y:Y((o.ymax+(o.ymin||0))/2),"class":"axlab","text-anchor":"middle",transform:"rotate(-90 12 "+Y((o.ymax+(o.ymin||0))/2)+")"},o.ylabel);
    if(o.fill)o.fill.forEach(function(seg){
      el("polygon",{points:[[seg[0],0],[seg[1],0]].concat([[seg[1],seg[3]],[seg[0],seg[2]]]).map(function(q){return X(q[0])+","+Y(q[1]);}).join(" "),"class":"area"});});
    el("polyline",{points:o.points.map(function(q){return X(q[0])+","+Y(q[1]);}).join(" "),"class":"mline"});
    o.points.forEach(function(q){el("circle",{cx:X(q[0]),cy:Y(q[1]),r:3.5,"class":"pt"});});
    return {svg:svg};
  }
  function segs(points){
    var out=[];for(var i=1;i<points.length;i++)out.push([points[i-1],points[i]]);return out;
  }
  function slopeOf(s){return (s[1][1]-s[0][1])/(s[1][0]-s[0][0]);}

  var A_readXT={title:"Read a position-time graph",
    gen:function(){
      var pts=[[0,0]],t=0,x=0,n=3;
      for(var i=0;i<n;i++){var dt=rnd(2,4),v=pick([-3,-2,-1,0,1,2,3]);t+=dt;x=Math.max(0,Math.min(18,x+v*dt));pts.push([t,x]);}
      var sg=segs(pts),i2=rnd(0,sg.length-1);
      var v2=slopeOf(sg[i2]);
      return {pts:pts,seg:i2,v:v2,tmax:Math.ceil(t/2)*2,
        ans:Qty.qty(dec(v2,1),"m/s")};},
    steps:[
      function(p,d,api){
        var g=MGraph({points:p.pts,xmax:p.tmax,xstep:2,ymax:20,ystep:4,xlabel:"time (s)",ylabel:"position (m)"});
        api.stageGrid(g,'<p class="prompt">Between '+p.pts[p.seg][0].toFixed(1)+" s and "+p.pts[p.seg+1][0].toFixed(1)+" s, what is the object doing?</p>");
        d.g=g;
        var truth=p.v>0.05?"forward":(p.v<-0.05?"back":"still");
        return {kind:"choice",goal:"Read the slope",prompt:"On that stretch the object is:",
          options:shuffle([{label:"moving forward",value:"forward"},{label:"moving back toward the start",value:"back"},{label:"sitting still",value:"still"}]),
          hint:"On a position-time graph, going up means moving forward, going down means coming back, and flat means staying put.",
          solve:function(){return truth;},
          check:function(v){
            if(v===truth)return {ok:true,msg:truth==="still"?"A flat line means the position isn't changing.":"The line "+(truth==="forward"?"rises":"falls")+", so the position is "+(truth==="forward"?"increasing":"decreasing")+"."};
            return {ok:false,msg:"Look at whether the line rises, falls, or stays flat there. This graph plots position, not speed."};}};},
      function(p,d){
        var s=[p.pts[p.seg],p.pts[p.seg+1]],rise=dec(s[1][1]-s[0][1],1),run=dec(s[1][0]-s[0][0],1);
        return {kind:"fill",goal:"Velocity from the slope",prompt:"Velocity is the slope: rise over run. What is it there?",
          fields:[{label:M("v")+" =",placeholder:"m/s"}],
          hint:"The position changes by "+rise+" m over "+run+" s. Divide.",
          solve:function(){return [Qty.text(p.ans.d,p.ans.d.sig)];},
          check:function(v){
            var r=numCheck(v[0],p.ans,{sig:p.ans.d.sig,valueWhy:"Rise over run: "+rise+" m divided by "+run+" s."});
            if(r.ok)r.result=M("v = "+p.ans.html());
            return r;}};}
    ],
    finish:function(p){return M("v = "+p.ans.html())+'<small class="sub">Slope of a position-time graph is velocity.</small>';}};

  var A_readVT={title:"Read a velocity-time graph",
    gen:function(){
      var v0=rnd(0,4)*2,v1=v0+pick([2,4,6,-2,-4]),t1=rnd(2,5)*2;
      if(v1<0)v1=v0+4;
      var pts=[[0,v0],[t1,v1],[t1+4,v1]];
      var a=(v1-v0)/t1,area=(v0+v1)/2*t1;
      return {pts:pts,tmax:t1+4,vmax:Math.max(12,Math.ceil((Math.max(v0,v1)+2)/4)*4),t1:t1,v0:v0,v1:v1,
        a:Qty.qty(dec(a,2),"m/s2"),x:Qty.qty(dec(area,1),"m"),ask:pick(["a","x"])};},
    steps:[
      function(p,d,api){
        var g=MGraph({points:p.pts,xmax:p.tmax,xstep:2,ymax:p.vmax,ystep:4,xlabel:"time (s)",ylabel:"velocity (m/s)",
          fill:p.ask==="x"?[[0,p.t1,p.v0,p.v1]]:null});
        api.stageGrid(g,'<p class="prompt">'+(p.ask==="a"?"What is the acceleration over the first "+p.t1+" s?":"How far does it travel in the first "+p.t1+" s?")+"</p>");
        d.g=g;
        var opts=shuffle([{label:"the slope of the line",value:"slope"},{label:"the area under the line",value:"area"},{label:"the height of the line",value:"height"}]);
        var truth=p.ask==="a"?"slope":"area";
        return {kind:"choice",goal:"Decide what to read",prompt:"On a velocity-time graph, that quantity is:",options:opts,
          hint:"Slope is change in velocity over change in time, which is acceleration. Area is velocity times time, which is displacement.",
          solve:function(){return truth;},
          check:function(v){
            if(v===truth)return {ok:true,msg:truth==="slope"?"Slope here is change in velocity over time, which is acceleration.":"Area here is velocity times time, which is displacement."};
            if(v==="height")return {ok:false,msg:"The height is the velocity itself at that moment."};
            return {ok:false,msg:truth==="slope"?"Area under a velocity-time graph gives displacement, not acceleration.":"Slope of a velocity-time graph gives acceleration, not distance."};}};},
      function(p,d){
        var want=p.ask==="a"?p.a:p.x;
        return {kind:"fill",goal:"Work it out",prompt:p.ask==="a"?"Find the acceleration.":"Find the displacement.",
          fields:[{label:M(p.ask==="a"?"a":"Δx")+" =",placeholder:p.ask==="a"?"m/s²":"m"}],
          hint:p.ask==="a"?"Velocity goes from "+p.v0+" m/s to "+p.v1+" m/s in "+p.t1+" s.":"The shaded shape is a trapezoid: average height times width, or the rectangle plus the triangle.",
          solve:function(){return [Qty.text(want.d,want.d.sig)];},
          check:function(v){

    ],

  var A_equilibrium={title:"Balance the forces",

    steps:[

          check:function(v){

            if(a.ok&&b.ok)return {ok:true,msg:"That pair is what the third force has to undo.",
              result:M("Σ"+Fx.symHTML("Fx")+" = "+p.X.html()+",  Σ"+Fx.symHTML("Fy")+" = "+p.Y.html())};

      function(p){

    finish:function(p){return M(Fx.symHTML("F")+" = "+p.R.html()+" at "+p.backAngle.html())+

  /* ============ Unit 5: projectile motion ============
     One motion across and another down, sharing only a clock. Every number below comes from
     the kinematics already in the library, applied to one direction at a time. */
  var N_vx=MUL_(S_("v0"),FN_("cos",S_("th"))),N_v0y=MUL_(S_("v0"),FN_("sin",S_("th")));
  function TrajectoryScene(o){
    var W=340,H=200,svg=document.createElementNS(SVGNS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("role","img");svg.setAttribute("class","wide");
    var L=42,Rt=322,B=170,T=26;
    var pts=o.points,xs=pts.map(function(q){return q[0];}),ys=pts.map(function(q){return q[1];});
    var xmax=Math.max.apply(null,xs)||1,ymax=Math.max.apply(null,ys)||1;
    function X(x){return L+(Rt-L)*(x/xmax);}
    function Y(y){return B-(B-T)*(y/ymax);}
    svgEl(svg,"line",{x1:L-14,y1:B,x2:Rt,y2:B,"class":"ground"});
    if(o.platform)svgEl(svg,"line",{x1:L-14,y1:Y(pts[0][1]),x2:L,y2:Y(pts[0][1]),"class":"ground"});
    svgEl(svg,"polyline",{points:pts.map(function(q){return X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1);}).join(" "),"class":"traj"});
    /* the dashed drop lines make the two motions separate to the eye */
    (o.ticks||[]).forEach(function(i){
      var q=pts[i];
      svgEl(svg,"line",{x1:X(q[0]),y1:Y(q[1]),x2:X(q[0]),y2:B,"class":"tick2"});
      svgEl(svg,"circle",{cx:X(q[0]),cy:Y(q[1]),r:3.5,"class":"fhead"});
    });
    svgEl(svg,"circle",{cx:X(pts[0][0]),cy:Y(pts[0][1]),r:5,"class":"fhead"});
    /* the launch label sits to the right of the start, where the curve has not gone yet, so it
       never runs off the left edge */
    if(o.startLabel)svgEl(svg,"text",{x:X(pts[0][0])+7,y:Y(pts[0][1])-10,"class":"flab","text-anchor":"start"},o.startLabel);
    if(o.endLabel){
      var ex=X(pts[pts.length-1][0]);
      svgEl(svg,"text",{x:Math.min(ex,334),y:B+15,"class":"flab","text-anchor":ex>270?"end":"middle"},o.endLabel);
    }
    if(o.topLabel){
      var hi=0;pts.forEach(function(q,i){if(q[1]>pts[hi][1])hi=i;});
      svgEl(svg,"text",{x:X(pts[hi][0]),y:Y(pts[hi][1])-9,"class":"flab","text-anchor":"middle"},o.topLabel);
    }
    return {svg:svg};
  }
  function arcPoints(vx,v0y,h0,g){
    var pts=[],T=(v0y+Math.sqrt(v0y*v0y+2*g*h0))/g;
    for(var i=0;i<=40;i++){var t=T*i/40;pts.push([vx*t,h0+v0y*t-0.5*g*t*t]);}
    return pts;
  }

  var A_independence={title:"Two motions at once",

          options:shuffle([{label:"they land together",value:"same"},{label:"the rolled one",value:"rolled"},{label:"the dropped one",value:"dropped"}]),

      function(p){

  /* ---------- Unit 6: circular motion and gravitation ---------- */

  /* The object on its circular path. The velocity arrow lies along the tangent and the force
     arrow points at the center, which is the whole lesson of the unit in one picture. */
  function CircleScene(o){
    var W=340,H=190,svg=document.createElementNS(SVGNS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("role","img");svg.setAttribute("class","wide");
    var cx=168,cy=93,R=60,th=(o.angle===undefined?50:o.angle)*Math.PI/180;
    var ox=cx+R*Math.cos(th),oy=cy-R*Math.sin(th);
    svgEl(svg,"circle",{cx:cx,cy:cy,r:R,"class":"orbitpath"});
    svgEl(svg,"circle",{cx:cx,cy:cy,r:3.5,"class":"fhead2"});
    /* the radius, the velocity and the force all lie along or across the same line, so every
       label steps sideways off it rather than sitting on top of the next one */
    var px=Math.sin(th),py=Math.cos(th);
    if(o.radius){
      svgEl(svg,"line",{x1:cx,y1:cy,x2:ox,y2:oy,"class":"tick2"});
      svgLab(svg,(cx+ox)/2+px*13,(cy+oy)/2+py*13+4,"flab","middle",o.radius);
    }
    /* counterclockwise, so the tangent points where the object is about to be */
    var tx=-Math.sin(th),ty=-Math.cos(th),fx=(cx-ox)/R,fy=(cy-oy)/R;

  /* Two objects before and after, with an arrow on anything that is moving. The arrow lengths are
     to scale against the fastest thing in the picture, so a recoil really does look slower than
     the bullet. */
  function CollisionScene(o){
    var W=340,H=190,svg=document.createElementNS(SVGNS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("role","img");svg.setAttribute("class","wide");
    var rows=[{y:52,lab:"before",items:o.before},{y:136,lab:"after",items:o.after}];
    var fast=1;
    rows.forEach(function(r){r.items.forEach(function(it){fast=Math.max(fast,Math.abs(it.v||0));});});
    rows.forEach(function(r){
      svgEl(svg,"line",{x1:46,y1:r.y+22,x2:W-14,y2:r.y+22,"class":"ground"});
      svgLab(svg,4,r.y+18,"flab","start",r.lab);
      r.items.forEach(function(it,i){
        var w=it.big?34:24,h=it.big?24:18,x=it.x===undefined?(70+i*130):it.x,y=r.y+22-h;
        svgEl(svg,"rect",{x:x,y:y,width:w,height:h,rx:3,"class":"body"});
        svgLab(svg,x+w/2,y-6,"flab","middle",it.lab||"");
        if(it.v){
          var len=14+36*Math.min(1,Math.abs(it.v)/fast),dir=it.v>0?1:-1;
          var from=dir>0?x+w+4:x-4;
          if(dir<0)len=Math.min(len,from-50);        /* never run back over the row label */
          arrow(svg,from,y+h/2,from+dir*len,y+h/2,"farrow");
          svgLab(svg,from+dir*(len+4),y+h/2+4,"flab",dir>0?"start":"end",it.vlab||"");
        }
      });
    });
    return {svg:svg};
  }

  var UNIT_P9={id:"P9",short:"Charges",name:"Unit 9 · Electrostatics",equations:["coulomb","qne"],topics:[

  /* ---------- Unit 10: current and circuits (standards 6b to 6d, for the Feb 22 to Mar 12 window) ---------- */

  var OHM="Ω";
  var NICE_R=["2.00","3.00","4.00","5.00","6.00","8.00","10.0","12.0","15.0","18.0","20.0","24.0","30.0","36.0","40.0","60.0"];
  var NICE_I=["0.250","0.500","0.750","1.00","1.50","2.00","2.50","3.00","4.00"];
  /* a value that three significant figures write exactly, with a decimal point showing */
  function exact3(x){
    if(!(x>0))return null;var t=x.toPrecision(3);
    if(/e/.test(t)||t.indexOf(".")<0||Math.abs(+t-x)>1e-9*Math.max(1,x))return null;
    return t;
  }
  function leaf(){return {t:"R",r:pick(NICE_R)};}
  var SHAPES={
    series2:function(){return {t:"S",kids:[leaf(),leaf()]};},
    series3:function(){return {t:"S",kids:[leaf(),leaf(),leaf()]};},
    par2:function(){return {t:"P",kids:[leaf(),leaf()]};},
    par3:function(){return {t:"P",kids:[leaf(),leaf(),leaf()]};},
    mixSP:function(){return {t:"S",kids:[leaf(),{t:"P",kids:[leaf(),leaf()]}]};},
    mixPS:function(){return {t:"P",kids:[leaf(),{t:"S",kids:[leaf(),leaf()]}]};},
    mixSPP:function(){return {t:"S",kids:[{t:"P",kids:[leaf(),leaf()]},leaf(),{t:"P",kids:[leaf(),leaf()]}]};},
    mixSP3:function(){return {t:"S",kids:[{t:"P",kids:[leaf(),leaf(),leaf()]},leaf()]};}};
  function numberLeaves(n,c){c=c||{i:0};if(n.t==="R"){n.id=String(++c.i);return;}n.kids.forEach(function(k){numberLeaves(k,c);});}
  function reqNum(n){if(n.t==="R")return +n.r;var v=n.kids.map(reqNum);
    return n.t==="S"?v.reduce(function(a,b){return a+b;},0):1/v.reduce(function(a,b){return a+1/b;},0);}
  function allNodes(n,out){out=out||[];out.push(n);if(n.kids)n.kids.forEach(function(k){allNodes(k,out);});return out;}
  function leavesOf(n){return allNodes(n).filter(function(x){return x.t==="R";});}
  /* hand out current and voltage from the top: in series the current is shared, in parallel the voltage */
  function assignVI(n,V,I){n.V=V;n.I=I;if(!n.kids)return;
    n.kids.forEach(function(k){var rk=reqNum(k);if(n.t==="S")assignVI(k,I*rk,I);else assignVI(k,V,V/rk);});}
  /* keep drawing until every equivalent, every current and every voltage comes out exactly at three
     significant figures, so a student's rounded answer at one step is exactly the value the next
     step needs */
  function niceCircuit(shape){
    for(var t=0;t<3000;t++){
      var tree=SHAPES[shape]();numberLeaves(tree);
      var nodes=allNodes(tree),ok=nodes.every(function(n){return n.t==="R"||exact3(reqNum(n));});
      if(!ok)continue;
      var I=+pick(NICE_I),Rt=reqNum(tree),V=I*Rt;
      if(!exact3(V)||V<1.5||V>=100)continue;
      assignVI(tree,V,I);
      if(!nodes.every(function(n){return exact3(n.V)&&exact3(n.I);}))continue;
      /* two identical parallel resistors make the reciprocal step trivial; keep them rare */
      if(nodes.some(function(n){return n.t==="P"&&n.kids.every(function(k){return k.t==="R"&&k.r===n.kids[0].r;});})&&Math.random()<0.7)continue;
      return {tree:tree,V:exact3(V),I:exact3(I),Rt:exact3(Rt)};
    }
    throw new Error("physics: no circuit for "+shape);
  }
  function cloneTree(n){var o={t:n.t,id:n.id,r:n.r,q:n.q};if(n.kids)o.kids=n.kids.map(cloneTree);return o;}
  /* the circuit a reducer works on: leaves carry their resistance as a quantity */
  function CircuitModel(tree){
    var root=cloneTree(tree);
    leavesOf(root).forEach(function(l){l.q=q(l.r,OHM);});
    function parentOf(id){var hit=null;allNodes(root).forEach(function(n){if(n.kids&&n.kids.some(function(k){return k.t==="R"&&k.id===id;}))hit=n;});return hit;}
    function sub(ids){return ids.slice().sort().join("");}
    return {
      root:function(){return root;},
      count:function(){return leavesOf(root).length;},
      done:function(){return root.t==="R";},
      labelFor:function(ids){return "R<sub>"+sub(ids)+"</sub>";},
      tryGroup:function(ids,kind){
        if(ids.length<2)return {ok:false,msg:"Pick at least two resistors to combine."};
        var ps=ids.map(parentOf);
        if(ps.some(function(p){return !p||p!==ps[0];}))return {ok:false,msg:"Those are not simply in series or in parallel with each other. Find a smaller group first: resistors in one row, or branches that are each a single resistor."};
        if(ps[0].t!==kind)return {ok:false,msg:ps[0].t==="S"?"Those are in series: the current has only one path, through one and then the other.":"Those are in parallel: each one connects across the same two points, so the current splits between them."};
        return {ok:true,msg:kind==="S"?"Yes, in series: one path, the same current through each.":"Yes, in parallel: side by side, the same voltage across each."};
      },
      expected:function(ids,kind){
        var qs=ids.map(function(id){return leavesOf(root).filter(function(l){return l.id===id;})[0].q;});
        if(kind==="S"){var d=qs[0].d;for(var i=1;i<qs.length;i++)d=Qty.add(d,qs[i].d);return new Qty.Q(d,OHM);}
        var sig=Math.min.apply(null,qs.map(function(x){return x.d.sig;})),inv=qs.reduce(function(a,x){return a+1/x.d.num();},0);
        return new Qty.Q(Qty.fromNumber(1/inv,sig),OHM);
      },
      apply:function(ids,val){
        var p=parentOf(ids[0]),idx=p.kids.findIndex(function(k){return k.t==="R"&&ids.indexOf(k.id)>=0;});
        var nl={t:"R",id:sub(ids),q:val,r:Qty.text(val.d)};
        p.kids=p.kids.filter(function(k){return !(k.t==="R"&&ids.indexOf(k.id)>=0);});
        p.kids.splice(idx,0,nl);
        if(p.kids.length===1){
          if(p===root)root=nl;
          else allNodes(root).forEach(function(n){if(n.kids){var j=n.kids.indexOf(p);if(j>=0)n.kids[j]=nl;}});
        }
      }};
  }
  /* the order a teacher would reduce in: innermost groups first */
  function solveMoves(tree){
    var m=CircuitModel(tree),out=[];
    while(!m.done()){
      var inner=allNodes(m.root()).filter(function(n){return n.kids&&n.kids.every(function(k){return k.t==="R";});})[0];
      var ids=inner.kids.map(function(k){return k.id;}).sort(),want=m.expected(ids,inner.t);
      out.push({ids:ids,kind:inner.t,value:Qty.text(want.d)});m.apply(ids,want);
    }
    return out;
  }
  function checkMoves(tree,moves){
    var m=CircuitModel(tree);
    for(var i=0;i<moves.length;i++){
      var mv=moves[i],g=m.tryGroup(mv.ids,mv.kind);
      if(!g.ok)return {ok:false,msg:g.msg};
      var want=m.expected(mv.ids,mv.kind);
      if(!Qty.checkAnswer(String(mv.value),want,{}).ok)return {ok:false,msg:"That equivalent resistance is not right yet."};
      m.apply(mv.ids,want);
    }
    if(!m.done())return {ok:false,msg:"There is more than one resistor left."};
    var last=m.root().q;
    return {ok:true,msg:"The whole network acts like one resistor of "+Qty.text(last.d)+" "+OHM+".",result:M("R<sub>total</sub> = "+last.html())};
  }

  /* ---- drawing a series-parallel circuit ---- */
  function csize(n){
    if(n.t==="R")return {w:86,h:66};
    var ss=n.kids.map(csize);
    if(n.t==="S")return {w:ss.reduce(function(a,s){return a+s.w;},0),h:Math.max.apply(null,ss.map(function(s){return s.h;}))};
    return {w:Math.max.apply(null,ss.map(function(s){return s.w;}))+36,h:ss.reduce(function(a,s){return a+s.h;},0)};
  }
  function wire(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" class="cw"/>';}
  function rname(id){return '<tspan>R</tspan><tspan dy="4" font-size="10">'+id+'</tspan>';}
  function cdraw(n,x,y,w,out,o){
    if(n.t==="R"){
      var cx=x+w/2,z=[];for(var i=0;i<=8;i++)z.push((cx-20+i*5)+","+(y+(i===0||i===8?0:(i%2?-7:7))));
      var hl=o.hl&&o.hl===n.id?" rsel":"";
      out.push(wire(x,y,cx-20,y),wire(cx+20,y,x+w,y));
      out.push('<g class="res'+(o.pick?" pickable":"")+hl+'" data-rid="'+n.id+'"><rect x="'+(cx-26)+'" y="'+(y-26)+'" width="52" height="52" fill="transparent"/>'+
        '<polyline points="'+z.join(" ")+'" class="zz"/><text x="'+cx+'" y="'+(y-14)+'" class="rlab" text-anchor="middle">'+rname(n.id)+'</text>'+
        '<text x="'+cx+'" y="'+(y+24)+'" class="rval" text-anchor="middle">'+n.r+' '+OHM+'</text></g>');
      return;
    }
    var sz=csize(n);
    if(n.t==="S"){var cur=x;n.kids.forEach(function(k){var kw=csize(k).w;cdraw(k,cur,y,kw,out,o);cur+=kw;});if(cur<x+w)out.push(wire(cur,y,x+w,y));return;}
    var top=y-sz.h/2,ys=[];
    n.kids.forEach(function(k){var kh=csize(k).h,yk=top+kh/2;ys.push(yk);cdraw(k,x+18,yk,w-36,out,o);top+=kh;});
    out.push(wire(x,y,x+18,y),wire(x+w-18,y,x+w,y),wire(x+18,ys[0],x+18,ys[ys.length-1]),wire(x+w-18,ys[0],x+w-18,ys[ys.length-1]));
  }
  function circuitSVG(root,vtxt,o){
    o=o||{};var sz=csize(root),x0=96,yc=20+sz.h/2,yb=sz.h+44,bx=62,by=(yc+yb)/2,W=x0+sz.w+24,out=[];
    cdraw(root,x0,yc,sz.w,out,o);
    out.push(wire(bx,yc,x0,yc),wire(x0+sz.w,yc,x0+sz.w,yb),wire(x0+sz.w,yb,bx,yb),wire(bx,yc,bx,by-7),wire(bx,by+7,bx,yb));
    out.push('<line x1="'+(bx-15)+'" y1="'+(by-7)+'" x2="'+(bx+15)+'" y2="'+(by-7)+'" class="cw"/><line x1="'+(bx-8)+'" y1="'+(by+7)+'" x2="'+(bx+8)+'" y2="'+(by+7)+'" class="cw thick"/>');
    out.push('<text x="'+(bx-20)+'" y="'+(by+5)+'" class="rval" text-anchor="end">'+vtxt+'</text>');
    return '<svg viewBox="0 0 '+W+' '+(yb+14)+'" class="circ" style="width:'+Math.min(460,W*1.15)+'px" role="img" aria-label="circuit diagram">'+out.join("")+'</svg>';
  }
  function circuitStage(api,root,vtxt,prompt,o){
    api.stageSet((prompt?'<p class="prompt">'+prompt+'</p>':"")+'<div class="gridwrap"><div class="gridcard circhost">'+circuitSVG(root,vtxt,o)+'</div></div>');
  }

  function reduceStep(c,api,prompt){
    return {kind:"reduce",goal:"Reduce the circuit",
      prompt:"Click resistors that are in series (one path) or in parallel (side by side), combine them, and keep going until one resistor is left.",
      fresh:function(){return CircuitModel(c.tree);},
      draw:function(m){circuitStage(api,m.root(),c.V+" V",prompt,{pick:true});},
      hint:"Start inside: a group of resistors side by side, or a row with nothing branching off. Series: add them. Parallel: 1/R = 1/R₁ + 1/R₂ + …",
      why:"Series resistances add. Parallel resistances combine by reciprocals, and the result is smaller than any one of them.",
      solve:function(){return solveMoves(c.tree);},
      check:function(moves){return checkMoves(c.tree,moves);}};
  }

  var A_reduce={title:"Equivalent resistance",ask:"Boil the circuit down to one resistor.",
    gen:function(){return {c:niceCircuit(pick(["series2","series3","par2","par3","mixSP","mixPS","mixSPP","mixSP3"]))};},
    steps:[function(p,d,api){return reduceStep(p.c,api,"Find the total resistance of this circuit.");}],
    finish:function(p){return M("R<sub>total</sub> = "+p.c.Rt+" "+OHM)+'<small class="sub">Series resistances add; parallel ones combine to less than the smallest.</small>';}};

  function totalCurrentStep(p,api){
    var Iq=q(p.c.I,"A");
    circuitStage(api,p.c.tree,p.c.V+" V","The circuit acts like one "+p.c.Rt+" "+OHM+" resistor across the "+p.c.V+" V battery.");
    return {kind:"fill",goal:"Current from the battery",prompt:"How much current leaves the battery?",fields:[{label:"I<sub>total</sub>",placeholder:"A"}],
      hint:"Ohm's law on the whole circuit: I = V / R<sub>total</sub> = "+p.c.V+" / "+p.c.Rt+".",
      solve:function(){return [p.c.I];},
      check:function(v){
        var r=numCheck(v[0],Iq,{why:"The battery sees the whole network as one resistor.",valueWhy:"Divide the battery voltage by the total resistance."});
        if(r.ok)r.result=M("I<sub>total</sub> = "+p.c.V+" / "+p.c.Rt+" = "+p.c.I)+" A";
        return r;}};
  }
  var A_totalCurrent={title:"Current from the battery",ask:"Reduce first, then Ohm's law.",
    gen:function(){return {c:niceCircuit(pick(["series2","series3","par2","par3","mixSP","mixPS"]))};},
    steps:[function(p,d,api){return reduceStep(p.c,api,"How much current leaves the battery?");},
      function(p,d,api){return totalCurrentStep(p,api);}],
    finish:function(p){return M("I<sub>total</sub> = "+p.c.I+" A")+'<small class="sub">'+p.c.V+" V across "+p.c.Rt+" "+OHM+'</small>';}};

  /* standard 6d: Ohm's law applied to every resistor. Series shares current; parallel shares voltage. */
  function parentIn(tree,leafNode){var hit=null;allNodes(tree).forEach(function(n){if(n.kids&&n.kids.indexOf(leafNode)>=0)hit=n;});return hit;}
  function leafStep(p,k,api){
    var L=leavesOf(p.c.tree)[k],par=parentIn(p.c.tree,L),Iq=q(exact3(L.I),"A"),Vq=q(exact3(L.V),"V");
    circuitStage(api,p.c.tree,p.c.V+" V","Current through and voltage across R<sub>"+L.id+"</sub>.",{hl:L.id});
    var rule=par.t==="S"?
      "R<sub>"+L.id+"</sub> is in series in its row, so it carries that row's whole current, "+exact3(par.I)+" A. Then V = IR.":
      "R<sub>"+L.id+"</sub> is one branch of a parallel group, so it has that group's whole voltage, "+exact3(par.V)+" V, across it. Then I = V/R.";
    return {kind:"fill",goal:"Ohm's law on R"+L.id,prompt:"For R<sub>"+L.id+"</sub> ("+L.r+" "+OHM+"): what current goes through it, and what voltage is across it?",
      fields:[{label:"I<sub>"+L.id+"</sub>",placeholder:"A"},{label:"V<sub>"+L.id+"</sub>",placeholder:"V"}],
      hint:rule,
      solve:function(){return [exact3(L.I),exact3(L.V)];},
      check:function(v){
        var a=numCheck(v[0],Iq,{valueWhy:"Check the current: "+(par.t==="S"?"in series it is the same as the rest of its row.":"in parallel, divide the group's voltage by this resistance.")});
        if(!a.ok)return a;
        var b=numCheck(v[1],Vq,{valueWhy:"Check the voltage: V = IR for this one resistor."});
        if(!b.ok)return b;
        return {ok:true,msg:par.t==="S"?"Same current as its row; its share of the voltage is IR.":"Same voltage as its group; its share of the current is V/R.",
          result:M("R<sub>"+L.id+"</sub>: "+exact3(L.I)+" A, "+exact3(L.V)+" V")};}};
  }
  function everywhereGen(){return {c:niceCircuit(pick(["series2","series3","par2","par3","mixSP","mixPS","mixSP3"]))};}
  var A_everywhere={title:"Ohm's law everywhere",ask:"Every resistor gets its own current and voltage.",
    gen:everywhereGen,
    steps:[function(p,d,api){return reduceStep(p.c,api,"Find the current through and voltage across every resistor.");},
      function(p,d,api){return totalCurrentStep(p,api);},
      function(p,d,api){return leafStep(p,0,api);},
      function(p,d,api){return leafStep(p,1,api);},
      function(p,d,api){return leavesOf(p.c.tree).length>2?leafStep(p,2,api):null;},
      function(p,d,api){return leavesOf(p.c.tree).length>3?leafStep(p,3,api):null;},
      function(p){return sumCheck(p);}],
    finish:function(p){
      var rows=leavesOf(p.c.tree).map(function(L){return "<tr><td>R<sub>"+L.id+"</sub></td><td>"+L.r+" "+OHM+"</td><td>"+exact3(L.I)+" A</td><td>"+exact3(L.V)+" V</td></tr>";}).join("");
      return '<table class="vir"><tr><th></th><th>R</th><th>I</th><th>V</th></tr>'+rows+"</table>"+'<small class="sub">'+p.c.V+" V battery, "+p.c.I+' A total</small>';}};
  /* a closing question that ties it together: the voltages around a series row add to the battery,
     the currents in parallel branches add to the total */
  function sumCheck(p){
    var root=p.c.tree,ser=root.t==="S";
    return {kind:"choice",goal:"Check it adds up",prompt:ser?"Add up the voltages across the pieces in series. What do you get?":"Add up the currents in the parallel branches. What do you get?",
      options:ser?[{label:"the battery voltage, "+p.c.V+" V",value:"ok"},{label:"more than the battery voltage",value:"more"},{label:"less than the battery voltage",value:"less"}]:
        [{label:"the total current, "+p.c.I+" A",value:"ok"},{label:"more than the total current",value:"more"},{label:"less than the total current",value:"less"}],
      hint:ser?"Energy per coulomb: everything the battery gives is used up once around the loop.":"Charge is conserved: whatever splits at a junction joins back up.",
      solve:function(){return "ok";},

  }

  /* numbered problems: the four moves, with the equation choice mattering for power */
  var DEVICES=[{n:"a toaster",V:"120.",R:["14.5","16.0","18.5"]},{n:"a phone charger's cord",V:"5.00",R:["2.50","3.20","4.00"]},
    {n:"a flashlight bulb",V:"3.00",R:["6.00","8.50","12.0"]},{n:"a space heater",V:"120.",R:["9.60","12.0","11.5"]},
    {n:"a car headlight",V:"12.0",R:["2.40","3.00","2.75"]}];
  var A_ohm=job({title:"Ohm's law",pick:false,rearrange:true,ask:"V = IR, any way round.",
    gen:function(){
      var d=pick(DEVICES),R=pick(d.R),which=pick(["I","R","V"]);
